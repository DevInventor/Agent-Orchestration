<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent-Orchestration · pipeline</title>
<style>
  :root{
    --ink:#0B0E14; --panel:#11151D; --panel-2:#0E121A; --line:#1C2430;
    --text:#C7CEDA; --muted:#697384; --faint:#3C4552;
    --planner:#F2C14E; --coder:#4FA6E0; --tester:#E06C9F; --reviewer:#5FCF9B;
    --orchestrator:#8A93A3; --ok:#5FCF9B; --warn:#F2C14E; --bad:#E0655F;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink);color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.5;display:flex;flex-direction:column;height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);padding:16px 22px 0;flex:0 0 auto;background:var(--panel-2)}
  .topline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:.04em}
  .brand b{color:var(--coder)}
  .feature{font-size:15px;font-weight:600;color:#EAEEF4}
  .status-chip{margin-left:auto;font-family:var(--mono);font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border:1px solid var(--line);border-radius:2px}
  .status-running{color:var(--coder);border-color:color-mix(in srgb,var(--coder) 45%,var(--line))}
  .status-done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
  .status-blocked,.status-failed{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
  .status-awaiting_approval{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}

  /* progress bar */
  .bar-wrap{position:relative;height:6px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .bar-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--coder);
    transition:width .5s cubic-bezier(.4,0,.2,1),background .4s}
  .bar-meta{display:flex;justify-content:space-between;margin:8px 0 2px}
  .pct{font-family:var(--mono);font-size:12px;color:var(--text)}

  /* ---------- assembly line (signature) ---------- */
  .line{display:flex;align-items:center;gap:0;padding:18px 4px 20px;overflow-x:auto}
  .station{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:96px;position:relative}
  .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--faint);background:var(--panel)}
  .st-label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
  .st-phase{font-size:10px;color:var(--faint);font-family:var(--mono)}
  .connector{flex:1;height:1.5px;background:var(--line);min-width:26px;position:relative;top:-16px}
  .station.pending .dot{opacity:.55}
  .station.active .dot{border-color:currentColor;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent);animation:pulse 1.6s ease-in-out infinite}
  .station.active .st-label{color:currentColor}
  .station.complete .dot{border-color:currentColor;background:currentColor}
  .station.complete .st-label{color:var(--text)}
  .st-planner{color:var(--planner)} .st-coder{color:var(--coder)}
  .st-tester{color:var(--tester)} .st-reviewer{color:var(--reviewer)}
  /* fix-loop return arc between coder and tester */
  .loop-arc{position:relative;top:-16px;min-width:70px;height:34px;display:flex;align-items:flex-end;justify-content:center}
  .loop-arc svg{position:absolute;top:-16px;left:0;width:100%;height:34px;overflow:visible}
  .loop-arc path{fill:none;stroke:var(--tester);stroke-width:1.5;stroke-dasharray:3 3;opacity:.5}
  .loop-badge{font-family:var(--mono);font-size:10px;color:var(--tester);
    background:var(--ink);padding:0 5px;position:relative;z-index:2}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,currentColor 6%,transparent)}}

  /* ---------- body grid ---------- */
  main{flex:1 1 auto;display:grid;grid-template-columns:1fr 340px;gap:1px;background:var(--line);min-height:0}
  .col{background:var(--ink);display:flex;flex-direction:column;min-height:0}
  .col-head{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .col-head .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

  /* left: comms feed */
  .feed{overflow-y:auto;padding:6px 0;flex:1 1 auto}
  .msg{display:grid;grid-template-columns:14px 1fr;gap:11px;padding:9px 18px;border-left:2px solid transparent}
  .msg:hover{background:var(--panel-2)}
  .msg .rail{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--orchestrator)}
  .msg .body{min-width:0}
  .msg .m-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .m-agent{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .m-type{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);padding:0 5px;border-radius:2px}
  .m-time{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}
  .m-summary{color:var(--text);margin-top:2px}
  .m-detail{color:var(--muted);font-size:13px;margin-top:3px}
  .m-ref{font-family:var(--mono);font-size:11px;color:var(--coder);margin-top:3px}
  .a-planner{color:var(--planner)} .a-coder{color:var(--coder)}
  .a-tester{color:var(--tester)} .a-reviewer{color:var(--reviewer)}
  .a-orchestrator{color:var(--orchestrator)}
  .msg.t-error{border-left-color:var(--bad)}
  .msg.t-question{border-left-color:var(--warn)}

  /* right: task summary */
  .summary{overflow-y:auto;padding:16px 18px;flex:1 1 auto;display:flex;flex-direction:column;gap:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}
  .now-card{border:1px solid var(--line);border-radius:4px;padding:13px;background:var(--panel)}
  .now-card .eyebrow{margin-bottom:6px}
  .now-agent{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
  .now-task{margin-top:5px;color:#EAEEF4}
  .task-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .task{display:flex;align-items:center;gap:9px;padding:6px 2px;font-size:13px}
  .task .box{width:13px;height:13px;border:1.5px solid var(--faint);border-radius:2px;flex:0 0 auto;position:relative}
  .task.done .box{background:var(--ok);border-color:var(--ok)}
  .task.done .box::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid var(--ink);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
  .task.in_progress .box{border-color:var(--coder);animation:pulse 1.6s infinite;color:var(--coder)}
  .task.blocked .box{border-color:var(--bad)}
  .task.done .t-title{color:var(--muted);text-decoration:line-through}
  .t-owner{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}

  /* per-service strip (multi-service runs) */
  .svc-strip{display:flex;flex-direction:column;gap:7px}
  .svc-row{border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--panel)}
  .svc-top{display:flex;align-items:baseline;gap:8px}
  .svc-name{font-family:var(--mono);font-size:12px;color:#EAEEF4;font-weight:600}
  .svc-state{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
  .svc-state.running{color:var(--coder)} .svc-state.done{color:var(--ok)}
  .svc-state.blocked,.svc-state.failed{color:var(--bad)} .svc-state.pending{color:var(--muted)}
  .svc-meta{display:flex;gap:12px;margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .svc-meta b{color:var(--text);font-weight:600}
  .svc-group-head{font-family:var(--mono);font-size:11px;color:var(--muted);margin:10px 0 4px}
  /* service badge on task rows + message feed */
  .m-service,.t-service{font-family:var(--mono);font-size:10px;color:var(--muted);
    border:1px solid var(--line);padding:0 5px;border-radius:2px}
  .empty{color:var(--faint);font-size:13px;padding:30px 18px;text-align:center;font-family:var(--mono)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  :focus-visible{outline:2px solid var(--coder);outline-offset:2px}
  @media (max-width:760px){
    main{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .col-right{max-height:45vh}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="topline">
    <span class="brand"><b>ship</b>-team</span>
    <span class="feature" id="feature">waiting for a run…</span>
    <span class="status-chip" id="status">idle</span>
  </div>
  <div class="bar-meta">
    <span class="eyebrow" id="phase-label">phase</span>
    <span class="pct" id="pct">0%</span>
  </div>
  <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
  <div class="line" id="line"></div>
</header>

<main>
  <section class="col col-left">
    <div class="col-head"><span class="eyebrow">agent communication</span>
      <span class="count" id="msg-count">0 events</span></div>
    <div class="feed" id="feed"><div class="empty">no events yet</div></div>
  </section>
  <aside class="col col-right">
    <div class="col-head"><span class="eyebrow">task summary</span>
      <span class="count" id="task-count">0 / 0</span></div>
    <div class="summary" id="summary"><div class="empty">no tasks yet</div></div>
  </aside>
</main>

<script>
const AGENTS = ["planner","coder","tester","reviewer"];
const AGENT_PHASE = {planner:"plan",coder:"implement",tester:"test",reviewer:"review"};
const PHASES = ["spec","plan","implement","test","review","qa","done"];
const COLORS = {planner:"var(--planner)",coder:"var(--coder)",tester:"var(--tester)",
  reviewer:"var(--reviewer)",orchestrator:"var(--orchestrator)"};

function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function timeOf(iso){try{return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});}catch{return"";}}

function stationState(agent, run){
  if(!run) return "pending";
  const active = run.activeAgent, phase = run.phase;
  if(active===agent) return "active";
  // complete if the pipeline has moved past this agent's phase
  const ai = PHASES.indexOf(AGENT_PHASE[agent]), pi = PHASES.indexOf(phase);
  return pi>ai ? "complete" : "pending";
}

function renderLine(run){
  const loop = run?.loop || {count:0,max:5};
  let html="";
  AGENTS.forEach((a,i)=>{
    const state = stationState(a,run);
    html += `<div class="station st-${a} ${state}">
      <div class="dot"></div>
      <div class="st-label">${a}</div>
      <div class="st-phase">${AGENT_PHASE[a]}</div></div>`;
    if(i<AGENTS.length-1){
      if(a==="coder"){ // coder -> tester with the return arc + loop badge
        html += `<div class="loop-arc">
          <svg viewBox="0 0 70 34" preserveAspectRatio="none"><path d="M6,17 C6,-8 64,-8 64,17"/></svg>
          <span class="loop-badge">↻ ${loop.count}/${loop.max}</span></div>`;
      } else {
        html += `<div class="connector"></div>`;
      }
    }
  });
  document.getElementById("line").innerHTML = html;
}

function renderHeader(run){
  document.getElementById("feature").textContent = run?.feature || "waiting for a run…";
  const st = document.getElementById("status");
  const status = run?.status || "idle";
  st.textContent = status;
  st.className = "status-chip status-"+status;
  const pct = run?.progressPct ?? 0;
  const bar = document.getElementById("bar");
  bar.style.width = pct+"%";
  bar.style.background = COLORS[run?.activeAgent] || "var(--coder)";
  document.getElementById("pct").textContent = pct+"%";
  document.getElementById("phase-label").textContent =
    run ? `phase · ${run.phase}` : "phase";
}

function renderFeed(messages){
  const feed = document.getElementById("feed");
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
  if(!messages.length){feed.innerHTML='<div class="empty">no events yet</div>';return;}
  feed.innerHTML = messages.map(m=>`
    <div class="msg t-${esc(m.type)}">
      <div class="rail" style="background:${COLORS[m.agent]||"var(--orchestrator)"}"></div>
      <div class="body">
        <div class="m-head">
          <span class="m-agent a-${esc(m.agent)}">${esc(m.agent)}</span>
          <span class="m-type">${esc(m.type)}</span>
          ${m.service?`<span class="m-service">${esc(m.service)}</span>`:""}
          <span class="m-time">${timeOf(m.ts)}</span>
        </div>
        <div class="m-summary">${esc(m.summary)}</div>
        ${m.detail?`<div class="m-detail">${esc(m.detail)}</div>`:""}
        ${m.ref?`<div class="m-ref">→ ${esc(m.ref)}</div>`:""}
      </div>
    </div>`).join("");
  document.getElementById("msg-count").textContent = messages.length+" events";
  if(atBottom) feed.scrollTop = feed.scrollHeight;
}

function renderSummary(run, tasks){
  const el = document.getElementById("summary");
  tasks = tasks||[];
  const done = tasks.filter(t=>t.status==="done").length;
  document.getElementById("task-count").textContent = `${done} / ${tasks.length}`;
  const current = tasks.find(t=>t.status==="in_progress");
  const loop = run?.loop||{count:0,max:5};
  const services = run?.services||null;
  const svcNames = services?Object.keys(services):[];

  let html = `<div class="chips">
      <span class="chip">phase <b>${esc(run?.phase||"—")}</b></span>
      <span class="chip">agent <b>${esc(run?.activeAgent||"—")}</b></span>
      <span class="chip">fix loop <b>${loop.count}/${loop.max}</b></span>
    </div>`;

  html += `<div class="now-card">
      <div class="eyebrow">now working</div>
      <div class="now-agent a-${esc(run?.activeAgent||"orchestrator")}">${esc(run?.activeAgent||"—")}</div>
      <div class="now-task">${current?esc(current.title):(run?.status==="done"?"run complete ✓":"—")}</div>
    </div>`;

  // per-service status strip (multi-service runs only)
  if(svcNames.length){
    html += `<div><div class="eyebrow" style="margin-bottom:8px">services</div>
      <div class="svc-strip">${svcNames.map(n=>{
        const s=services[n]||{}, sl=s.loop||{count:0,max:5}, st=s.status||"pending";
        const total=(s.passed||0)+(s.failed||0);
        const tests=(s.passed!=null||s.failed!=null)?`<span>tests <b>${s.passed||0}/${total}</b></span>`:"";
        return `<div class="svc-row">
          <div class="svc-top"><span class="svc-name">${esc(n)}</span>
            <span class="svc-state ${esc(st)}">${esc(st)}</span></div>
          <div class="svc-meta"><span>phase <b>${esc(s.phase||"—")}</b></span>
            <span>loop <b>${sl.count}/${sl.max}</b></span>${tests}</div></div>`;
      }).join("")}</div></div>`;
  }

  if(tasks.length){
    const taskLi = t=>`<li class="task ${esc(t.status)}"><span class="box"></span>
        <span class="t-title">${esc(t.title)}</span>
        ${(t.service&&!svcNames.length)?`<span class="t-service">${esc(t.service)}</span>`:""}
        <span class="t-owner">${esc(t.owner||"")}</span></li>`;
    let tasksHtml;
    if(tasks.some(t=>t.service)){                 // group by service when tagged
      const groups={};
      tasks.forEach(t=>{const k=t.service||"(untagged)";(groups[k]=groups[k]||[]).push(t);});
      tasksHtml = Object.keys(groups).map(g=>
        `<div class="svc-group-head">${esc(g)}</div>
         <ul class="task-list">${groups[g].map(taskLi).join("")}</ul>`).join("");
    } else {
      tasksHtml = `<ul class="task-list">${tasks.map(taskLi).join("")}</ul>`;
    }
    html += `<div><div class="eyebrow" style="margin-bottom:8px">tasks</div>${tasksHtml}</div>`;
  }
  el.innerHTML = html;
}

function render(s){
  renderHeader(s.run); renderLine(s.run);
  renderFeed(s.messages||[]); renderSummary(s.run, s.tasks);
}

// live stream
let es;
function connect(){
  es = new EventSource("/events");
  es.onmessage = e => { try{ render(JSON.parse(e.data)); }catch{} };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
