  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_EYE_OFF=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.73 5.08a10.74 10.74 0 0 1 11.2 6.57 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49"/><path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"/><path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14"/><path d="m2 2 20 20"/></svg>`;

/* The plan the gate is asking about: its size, its approach, and its tasks by service. */
const PLAN_OPEN=new Set();   // a Tasks list you opened stays open when the card redraws
const plural=(n,w)=>`<b>${n}</b> ${w}${n===1?"":"s"}`;
function planHTML(p){
  const b=p.plan; if(!b) return "";
  const by=new Map();
  for(const t of b.tasks) by.set(t.service||"",[...(by.get(t.service||"")||[]),t]);
  const rows=[...by].map(([svc,ts])=>(by.size>1?`<li class="svc">${esc(svc)}</li>`:"")
    +ts.map(t=>`<li><span class="id">${esc(t.id)}</span><span>${esc(t.title)}</span></li>`).join("")).join("");
  const more=b.taskCount-b.tasks.length;
  return `<div class="c-plan">
    <div class="c-plan-sum">${[plural(b.taskCount,"task"),plural(b.services.length,"service"),
      `<b>${b.criteria}</b> criteria`,b.high?plural(b.high,"high-complexity task"):"",b.risks?plural(b.risks,"risk"):"",
      b.questions?`<span class="q">${plural(b.questions,"open question")}</span>`:""].filter(Boolean).join(" · ")}</div>
    ${b.approach?`<p class="c-plan-why">${esc(b.approach)}</p>`:""}
    ${rows?`<details${PLAN_OPEN.has(p.slug)?" open":""}><summary>Tasks</summary><ol>${rows}${
      more>0?`<li class="svc">${more} more on the board</li>`:""}</ol></details>`:""}
  </div>`;
}
/* ---- the estimate ----
   run.eta and run.clock are pipe.py's, stamped on its last bus write. All this adds is the
   time since: counted as work while the run is moving, and as waiting while it is held at
   a gate, blocked, or silent for longer than IDLE_MIN (== pipe.py IDLE_MIN). */
const IDLE_MIN=15;
const PHASE_C={spec:"var(--orch)",plan:"var(--planner)",implement:"var(--coder)",test:"var(--tester)",
  review:"var(--reviewer)",qa:"var(--orch)"};
const dur=m=>{m=Math.max(0,Math.round(m));return m>=60?`${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`:`${m}m`;};
function clockAt(t){
  const d=new Date(t), hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});
  return d.toDateString()===new Date().toDateString()?hm
    :d.toLocaleDateString([],{day:"numeric",month:"short"})+" "+hm;
}
function etc(p){
  const e=p.eta, c=p.clock; if(!e||!c||!c.at) return null;
  const done=p.status==="done";
  const gap=done?0:Math.max(0,(Date.now()-new Date(c.at))/60000);
  const waiting=p.status==="awaiting_approval"||p.status==="blocked"||p.status==="failed";
  const paused=p.status==="running"&&gap>IDLE_MIN;
  const held=waiting||paused, spent=held?0:gap;
  const left=Math.max(0,e.leftMin-spent), likely=Math.max(left,e.likelyMin-spent);
  const worked=Object.values(c.work||{}).reduce((a,b)=>a+b,0)+spent;
  return {left,likely,held,waiting,paused,worked,total:e.totalMin,phases:e.phases,work:c.work||{},
    waited:(c.waitMin||0)+(c.pausedMin||0)+(held?gap:0),over:Math.round(worked+left-e.totalMin)};
}
function railHTML(p,t){
  const names=Object.keys(t.phases), cur=names.indexOf(p.phase);
  const slack=Math.max(1,t.likely-t.left);
  let before=0;
  const segs=names.map((n,i)=>{
    const est=Math.max(1,t.phases[n]);
    const fill=i<cur?1:i>cur?0:Math.min(1,Math.max((t.work[n]||0)/est,0.04));
    before+=est*fill;
    return `<div class="sg" style="flex:${est};--c:${PHASE_C[n]}"><i style="width:${Math.round(fill*100)}%"></i></div>`;
  }).join("");
  const at=before/(t.total+slack)*100;
  const lab=names.map((n,i)=>`<span style="flex:${Math.max(1,t.phases[n])}"${i===cur?' class="cur"':""}>${
    t.phases[n]/(t.total+slack)>0.07?n:""}</span>`).join("");
  return `<div class="c-rail"><div class="bar">${segs}<div class="slack" style="flex:${slack}"
    title="How late it could run"></div><span class="needle" style="left:${at.toFixed(1)}%"></span></div>
    <div class="lab">${lab}<span style="flex:${slack}">slack</span></div></div>`;
}
// Why a run shows no times: only pipe.py 0.11+ keeps the clock, and only a plan with minutes
// per task gives an estimate. Saying which beats a card that is silently blank.
function whyNoTimes(p){
  return !p.clock?"No clock: an older pipe.py (before 0.11) writes this run - restart the Claude session driving it."
    :!p.eta?"No estimate yet: the plan has no minutes per task.":"";
}
function etcHTML(p){
  if(p.status==="done") return "";
  const t=etc(p); if(!t){ const w=whyNoTimes(p); return w?`<div class="c-sub">${esc(w)}</div>`:""; }
  const now=Date.now();
  const k1=p.status==="blocked"||p.status==="failed"?"Ready if unblocked now":t.waiting?"Ready if approved now"
          :t.paused?"Ready if resumed now":"Work completed at";
  return `<div class="c-etc">
    <div><div class="k">${k1}</div><div class="v">${clockAt(now+t.left*60000)}</div>
      <div class="s">likely by ${clockAt(now+t.likely*60000)}</div></div>
    <div><div class="k">${t.waiting&&p.phase==="plan"?"Work to do":"Work left"}</div><div class="v sm">${dur(t.left)}</div></div>
    <div><div class="k">${t.held?(t.paused?"Paused":"Waiting on you"):"Waited on you"}</div>
      <div class="v sm${t.held?" hold":""}">${dur(t.waited)}</div>${t.held?`<div class="s">and counting</div>`:""}</div>
  </div>${railHTML(p,t)}${t.over>5?`<div class="c-over">Running ${dur(t.over)} over the plan's estimate</div>`:""}`;
}
/* Work completed: what it cost, the human's steps, and the one button that closes it. */
function doneHTML(p){
  if(p.status!=="done") return "";
  const t=etc(p);
  const sum=[p.workCompletedAt&&`QA green ${clockAt(p.workCompletedAt)}`,
    t&&t.worked>=1&&`${dur(t.worked)} of work against ${dur(t.total)} estimated`,
    t&&t.waited>=1&&`waited on you ${dur(t.waited)}`].filter(Boolean).join(" · ");
  if(p.completed) return `<div class="c-sub">Marked completed ${clockAt(p.completed)}${sum?" · "+esc(sum):""}</div>`;
  const steps=(p.humanSteps||[]).map(x=>`<li><span>${esc(x)}</span></li>`).join("");
  return `${sum?`<div class="c-sub">${esc(sum)}</div>`:""}
    ${steps?`<ol class="c-steps" aria-label="Your steps">${steps}</ol>`:""}
    <button class="final" type="button" data-final>Mark completed</button>`;
}
function pillTxt(p,st){
  if(st==="gate") return p.phase==="plan"?"Approve plan":"Waiting on you";
  if(st==="block") return "Blocked";
  if(st==="stale") return "Quiet";
  if(st==="done") return p.completed?"Completed":"Work completed";
  const l=p.loop||{};
  return esc(p.phase||"running")+(l.count>0?` - fix ${l.count} of ${l.max||5}`:"");
}
function since(ts){
  const m=Math.max(0,Math.floor((Date.now()-new Date(ts))/60000));
  return m<1?"just now":m<60?`${m}m ago`:m<2880?`${Math.floor(m/60)}h ago`:`${Math.floor(m/1440)}d ago`;
}

/* ---- new since you last looked ----
   A team's newest event that arrives while the hall is not in front of you leaves a dot on
   its card, and the dot survives a reload; clicking or opening the card reads it. An event
   that lands while you are looking is already seen, and a team met for the first time
   starts read, so a first visit is not a wall of dots. */
const SEEN_KEY="ao-seen";
let SEEN_AT=(()=>{try{return JSON.parse(localStorage.getItem(SEEN_KEY))||{};}catch(e){return {};}})();
const LAST_TS={};      // each team's newest event in the previous frame
const evTs=p=>(p.lastEvent&&p.lastEvent.ts)||"";
const looking=()=>document.visibilityState==="visible"&&document.hasFocus();
function unread(p){
  return !p.hidden&&!!evTs(p)&&!!SEEN_AT[p.slug]&&new Date(evTs(p))>new Date(SEEN_AT[p.slug]);
}
function saveSeen(){try{localStorage.setItem(SEEN_KEY,JSON.stringify(SEEN_AT));}catch(e){}}
function trackSeen(){
  let dirty=false;
  for(const p of HALL.pipelines){
    const ts=evTs(p); if(!ts) continue;
    const arrived=p.slug in LAST_TS&&LAST_TS[p.slug]!==ts;
    if(!SEEN_AT[p.slug]||(arrived&&looking())){SEEN_AT[p.slug]=ts;dirty=true;}
    LAST_TS[p.slug]=ts;
  }
  if(dirty) saveSeen();
}
function readCard(slug){
  const p=HALL.pipelines.find(x=>x.slug===slug); if(!p||!unread(p)) return;
  SEEN_AT[slug]=evTs(p); saveSeen();
  document.querySelectorAll(`#hall .card[data-slug="${CSS.escape(slug)}"] .unread`).forEach(d=>d.remove());
  CARD_SIG[slug]=cardSig(p);     // the card on screen now matches; do not redraw it for this
}

const SEEN=new Set();   // entry 6: the table entrance is first paint only, and never replays
const HOLDER={};        // who held the work last frame, per slug - the seat that just took it walks in

function card(p){
  const st=cardState(p), sm=staleMs(p);
  const holder=p.activeAgent||"planner";
  const prev=HOLDER[p.slug]||holder, moved=prev!==holder;
  HOLDER[p.slug]=holder;
  const fresh=!SEEN.has(p.slug); SEEN.add(p.slug);
  // The seat that just took the work walks in; the others keep their own loop.
  const seat=(role,label,ag)=>`<span class="seat${holder===role?" on":""}${moved&&holder===role?" arrive":""}">${
    sprite(ag||role,{state:seatState(p,role),px:24})}${label}</span>`;
  const team=TEAM.map(([r,l])=>seat(r,l)).join("")+(hasOperator(p)?seat("operator","oper","orch"):"");
  const repos=(p.repos&&p.repos.length?p.repos:Object.keys(p.services||{})).join(" · ")||p.slug;
  const ev=p.lastEvent, name=p.feature||p.slug;
  // Finished and hidden teams fold to one line; clicking the line opens it back up.
  const fold=(st==="done"&&!!p.completed)||p.hidden;
  const hide=p.hidden
    ?`<button class="c-hide txt" type="button" data-hide="0" aria-label="Unhide ${esc(name)}"
        title="Put it back in the hall and the office">${ICON_EYE}Unhide</button>`
    :`<button class="c-hide" type="button" data-hide="1" aria-label="Hide ${esc(name)}"
        title="Hide from the hall and the office until its next run">${ICON_EYE_OFF}</button>`;
  // What the card says last: the newest event while it is moving, the plan at a gate.
  const now=ev&&(st==="run"||st==="block"||st==="stale")?`<div class="c-last"><b style="color:${
      AGENT_COLOR[ev.agent]||"var(--muted)"}">${esc(ev.agent)}</b><span class="msg" title="${esc(ev.summary)}">${
      esc(ev.summary)}</span><span class="age" data-ts="${esc(ev.ts)}">${since(ev.ts)}</span></div>`:"";
  return `<article class="card s-${st}${p.completed?" s-closed":""}${fold?" collapsed":""}${fresh?" enter":""}" data-slug="${esc(p.slug)}"${fold?" data-fold":""}>
    <div class="c-head">
      ${unread(p)?`<span class="unread" role="img" aria-label="New since you last looked"
        title="New since you last looked"></span>`:""}<a class="c-name" href="/r/${encodeURIComponent(p.slug)}"
        title="${esc(name)}">${esc(name)}</a>
      <span class="pill"><i></i>${pillTxt(p,st)}</span>${hide}</div>
    <div class="c-team">${team}<span class="repos">${esc(repos)}</span></div>
    ${etcHTML(p)}${doneHTML(p)}
    ${sm?(HALL.limit?`<div class="c-stale paused">◉ paused at the usage limit — Claude Code resumes it</div>`
        :`<div class="c-stale">◉ no activity ${agoTxt(sm)} — agent may have died</div>`):""}
    ${now}
    ${st==="gate"?planHTML(p):""}
    ${st==="gate"?`<div class="gate">
      <button data-d="finalize">Finalize</button>
      <button data-d="in-place">In place</button>
      <button data-d="reject">Reject</button></div>`:""}
  </article>`;
}

/* What the card actually draws. Rebuilding every card on every frame would restart every
   sprite loop in the hall two or three times a second - rule 3 says something always
   moves, so only a card whose signature changed is replaced. */
function cardSig(p){
  return [p.status,p.phase,p.activeAgent,(p.loop||{}).count,!!staleMs(p),hasOperator(p),p.hidden,
    (p.repos||[]).join(","),p.lastEvent&&p.lastEvent.ts,JSON.stringify(p.services||null),
    unread(p),JSON.stringify(p.plan||null),!!HALL.limit,p.completed,etcHTML(p),doneHTML(p)].join("|");
}

/* An empty tab says what is on the other tabs and how work gets onto this one. */
function noneHTML(){
  if(!HALL.pipelines.length) return `<div class="empty">no pipelines under ${esc(HALL.root)}</div>`;
  const c=shelfCounts();
  if(SHOW==="active") return `<div class="blank">
    <div class="cast">${["planner","coder","tester","reviewer"].map(r=>sprite(r,{state:"sleep",px:22})).join("")}</div>
    <h2>Nobody is working right now</h2>
    <p>${c.ready} ready to deploy, ${c.done} completed${c.hidden?` and ${c.hidden} hidden`:""}. A run
      appears here the moment <code>/ship</code> starts one.</p>
    ${c.ready?`<button class="ghost" type="button" data-show="ready">See what is ready to deploy</button>`:""}</div>`;
  if(SHOW==="ready") return `<div class="blank"><h2>Nothing is waiting to be deployed</h2>
    <p>A team moves here when its QA goes green, with the steps left for you.</p></div>`;
  if(SHOW==="done") return `<div class="blank"><h2>Nothing is completed yet</h2>
    <p>A team moves here once you mark its work completed, after deploying it.</p></div>`;
  return `<div class="blank"><h2>Nothing is hidden</h2>
    <p>Hide a team from its card to clear it out of the hall and the office. It comes back
      on its own when its workstream starts a new run.</p></div>`;
}

const CARD_SIG={};
let NONE=null;          // the empty state on screen, so an unchanged one is not redrawn
function renderHall(){
  const el=document.getElementById("hall");
  const list=shown();
  if(!list.length){
    const html=noneHTML();
    if(NONE!==html){ el.innerHTML=html; NONE=html; }
    return;
  }
  if(NONE!==null||el.querySelector(".empty")){ el.innerHTML=""; NONE=null; }
  const nodes=new Map([...el.children].map(c=>[c.dataset.slug,c]));
  // Replace only a card whose signature changed, and move a node only when it is out of
  // order: re-inserting a card restarts every sprite loop on it.
  let prev=null;
  for(const p of list){
    let node=nodes.get(p.slug);
    if(!node||CARD_SIG[p.slug]!==cardSig(p)){
      const t=document.createElement("template"); t.innerHTML=card(p);
      const fresh=t.content.firstElementChild;
      if(node) node.replaceWith(fresh);
      node=fresh; CARD_SIG[p.slug]=cardSig(p);
    }
    const want=prev?prev.nextElementSibling:el.firstElementChild;
    if(node!==want) el.insertBefore(node,want);
    prev=node; nodes.delete(p.slug);
  }
  for(const n of nodes.values()) n.remove();
  el.querySelectorAll(".c-last .age[data-ts]").forEach(a=>{
    const s=since(a.dataset.ts); if(a.textContent!==s) a.textContent=s;});
}
// A folded team is still a team: clicking its row opens it back up.
document.getElementById("hall").addEventListener("click",e=>{
  const any=e.target.closest(".card"); if(any) readCard(any.dataset.slug);
  if(e.target.closest(".gate,.c-hide,.final,a,summary")) return;    // those own their own clicks
  const go=e.target.closest("[data-show]");
  if(go) return setShow(go.dataset.show);
  const c=e.target.closest(".card");
  if(c&&c.hasAttribute("data-fold")) c.classList.toggle("collapsed");
});

document.getElementById("hall").addEventListener("toggle",e=>{
  const d=e.target; if(!d.matches||!d.matches(".c-plan details")) return;
  const slug=d.closest(".card").dataset.slug;
  if(d.open) PLAN_OPEN.add(slug); else PLAN_OPEN.delete(slug);
},true);

/* ---- hide / unhide ----
   Optimistic: the card leaves at once and the toast offers Undo. PENDING holds the choice
   over any frame the stream sends before the server has written it, so a card does not
   blink back in; a refused write puts the card back and says why. */
const PENDING={};
document.getElementById("hall").addEventListener("click",e=>{
  const b=e.target.closest(".c-hide"); if(!b) return;
  const c=b.closest(".card");
  setHidden(c.dataset.slug,b.dataset.hide==="1",c);
});
async function setHidden(slug,hidden,cardEl){
  const p=HALL.pipelines.find(x=>x.slug===slug); if(!p) return;
  const name=esc(p.feature||slug);
  PENDING[slug]=hidden;
  if(cardEl){
    cardEl.querySelectorAll("button").forEach(x=>x.disabled=true);
    cardEl.classList.add("leaving");
    await new Promise(r=>setTimeout(r,160));     // the exit, then the grid closes the gap
  }
  render();
  toast(hidden?`Hidden <b>${name}</b>`
              :`<b>${name}</b> is back in ${shelf(p)==="done"?"Done":"Active"}`,
        ()=>setHidden(slug,!hidden));
  let ok=true;
  if(!DEMO) try{
    const r=await fetch("/api/hide",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slug,hidden})});
    if(!r.ok) throw new Error("the server said "+r.status);
  }catch(err){
    ok=false;
    toast(`Could not ${hidden?"hide":"unhide"} <b>${name}</b> - ${esc(err.message)}`,null,true);
  }
  if(PENDING[slug]!==hidden) return;            // a later click (Undo) owns this team now
  delete PENDING[slug];
  const q=HALL.pipelines.find(x=>x.slug===slug);
  if(q) q.hidden=ok?hidden:!hidden;
  render();
}

let TOAST_T=0;
function toast(html,undo,bad){
  const t=document.getElementById("toast");
  t.className="toast on"+(bad?" err":"");
  t.innerHTML=`<span class="msg">${html}</span>`+(undo?`<button type="button">Undo</button>`:"");
  if(undo) t.querySelector("button").onclick=()=>{t.classList.remove("on");undo();};
  const later=()=>{clearTimeout(TOAST_T);TOAST_T=setTimeout(()=>t.classList.remove("on"),6000);};
  t.onmouseenter=()=>clearTimeout(TOAST_T);     // reading it, or reaching for Undo
  t.onmouseleave=later;
  later();
}

/* The one final button. Marking work completed cannot be taken back from the hall, so the
   first click asks and the second one sends; the server only stamps work that is done. */
document.getElementById("hall").addEventListener("click",async e=>{
  const b=e.target.closest(".final"); if(!b) return;
  if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Confirm: it is deployed"; return; }
  const slug=b.closest(".card").dataset.slug;
  b.disabled=true; b.textContent="sending…";
  try{
    if(DEMO){ const q=HALL.pipelines.find(x=>x.slug===slug); if(q) q.completed=new Date().toISOString(); render(); return; }
    const r=await fetch("/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slug})});
    if(!r.ok) throw new Error("the server said "+r.status);
    await pull();
  }catch(err){
    b.disabled=false; delete b.dataset.armed; b.textContent="Mark completed";
    toast(`Could not mark it completed - ${esc(err.message)}`,null,true);
  }
});
/* Section 6 and 14: the browser half writes the same gate.json the terminal does. The
   decision is one of three fixed strings the server re-checks, and the slug is the card's
   own - nothing here is read from the URL. */
document.getElementById("hall").addEventListener("click",async e=>{
  const b=e.target.closest(".gate button"); if(!b) return;
  const row=b.parentElement, slug=(b.closest(".card")||{}).dataset?.slug;
  if(!slug) return;
  const btns=[...row.querySelectorAll("button")], was=b.textContent;
  btns.forEach(x=>x.disabled=true);
  row.querySelectorAll(".gate-err").forEach(x=>x.remove());
  b.textContent="sending…";
  try{
    const r=await fetch("/api/gate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slug,decision:b.dataset.d})});
    if(!r.ok) throw new Error("server said "+r.status);
    b.textContent="sent";
    await pull();                                    // reflect the new status immediately
  }catch(err){
    // A 400 or a 404 must not look like an approval. Put the row back and say why.
    b.textContent=was; btns.forEach(x=>x.disabled=false);
    const m=document.createElement("span");
    m.className="gate-err"; m.textContent="not approved — "+err.message;
    row.append(m);
  }
});
/* ---- section 10.5, the office floor -----------------------------------------------
   The same bus data, read the ambient way. Behaviour maps to state, not decoration:
   typing at a desk means it holds the work, asleep means finished, frozen mid-keystroke
   means quiet, and the team sitting in the orchestrator's office means a finished plan
   is waiting on your finalize. */
const BUILDING_H=466;                          // two rows of pods; past that the floor grows
// A rug overhangs its island by 8 above, and the nameplate and bar hang to +170, so at the original 152 one row's
// rug ran into the next row's; 206 also clears each island's state tag (top:-31px) of the row above's nameplate and bar (bottom 170).
const POD_XS=[18,212,406], POD_Y0=16, POD_DY=206;
// Seating is facing pairs around one shared table: two above, two below (seen from
// behind), each facing the laptop at (dx,dy).
const POD=[
  {"role":"planner", "x":26,"y":4,  "dx":25,"dy":42,"back":false},
  {"role":"coder",   "x":96,"y":4,  "dx":95,"dy":42,"back":false},
  {"role":"tester",  "x":26,"y":120,"dx":25,"dy":92,"back":true},
  {"role":"reviewer","x":96,"y":120,"dx":95,"dy":92,"back":true}
];
/* The east wing: the orchestrator's office above, the break room below. Positions inside
   a room are in the room's own coordinates, which start RX in from the wing's left edge
   because the room's wall is its left border. */
const WING=270, OFFICE_H=300, RX=6;
/* The south strip under the bullpen is the server room. */
const SOUTH=132;
// The cabin's table is the big one: the same facing pairs as a pod, further apart.
const CONF={x:44,y:128};
const CSEAT=[
  {"role":"planner", "x":34, "y":4,  "dx":33, "dy":44, "back":false},
  {"role":"coder",   "x":118,"y":4,  "dx":117,"dy":44, "back":false},
  {"role":"tester",  "x":34, "y":130,"dx":33, "dy":100,"back":true},
  {"role":"reviewer","x":118,"y":130,"dx":117,"dy":100,"back":true}
];
const ORCH_DESK={x:176,y:34}, ORCH_SEAT={x:196,y:72}, ORCH_STAND={x:228,y:196};

/* Past six teams the floor widens until the whole of it fits the window, instead of
   growing down a fixed three columns off the bottom. Islands sit on the same 194 pitch,
   with an aisle after every column; the last aisle runs along the wing's wall. */
const COL_DX=194;
function floorDims(n,cells){
  const rows=Math.max(2,Math.ceil(cells/n)), bw=193+COL_DX*(n-1)+20, bh=BUILDING_H+Math.max(0,rows-2)*POD_DY;
  return {rows, bw, bh, w:bw+WING, h:bh+SOUTH};
}
/* The corridor graph. Every edge is purely horizontal or vertical - that is what stops a
   walker cutting the corner through somebody's desk. A corridor runs above the first row,
   between each pair of rows and below the last; each one starts at a stub over the first
   column so a seat there has a corridor straight above or below it. The cabin door opens
   off the first cross corridor and the cafeteria's off the last; inside the cabin a ring
   runs round the big table along the two rows of chairs. The server room opens off the
   last corridor too, through the wall under the first aisle. */
function floorGraph(n,rows,bw,bh){
  const nodes={}, edges=[], L=n-1, ys=[12];
  for(let r=1;r<rows;r++) ys.push(POD_Y0+r*POD_DY-16);
  ys.push(POD_Y0+rows*POD_DY-2);
  ys.forEach((y,r)=>{
    nodes[r+".w"]=[30,y]; edges.push([r+".w",r+".0"]);
    for(let j=0;j<n;j++){
      nodes[r+"."+j]=[193+COL_DX*j,y];
      if(r) edges.push([(r-1)+"."+j,r+"."+j]);
      if(j) edges.push([r+"."+(j-1),r+"."+j]);
    }
  });
  const ox=bw+RX, by=ys[rows];
  Object.assign(nodes,{od:[bw+3,ys[1]],oi:[ox+26,ys[1]],ot:[ox+26,154],otr:[ox+240,154],
    ob:[ox+26,280],obr:[ox+240,280],kd:[bw+3,by],ki:[ox+28,by],kc:[ox+28,OFFICE_H+62],
    sd:[193,bh+8],si:[193,bh+96],sa:[36,bh+96],sb:[bw-170,bh+96]});
  edges.push(["1."+L,"od"],["od","oi"],["oi","ot"],["oi","ob"],["ot","otr"],["ob","obr"],["otr","obr"],
    [rows+"."+L,"kd"],["kd","ki"],["ki","kc"],
    [rows+".0","sd"],["sd","si"],["sa","si"],["si","sb"]);
  return {nodes,edges};
}
// The column count (3..cells) with the largest fitted zoom; six teams or fewer keep three.
function pickCols(teams,cells,cw,ch,top,bot){
  let best=3,bz=0;
  if(teams<=6) return best;
  for(let n=3;n<=cells;n++){
    const d=floorDims(n,cells), z=Math.min((cw-32)/d.w,(ch-top-bot)/d.h);
    if(z>bz+1e-9){bz=z;best=n;}
  }
  return best;
}

/* ---- who is where ----
   LAY is the built floor's geometry. MEET is the one team in the orchestrator's office.
   ACT holds every agent on its feet, by key - "slug|role", "orch", or a walker's "w0" -
   and GONE the keys whose chair is empty because of it. A key has exactly one seat in the
   DOM at a time (its pod's, or the conference table's), so "go home" is always one lookup. */
let LAY=null, MEET=null, HELD=null, ROOM_SIG="", SEATS=[];
const ACT={}, GONE=new Set();
const NO_MOTION=matchMedia("(prefers-reduced-motion:reduce)");
/* Planning happens in the orchestrator's cabin: the team sits at the big table from the
   moment the plan phase starts until you finalize it. One table, so one team: the one
   already sitting stays, and the next plans at its own desks until the table is free. */
function meeting(ps){
  const q=ps.filter(p=>p.phase==="plan"&&(p.status==="running"||p.status==="awaiting_approval")&&!p.completed);
  return q.some(p=>p.slug===MEET)?MEET:(q[0]?q[0].slug:null);
}
// Top-left of the seat `k` belongs in right now, in floor coordinates.
function homeOf(k){
  const ox=LAY.bw+RX;
  if(k==="orch"){ const s=MEET?ORCH_STAND:ORCH_SEAT; return [ox+s.x,s.y]; }
  const cut=k.lastIndexOf("|"), slug=k.slice(0,cut), role=k.slice(cut+1), a=POD.find(a=>a.role===role);
  if(!a) return null;
  if(slug===MEET){ const c=CSEAT.find(c=>c.role===role); return [ox+CONF.x+c.x,CONF.y+c.y]; }
  const i=LAY.slugs.indexOf(slug);
  return i<0?null:[POD_XS[0]+COL_DX*(i%LAY.N)+a.x, POD_Y0+Math.floor(i/LAY.N)*POD_DY+a.y];
}
const seatEl=k=>[...document.querySelectorAll("#office .body[data-k]")].find(el=>el.dataset.k===k);

/* An actor's position is its hips: 12 across and 22 down the sprite, which puts a standing
   agent exactly over the seated one it replaces. Movement is a stepped transition (rule 1). */
function put(el,x,y,ms){
  if(ms) void el.offsetWidth;                  // commit where it stands, or there is nothing to move from
  el._x=x; el._y=y;
  el.style.transition=ms?`transform ${ms}ms steps(${Math.max(1,Math.round(ms/45))})`:"none";
  el.style.transform=`translate(${x-12}px,${y-22}px)`;
}
// Walk `el` through `pts` at `pace` ms per pixel. A later go() on the same actor, or a hand
// picking it up, ends this one: `done` only fires for a walk that arrived.
function go(el,pts,pace,done){
  const run=el._run=(el._run||0)+1;
  let i=0;
  (function leg(){
    if(!el.isConnected||el._run!==run) return;
    if(i>=pts.length||NO_MOTION.matches){
      if(pts.length) put(el,...pts[pts.length-1],0);
      el.classList.remove("walking");
      if(done) done();
      return;
    }
    const [x,y]=pts[i++], ms=Math.round((Math.abs(x-el._x)+Math.abs(y-el._y))*pace);
    if(!ms) return leg();
    el.classList.add("walking");
    put(el,x,y,ms);
    setTimeout(leg,ms);
  })();
}
const span=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
// The nearest point of any corridor to `p`, and the edge it lies on.
function snap(g,p){
  let best=null;
  for(const [a,b] of g.edges){
    const A=g.nodes[a], B=g.nodes[b];
    const q=[Math.min(Math.max(p[0],Math.min(A[0],B[0])),Math.max(A[0],B[0])),
             Math.min(Math.max(p[1],Math.min(A[1],B[1])),Math.max(A[1],B[1]))];
    const d=span(p,q);
    if(!best||d<best.d) best={d,q,a,b};
  }
  return best;
}
/* Straight to the nearest corridor, along the corridors, straight to the target.
   ponytail: Dijkstra by linear scan over a graph of about forty nodes; a heap only if the
   floor ever grows past a few hundred. */
function route(g,from,to){
  const s=snap(g,from), t=snap(g,to);
  const N=Object.assign({},g.nodes,{S:s.q,T:t.q});
  const E=g.edges.concat([["S",s.a],["S",s.b],["T",t.a],["T",t.b]]);
  if(s.a===t.a&&s.b===t.b) E.push(["S","T"]);
  const D={S:0}, prev={}, seen=new Set();
  for(;;){
    let u=null;
    for(const k in D) if(!seen.has(k)&&(u===null||D[k]<D[u])) u=k;
    if(u===null||u==="T") break;
    seen.add(u);
    for(const [a,b] of E){
      const v=a===u?b:b===u?a:null; if(v===null) continue;
      const d=D[u]+span(N[u],N[v]);
      if(!(v in D)||d<D[v]){ D[v]=d; prev[v]=u; }
    }
  }
  const path=[to];
  for(let k="T";k;k=prev[k]) path.unshift(N[k]);
  return path;
}

// Stand `k` up where its seat is (or reuse the actor it already is) and empty the chair.
function actorFor(k,at){
  let el=ACT[k]; if(el) return el;
  el=document.createElement("div");
  el.className="actor"; el.dataset.act=k;
  el.innerHTML=sprite(k==="orch"?"orch":k.slice(k.lastIndexOf("|")+1),{state:"wait",legs:true,px:24});
  LAY.floor.append(el); ACT[k]=el;
  put(el,at[0]+12,at[1]+22,0);
  GONE.add(k);
  const s=seatEl(k); if(s) s.classList.add("gone");
  return el;
}
function sitDown(k){
  if(ACT[k]) ACT[k].remove();
  delete ACT[k];
  GONE.delete(k);
  const s=seatEl(k); if(s) s.classList.remove("gone");
}
// Home is looked up again on arrival: the team may have been called in, or sent back, mid-walk.
function walkHome(k){
  const el=ACT[k]; if(!el||el._held) return;
  const h=homeOf(k); if(!h) return sitDown(k);
  go(el,route(LAY.g,[el._x,el._y],[h[0]+12,h[1]+22]),13,()=>{
    const now=homeOf(k);
    if(now&&(now[0]!==h[0]||now[1]!==h[1])) walkHome(k); else sitDown(k);
  });
}
/* Planning, as two walks. When a team's plan phase starts it leaves its desks for the
   cabin and the orchestrator comes round its desk to the head of the table; when you
   finalize (or reject) they walk back, and the planner of a finalized plan, whose work is
   done, goes to sleep in its own chair. Everyone stands up at once and sets off a beat apart. */
function setMeet(want){
  const cast=[MEET,want].filter(Boolean).flatMap(s=>POD.map(a=>s+"|"+a.role)).concat("orch");
  const from=cast.map(homeOf);
  MEET=want;
  cast.forEach((k,n)=>{
    const a=from[n], b=homeOf(k);
    if(!a||!b||(a[0]===b[0]&&a[1]===b[1])) return;
    actorFor(k,a);
    setTimeout(()=>walkHome(k),n*240);
  });
}

function podSig(p){return cardSig(p)+podTag(p,cardState(p))+(p.slug===MEET);}
function podTag(p,st){
  if(st==="done") return p.completed?"completed":"ready to deploy";
  const t=etc(p);
  if(st==="gate") return "waiting on you"+(t?" "+dur(t.waited):"");
  if(st==="block") return "blocked"+(t?" "+dur(t.waited):"");
  if(st==="stale") return "quiet "+agoTxt(staleMs(p));
  if(!t) return esc(p.phase||"running");
  return clockAt(Date.now()+t.left*60000)+(t.over>5?` <small>${dur(t.over)} over</small>`
    :(l=>l.length>5?"":` <small>likely ${l}</small>`)(clockAt(Date.now()+t.likely*60000)));   // a dated "likely" would outgrow the 194px pitch
}
const POD_SIG={};

// One seat: the chair always, the agent unless it is on its feet somewhere.
function seatHTML(slug,a,state){
  const k=slug+"|"+a.role;
  return `<div class="body${GONE.has(k)?" gone":""}" data-k="${esc(k)}" style="left:${a.x}px;top:${a.y}px">${
    sprite(a.role,{back:a.back,state,seated:true,px:24})}</div>`;
}
const chairHTML=a=>`<div class="chair" style="left:${a.x+2}px;top:${a.back?a.y+21:a.y-5}px"></div>`;

function podHTML(p,i,N){
  const st=cardState(p), work=st==="run";
  const x=POD_XS[0]+COL_DX*(i%N), y=POD_Y0+Math.floor(i/N)*POD_DY;
  // a completed team has left: empty chairs, laptops off. A team in the office has left its chairs behind.
  const people=p.completed?"":POD.map(a=>chairHTML(a)+(p.slug===MEET?"":seatHTML(p.slug,a,seatState(p,a.role)))).join("");
  const laps=POD.map(a=>`<span class="lap${!p.completed&&work&&p.activeAgent===a.role?" work":""}"
    style="left:${a.dx}px;top:${a.dy}px"><i></i><i></i><i></i><i></i><i></i><i></i></span>`).join("");
  const t=etc(p), pct=p.status==="done"?100:t?Math.round(100*t.worked/Math.max(1,t.worked+t.left)):0;
  return `<div class="pod s-${st}${p.completed?" s-closed":""}" data-slug="${esc(p.slug)}" style="left:${x}px;top:${y}px">
    <div class="rug"></div><span class="pod-tag">${podTag(p,st)}</span><div class="table"></div>${laps}${people}
    <a class="pod-name" href="/r/${encodeURIComponent(p.slug)}"
      title="${esc(p.feature||p.slug)}">${esc(p.feature||p.slug)}</a>
    <div class="p-bar"><i style="width:${pct}%"></i></div></div>`;
}

// Desks nobody has been given yet: an office has them, and a half-empty floor reads as unfinished.
function vacantHTML(from,to,N){
  let out="";
  for(let i=from;i<to;i++) out+=`<div class="pod vacant" style="left:${POD_XS[0]+COL_DX*(i%N)}px;top:${
    POD_Y0+Math.floor(i/N)*POD_DY}px"><div class="rug"></div><div class="table"></div>${POD.map(a=>
    `<span class="lap" style="left:${a.dx}px;top:${a.dy}px"></span>`+chairHTML(a)).join("")}</div>`;
  return out;
}
/* The walls and the furniture, drawn once per floor. What changes - who is at the desk,
   who is at the table - is painted into .dyn by paintRoom(). */
const plantHTML=css=>`<div class="plant" style="${css}"><i></i><b></b></div>`;
const tvHTML=css=>`<div class="tv" style="${css}"><i></i><i></i><i></i></div>`;
function wingHTML(L){
  const door=L.g.nodes.kd[1]-OFFICE_H-16;      // the cafeteria's doorway, in its own y
  const S=L.bw, racks=Math.min(9,Math.floor((S-250)/34));
  const npc=(css,cls)=>`<div class="npc ${cls}" style="${css}">${sprite("orch",{state:"type",legs:true,px:24})}<i class="prop bat"></i></div>`;
  return `<div class="room office" style="left:${L.bw}px;top:0;width:${WING}px;height:${OFFICE_H}px">
      <div class="door" style="top:190px"></div>
      ${tvHTML("left:24px;width:132px")}
      <div class="clock" style="left:170px"><i class="hh"></i><i class="mm"></i></div>
      <div class="shelf" style="left:6px;top:20px"><i></i><i></i><i></i></div>
      ${plantHTML("left:72px;top:22px")}
      <div class="lamp" style="left:160px;top:78px"></div>
      <div class="award" style="left:224px;top:1px"></div>
      <div class="carpet"></div>
      <div class="dyn"></div></div>
    <div class="room cafe" style="left:${L.bw}px;top:${OFFICE_H}px;width:${WING}px;height:${L.h-OFFICE_H}px">
      <div class="door" style="top:${door}px"></div>
      <div class="counter"><span class="coffee"><i></i><i></i></span><span class="sink"></span></div>
      <div class="cooler"><i></i></div><div class="fridge"></div><div class="vend"><i></i></div>
      <div class="pong"><i></i></div>
      ${npc("left:62px;top:84px","p1")}${npc("left:190px;top:92px","p2")}
      <div class="cafe-t" style="left:44px;bottom:66px"></div><div class="cafe-t" style="left:128px;bottom:84px"></div>
      <div class="sofa"></div>
      ${plantHTML("left:238px;bottom:10px")}${plantHTML("left:8px;bottom:10px")}
      <span class="plate dim" style="left:30px">cafeteria</span></div>
    <div class="room server nw" style="left:0;top:${L.bh}px;width:${S}px;height:${SOUTH}px">
      <div class="door n" style="left:${193-16}px"></div>
      ${[...Array(racks).keys()].map(i=>`<div class="rack" style="left:${12+34*i}px;--d:${-(i*370)%1900}ms"><i></i><i></i><i></i><i></i><i></i></div>`).join("")}
      ${tvHTML(`left:${S-226}px;width:96px`)}
      <div class="cool" style="left:${S-116}px"><i></i></div><div class="cool" style="left:${S-80}px"><i></i></div>
      <div class="ups" style="left:${S-40}px"><i></i></div>
      <div class="desk boss work" style="left:${S-150}px;top:88px"><div class="scr"><i></i></div><div class="scr two"><i></i></div></div>
      <div class="chair" style="left:${S-124}px;top:124px"></div>
      ${plantHTML(`left:${S-24}px;top:104px`)}
      <div class="cable" style="left:14px;width:${34*racks-10}px"></div>
      <span class="plate dim">server room</span></div>`;
}
/* The conductor is the boss and has the cabin, because it does a different job: it owns
   the things that belong to the project rather than to any one feature. With a team in
   the room it is on its feet at the head of the table; otherwise it is at its own desk. */
function paintRoom(){
  const room=LAY.floor.querySelector(".room.office");
  const p=MEET&&HALL.pipelines.find(x=>x.slug===MEET), live=shelfCounts().active;
  const sig=(p?cardSig(p):"")+"|"+live;
  if(sig===ROOM_SIG&&room.querySelector(".conf")) return;
  ROOM_SIG=sig;
  const gone=GONE.has("orch")?" gone":"";
  const orch=p
    ?`<div class="body${gone}" data-k="orch" style="left:${ORCH_STAND.x}px;top:${ORCH_STAND.y}px">${
        sprite("orch",{state:"type",legs:true,px:24})}</div>`
    :`<div class="body${gone}" data-k="orch" style="left:${ORCH_SEAT.x}px;top:${ORCH_SEAT.y}px">${
        sprite("orch",{back:true,state:live?"type":"wait",seated:true,px:24})}</div>`;
  const gate=!!p&&p.status==="awaiting_approval";
  room.classList.toggle("on",!!p); room.classList.toggle("gate",gate);
  room.querySelector(".dyn").innerHTML=`
    <div class="plate" style="left:8px;top:44px">orchestrator &middot; ${live} live</div>
    <div class="desk boss${live&&!p?" work":""}" style="left:${ORCH_DESK.x}px;top:${ORCH_DESK.y}px"><div class="scr"><i></i></div><div class="scr two"><i></i></div></div>
    <div class="chair" style="left:${ORCH_SEAT.x+2}px;top:${ORCH_SEAT.y+6}px"></div>${orch}
    <div class="conf" style="left:${CONF.x}px;top:${CONF.y}px">
      <div class="rug"></div><div class="table"></div>${
      CSEAT.map(a=>`<span class="lap${p&&!gate&&a.role==="planner"?" work":""}" style="left:${a.dx}px;top:${a.dy}px"><i></i><i></i><i></i><i></i><i></i><i></i></span>`).join("")}${
      CSEAT.map((a,n)=>chairHTML(a)+(p?seatHTML(p.slug,a,a.role!=="planner"?"wait":gate?"ask":"type")
        +`<i class="say" style="left:${a.x+17}px;top:${a.y-8}px;animation-delay:${-1.5*n}s"></i>`:"")).join("")}${
      p?`<a class="conf-name" href="/r/${encodeURIComponent(p.slug)}" title="${gate?"Plan ready, waiting on your finalize":"Planning"}: ${
            esc(p.feature||p.slug)}">${esc(p.feature||p.slug)}</a>`
       :`<span class="conf-name">planning table</span>`}
    </div>`;
}
function tickClock(){
  const c=LAY.floor.querySelector(".clock"), d=new Date(); if(!c) return;
  c.querySelector(".hh").style.transform=`rotate(${(d.getHours()%12+d.getMinutes()/60)*30}deg)`;
  c.querySelector(".mm").style.transform=`rotate(${d.getMinutes()*6}deg)`;
}

/* Two walkers. They are the only people in the room that mean nothing, and they are grey
   for exactly that reason - but they are two different people. The pacer laps the outer
   corridor clockwise at a clip, clipboard under one arm, and barely stops at a corner. The
   ambler drifts wherever the next junction takes it, never doubling back when it has a
   choice, stands about between legs, and every fifth leg goes for a coffee and drinks it
   at the machine. Pick either up and it rejoins its own pattern from where you put it. */
function startWalkers(){
  const g=LAY.g, R=LAY.rows, L=LAY.N-1, P=k=>g.nodes[k];
  const mk=(k,cls,at,prop)=>{
    const el=document.createElement("div");
    el.className="actor walker "+cls; el.dataset.act=k;
    el.innerHTML=sprite("orch",{state:"wait",legs:true,px:24})+prop;
    LAY.floor.append(el); ACT[k]=el; put(el,at[0],at[1],0);
    return el;
  };
  const pacer=mk("w0","brisk",P("0.0"),`<i class="prop clip"></i>`);
  // ...and once a lap it ducks into the server room and stands a moment in front of the racks
  const lap=["0."+L,R+"."+L,"si","0.0"];
  let li=0;
  pacer._resume=()=>{
    if(!pacer.isConnected||pacer._held||NO_MOTION.matches) return;
    go(pacer,route(g,[pacer._x,pacer._y],P(lap[li])),8,()=>{
      const rest=lap[li]==="si"?2600:260;
      li=(li+1)%lap.length; setTimeout(pacer._resume,rest); });
  };
  const amb=mk("w1","amble",P(R+".0"),`<i class="prop mug"></i>`);
  let at=R+".0", was=null, legs=0;
  const roam=()=>{
    if(!amb.isConnected||amb._held||NO_MOTION.matches) return;
    if(++legs%5===0){
      go(amb,route(g,[amb._x,amb._y],P("kc")),22,()=>{
        at="kc"; was=null; amb.classList.add("sip");
        setTimeout(()=>{ amb.classList.remove("sip"); roam(); },4200);
      });
      return;
    }
    // the cabin is by invitation and the racks are the pacer's: it turns back at those doors
    let next=g.edges.filter(e=>e.includes(at)).map(e=>e[0]===at?e[1]:e[0]).filter(k=>!/^[os]/.test(k));
    if(next.length>1) next=next.filter(k=>k!==was);
    const to=next[Math.floor(Math.random()*next.length)];
    was=at; at=to;
    go(amb,[P(to)],22,()=>setTimeout(roam,1200+Math.random()*2600));
  };
  amb._resume=()=>{
    if(NO_MOTION.matches) return;
    amb.classList.remove("sip");
    go(amb,route(g,[amb._x,amb._y],P(at)),22,()=>setTimeout(roam,800));
  };
  setTimeout(pacer._resume,500);
  setTimeout(roam,1600);
}

// Section 10.8-2. Capping the floor would hide exactly the stalled pipelines the floor
// exists to surface, so the building grows and the cost is bounded where it actually
// is: the sprite loops of pods you are not looking at.
let IO=null;
function observePods(floor){
  const host=document.getElementById("office");
  if(!IO) IO=new IntersectionObserver(es=>es.forEach(e=>
    e.target.classList.toggle("off",!e.isIntersecting)),{root:host,rootMargin:"120px"});
  IO.disconnect();
  floor.querySelectorAll(".pod,.room").forEach(el=>IO.observe(el));
}

/* Zoom and pan over real DOM, not a canvas rewrite: every agent keeps its tooltip, its
   CSS animation and its theme tokens. Ctrl+wheel anchors on the pointer; drag pans. */
let Z=1,PX=24,PY=24;
/* The floor opens fitted to the screen and re-fits when the window or the set of teams
   changes; after that the reader moves it like any canvas - drag, scroll, ctrl+scroll. */
function fitFrame(host){
  const pad=16, tagH=28;   // the north wall, and the state tags over it, stand tagH above the floor's top edge
  const k=host.querySelector(".key");
  return {pad, top:(k?k.offsetHeight+24:pad)+tagH, bot:pad+36};  // key above, HUD below
}
function fitView(){
  const host=document.getElementById("office"), f=host.querySelector(".floor");
  if(!f || !host.clientWidth) return;
  const {pad,top,bot}=fitFrame(host);
  const w=f.offsetWidth, h=f.offsetHeight;
  Z=Math.max(0.2,Math.min(1.6,   // fit never zooms past 160% nor below 20%; manual zoom still spans 50%-250%
    Math.min((host.clientWidth-pad*2)/w,(host.clientHeight-top-bot)/h)));
  PX=Math.max(pad,(host.clientWidth-w*Z)/2);
  PY=Math.max(top,top+(host.clientHeight-top-bot-h*Z)/2);
  applyView(); showZoom();
}
window.addEventListener("resize",()=>{ if(!document.getElementById("office").hidden){ renderOffice(); fitView(); } });
function showZoom(){
  const el=document.getElementById("zoom-pct");
  if(el) el.textContent=Math.round(Z*100)+"%";
}
function setZoom(z){
  Z=Math.max(Math.min(0.5,Z),Math.min(2.5,Math.round(z*100)/100));   // a fitted Z below 0.5 must not jump in on zoom-out
  applyView(); showZoom();
}
function applyView(){
  const f=document.querySelector("#office .floor");
  if(f) f.style.transform=`translate(${PX}px,${PY}px) scale(${Z})`;
}
(function view(){
  const host=document.getElementById("office");
  host.addEventListener("wheel",e=>{
    e.preventDefault();
    if(!e.ctrlKey){                            // plain wheel scrolls the floor, which
      PX-=e.deltaX; PY-=e.deltaY; applyView(); // grows past the viewport at 12+ teams
      return;
    }
    const r=host.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const nz=Math.min(2.5,Math.max(Math.min(0.5,Z),Z*(e.deltaY<0?1.12:1/1.12)));
    PX=mx-(mx-PX)*(nz/Z); PY=my-(my-PY)*(nz/Z); Z=nz; applyView();
  },{passive:false});
  // The pointer in floor coordinates: under the pan and zoom, and inside the 4px outer wall.
  const at=e=>{const r=host.getBoundingClientRect();
    return [(e.clientX-r.left-PX)/Z-4,(e.clientY-r.top-PY)/Z-4];};
  /* Pick an agent up and it comes with you; let go and it walks home by the corridors. It
     is a toy and changes nothing on the bus - the run does not know it was lifted. */
  function grab(t,e){
    let el=t;
    if(t.classList.contains("actor")){
      // mid-walk: stop it where it is on screen, not where the walk was headed
      const m=new DOMMatrix(getComputedStyle(t).transform);
      t._run=(t._run||0)+1; put(t,m.m41+12,m.m42+22,0);
    }else{
      const h=homeOf(t.dataset.k); if(!h) return;
      el=actorFor(t.dataset.k,h);
    }
    el._held=true; el.classList.remove("walking","sip","land"); el.classList.add("held");
    const p=at(e); HELD={el,dx:el._x-p[0],dy:el._y-p[1]};
  }
  let down=null;
  host.addEventListener("pointerdown",e=>{
    if(e.target.closest("a,button,.hud")) return;  // a captured pointer would swallow the click
    const who=e.button===0&&LAY&&e.target.closest(".body[data-k],.actor");
    if(who) grab(who,e);
    if(!HELD){ down={x:e.clientX-PX,y:e.clientY-PY}; host.classList.add("drag"); }
    host.setPointerCapture(e.pointerId);});
  host.addEventListener("pointermove",e=>{
    if(HELD){
      const p=at(e);
      put(HELD.el,Math.min(LAY.w-12,Math.max(12,p[0]+HELD.dx)),Math.min(LAY.h-12,Math.max(12,p[1]+HELD.dy)),0);
      return;
    }
    if(!down)return;
    PX=e.clientX-down.x;PY=e.clientY-down.y;applyView();});
  const drop=()=>{
    down=null;host.classList.remove("drag");
    if(!HELD) return;
    const el=HELD.el; HELD=null;
    el._held=false; el.classList.remove("held"); el.classList.add("land");
    setTimeout(()=>el.classList.remove("land"),220);
    if(!el.isConnected) return;                  // the floor was rebuilt under the hand
    if(el._resume) el._resume(); else walkHome(el.dataset.act);
  };
  host.addEventListener("pointerup",drop);
  host.addEventListener("pointercancel",drop);
})();

function renderOffice(){
  const host=document.getElementById("office");
  if(host.hidden) return;                      // the hall is the working view
  // The conductor has its own room now, so the grid is sized for the teams alone; the
  // wing is added to whatever width they need.
  // A team keeps the desks it was given. The hall sorts by urgency, but here a re-sort
  // would move every pod the moment one team's state changed - which is exactly when its
  // people are meant to be seen walking somewhere.
  const live=shown();
  SEATS=SEATS.filter(s=>live.some(p=>p.slug===s)).concat(live.map(p=>p.slug).filter(s=>!SEATS.includes(s)));
  const ps=SEATS.map(s=>live.find(p=>p.slug===s)), cells=Math.max(1,ps.length), fr=fitFrame(host),
    N=pickCols(ps.length,cells,host.clientWidth,host.clientHeight,fr.top,fr.bot),
    {rows,bw,bh,w,h}=floorDims(N,cells);
  const shell=N+"|"+rows+"|"+ps.map(p=>p.slug).join(",");
  let floor=host.querySelector(".floor");
  if(!floor||host.dataset.shell!==shell){
    host.dataset.shell=shell;
    // A new floor starts with everyone already where they belong: nobody walks in on load.
    for(const k in ACT) delete ACT[k];
    GONE.clear(); HELD=null; ROOM_SIG=""; MEET=null; MEET=meeting(ps);
    LAY={N,rows,bw,bh,w,h,slugs:ps.map(p=>p.slug),g:floorGraph(N,rows,bw,bh)};
    host.innerHTML=`<div class="key">
        <span><b>Typing, screen scrolling:</b> holds the work now</span>
        <span><b>Hand up, amber rug:</b> waiting on you</span>
        <span><b>At the cabin table:</b> planning; amber when the plan is ready to finalize</span>
        <span><b>Shaking, red rug:</b> blocked</span>
        <span><b>Asleep on green:</b> ready to deploy</span>
      </div>
      <span class="hint">Pick anyone up, they walk back &middot; drag the floor to move &middot; ctrl + scroll to zoom</span>
      <div class="hud">${DEMO?`<button class="ghost" data-z="demo">Demo: finalize the plan</button>`:""}
        <button class="ghost" data-z="out" aria-label="Zoom out">&minus;</button>
        <span id="zoom-pct">100%</span>
        <button class="ghost" data-z="in" aria-label="Zoom in">+</button>
        <button class="ghost" data-z="fit">Fit</button>
        <button class="ghost" data-z="100">100%</button></div>
      <div class="floor" style="width:${w+8}px;height:${h+8}px">
      <div class="wall-n">${[...Array(N-1).keys()].map(j=>193+COL_DX*j-24).concat(bw+30,bw+106,bw+182)
        .map(x=>`<i class="win" style="left:${x}px"></i>`).join("")}</div>
      ${ps.map((p,i)=>podHTML(p,i,N)).join("")}${vacantHTML(ps.length,N*rows,N)}${wingHTML(LAY)}
      ${plantHTML(`left:6px;top:${bh-30}px`)}${plantHTML(`left:${bw-22}px;top:${bh-30}px`)}</div>`;
    floor=LAY.floor=host.querySelector(".floor");
    // The key only exists now: if it moves the best column count, lay out once more, here,
    // so the first open lands on its final N instead of re-laying itself on the next update.
    const fr2=fitFrame(host);
    if(pickCols(ps.length,cells,host.clientWidth,host.clientHeight,fr2.top,fr2.bot)!==N){ renderOffice(); return; }
    ps.forEach(p=>POD_SIG[p.slug]=podSig(p));
    host.querySelector(".hud").addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.z==="demo"){
        // the fixture's one gated team, flipped between "plan ready" and "finalized"
        const q=HALL.pipelines.find(p=>p.slug==="009-messaging-hub"); if(!q) return;
        const gated=q.status==="awaiting_approval";
        Object.assign(q,gated?{status:"running",phase:"implement",activeAgent:"coder"}
                             :{status:"awaiting_approval",phase:"plan",activeAgent:"planner"},
          {updatedAt:new Date().toISOString()});
        b.textContent=gated?"Demo: plan ready again":"Demo: finalize the plan";
        render(); return;
      }
      if(b.dataset.z==="fit") fitView(); else if(b.dataset.z==="100") setZoom(1); else setZoom(Z*(b.dataset.z==="in"?1.15:1/1.15));
    });
    fitView(); startWalkers();
  }else{
    // Before the pods are patched, so each one is redrawn already knowing who has stood up.
    const want=meeting(ps);
    if(want!==MEET) setMeet(want);
    // Patch only the pod that changed, or the whole floor's loops restart - including
    // the walkers, who would teleport back to where they started.
    const pods=[...floor.querySelectorAll(".pod[data-slug]")];
    ps.forEach((p,i)=>{
      if(POD_SIG[p.slug]===podSig(p)) return;
      POD_SIG[p.slug]=podSig(p);
      const old=pods.find(el=>el.dataset.slug===p.slug); if(!old) return;
      const t=document.createElement("template"); t.innerHTML=podHTML(p,i,N);
      old.replaceWith(t.content.firstElementChild);
    });
  }
  paintRoom(); tickClock();
  observePods(floor);
}

function render(h){
  HALL=h||HALL;
  for(const p of HALL.pipelines) if(p.slug in PENDING) p.hidden=PENDING[p.slug];
  trackSeen();
  renderHeadTable();renderHall();renderOffice();
  attention();
}
/* Staleness is a clock, not an event: with nothing writing to the bus the stream sends
   nothing, so without this a run that died stayed "run" until some other team spoke. */
setInterval(()=>{if(HALL.pipelines.length) render();},30000);

/* ---- when you are needed ----
   The tab title counts the teams waiting on you - at a gate, or gone quiet - whatever the
   bell says. A notification fires only for a change you are not looking at, and only once
   you turned alerts on from the bell: the page never raises the permission prompt itself. */
const BASE_TITLE=document.title;
const NEEDS={gate:"Waiting for your approval",block:"Blocked - it needs you",stale:"Gone quiet - its agent may have died",done:"Finished"};
const canAlert=()=>"Notification" in window;
let ALERTS=(()=>{try{return localStorage.getItem("ao-alerts");}catch(e){return null;}})();
const alertsOn=()=>canAlert()&&Notification.permission==="granted"&&ALERTS==="on";
let WAS=null;          // each team's card state in the previous frame
let LIMIT_WAS=null;    // the pause's state in the previous frame
function paintLimit(){
  const el=document.getElementById("limit"), l=HALL.limit;
  el.hidden=!l; if(!l) return;
  const at=new Date(l.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  el.innerHTML=l.state==="needs-you"
    ?`<b>Usage limit</b><span>The limit has reset, but Claude Code is waiting for you: press Enter in its terminal to continue.</span>`
    :`<b>Usage limit</b><span>Every run paused at ${esc(at)}. Claude Code continues them when the limit resets; there is nothing to do.</span>`;
}
function attention(){
  paintLimit();
  const live=HALL.pipelines.filter(p=>!p.hidden);
  // While a limit holds every team, a quiet one is waiting on the reset, not on you.
  const need=live.filter(p=>cardState(p)==="gate"||(["stale","block"].includes(cardState(p))&&!HALL.limit)).length
    +(HALL.limit&&HALL.limit.state==="needs-you"?1:0);
  document.title=need?`(${need}) need you · ${BASE_TITLE}`:BASE_TITLE;
  const now={}; for(const p of HALL.pipelines) now[p.slug]=cardState(p);
  if(WAS&&alertsOn()&&!DEMO&&!looking()) for(const p of live){
    const s=now[p.slug], was=WAS[p.slug];
    if(s===was||!NEEDS[s]||(was===undefined&&s==="done")||((s==="stale"||s==="block")&&HALL.limit)) continue;
    // set-status lands before the orchestrator's question, so at a gate the newest event
    // is often the previous phase's news - quote it only when it is the question itself.
    const ev=p.lastEvent, say=ev&&ev.summary&&(s!=="gate"||ev.type==="question");
    const n=new Notification(p.feature||p.slug,{
      body:NEEDS[s]+(say?" · "+ev.summary.slice(0,140):""),tag:"ao-"+p.slug});
    n.onclick=()=>{window.focus();location.href="/r/"+encodeURIComponent(p.slug);n.close();};
  }
  const ls=HALL.limit&&HALL.limit.state;
  if(ls==="needs-you"&&LIMIT_WAS!=="needs-you"&&LIMIT_WAS!==null&&alertsOn()&&!DEMO&&!looking())
    new Notification("Usage limit has reset",{body:"Claude Code is waiting for you - press Enter in its terminal to continue the run.",tag:"ao-limit"});
  LIMIT_WAS=ls||"";
  WAS=now;
}
// Lucide's bell and bell-off (ISC).
const ICON_BELL=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>`;
const ICON_BELL_OFF=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742"/><path d="m2 2 20 20"/><path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05"/></svg>`;
function paintBell(){
  const b=document.getElementById("alerts");
  if(!canAlert()){b.hidden=true;return;}
  const blocked=Notification.permission==="denied", on=alertsOn();
  b.setAttribute("aria-pressed",String(on));
  b.innerHTML=(on?ICON_BELL:ICON_BELL_OFF)
    +`<span>${blocked?"Alerts blocked":on?"Alerts on":"Alerts off"}</span>`;
  b.title=blocked?"This browser blocks notifications from this page - allow them in its site settings"
    :on?"Turn off notifications":"Notify me when a team waits for approval, goes quiet, or finishes";
}
document.getElementById("alerts").onclick=async()=>{
  if(!canAlert()) return;
  if(Notification.permission==="default")
    ALERTS=(await Notification.requestPermission())==="granted"?"on":"off";
  else if(Notification.permission==="granted") ALERTS=ALERTS==="on"?"off":"on";
  try{localStorage.setItem("ao-alerts",ALERTS);}catch(e){}
  paintBell();
};
paintBell();

/* The tab is in the URL, so a link to ?show=done opens on Done and a reload keeps it. */
function setShow(s){
  if(!SHOWS.includes(s)||s===SHOW) return;
  SHOW=s;
  try{
    const u=new URL(location.href);
    if(SHOW==="active") u.searchParams.delete("show"); else u.searchParams.set("show",SHOW);
    history.replaceState(null,"",u);
  }catch(e){}
  render();
}
document.getElementById("show-seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(b) setShow(b.dataset.show);
});

/* ---- view + theme ----
   One function owns which view is showing, and it is exhaustive: every view is set on
   every call, so no path can leave two of them visible at once. The segmented control
   and the initial paint both go through it rather than each setting flags themselves. */
const VIEWS=["hall","office"];
let VIEW="hall";
function setView(v){
  VIEW=VIEWS.includes(v)?v:"hall";
  for(const k of VIEWS) document.getElementById(k).hidden=k!==VIEW;
  document.querySelectorAll("#view-seg button")
    .forEach(b=>b.classList.toggle("sel",b.dataset.view===VIEW));
  if(VIEW==="office"){ renderOffice(); fitView(); }   // it skips itself while hidden
}
document.getElementById("view-seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  setView(b.dataset.view);
});

/* An explicit choice wins in both directions, and it has to survive a reload: the toggle
   was resetting to the OS preference on every navigation, so choosing a theme lasted
   exactly as long as the page did. Storage can throw or come back empty (a private
   window, cleared site data), and the page must render correctly either way. */
try{
  const saved=localStorage.getItem("ao-theme");
  if(saved==="dark"||saved==="light") document.documentElement.dataset.theme=saved;
}catch(e){}
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
  try{ localStorage.setItem("ao-theme",r.dataset.theme); }catch(e){}
};

/* ---- live data ---------------------------------------------------------------------
   /events with no run= streams hall() itself - byte-identical in shape to what
   /api/hall returns - so the stream IS the feed, and the opening fetch only buys a
   faster first paint than waiting for the first SSE frame. */
function conn(txt,live){
  document.getElementById("conn").classList.toggle("live",!!live);
  document.getElementById("conn-txt").textContent=txt;
}
function fail(msg){
  conn(msg,false);
  // Only claim the view if there is nothing real in it - a dropped connection must not
  // wipe the hall you were already reading.
  const el=document.getElementById("hall");
  if(!el.querySelector(".card")) el.innerHTML=`<div class="empty">${esc(msg)}</div>`;
}
async function pull(){
  const r=await fetch("/api/hall",{cache:"no-store"});
  if(!r.ok) throw new Error("/api/hall returned "+r.status);
  render(await r.json());
}
function listen(){
  const es=new EventSource("/events");
  es.onopen=()=>conn("live",true);
  es.onmessage=e=>{try{render(JSON.parse(e.data));conn("live",true);}catch(err){}};
  // EventSource reconnects by itself; say so rather than leaving a stale hall labelled live.
  es.onerror=()=>conn("reconnecting…",false);
}

if(new URLSearchParams(location.search).has("demo")){
  DEMO=true;
  conn("demo — not live",false);
  render(FIXTURE);
}else{
  conn("connecting…",false);
  pull().then(listen).catch(e=>{fail("cannot reach the dashboard server — "+e.message);listen();});
}
