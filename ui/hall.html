<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent-Orchestration · the hall</title>
<style>
  /* ---- section 10.1 tokens ---------------------------------------------------------
     Two themes, resolved three ways: bare :root is light, system dark is guarded by
     :root:not([data-theme="light"]) so an explicit light toggle wins over the OS, and
     :root[data-theme="dark"] wins in both directions. The dark block is written twice
     on purpose - CSS cannot share one declaration list between a media query and a
     plain selector, and a variable-of-variables costs more than the duplication.
     The palette is cool slate and there is no brown anywhere: the first floor read as a
     school hall, the instinct was to blame the cast, and it was the room. */
  :root{
    --ink:#F5F6F9; --panel:#FFFFFF; --sunk:#ECEEF3; --raise:#FFFFFF;
    --line:#DCE0E7; --line-2:#C2C9D4;
    --text:#3A424F; --bright:#0E131B; --muted:#6B7585; --faint:#98A1AF;
    --planner:#9A6B10; --coder:#1A6CA8; --tester:#A33468; --reviewer:#1B7A52; --orch:#6B4FA8;
    --ok:#1B7A52; --warn:#9A6B10; --bad:#B03A34;
    --felt:#E7EAF0;
    /* floor tokens - the office view only */
    --floor:#DFE4EA; --floor-2:#D3D9E1; --grout:rgba(255,255,255,.7);
    --wall:#FBFBFC; --wall-edge:#C8CFD8; --wall-shadow:rgba(28,38,52,.14);
    --wood:#B9C1CC; --wood-2:#98A3B2; --deskglass:#EEF1F5;
    --chairc:#7F8B9B; --chairc-2:#68748453;
    --skin:#D8A57C; --legs:#3C4A63; --shoe:#2B3344;
    --eye:#28313F; --pupil:#11161F;
    --screen:#2F9E73; --screen-b:#E4E8EE; --pot:#9BA5B2; --leaf:#7E97A8;
    /* Fira where it is installed, real system fallbacks everywhere else. No <link>: the
       server is dependency-free and serves localhost, so type must not need a network. */
    --mono:"Fira Code",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#090C12; --panel:#11151D; --sunk:#0D1118; --raise:#171D28;
      --line:#1D2531; --line-2:#2C3644;
      --text:#C7CEDA; --bright:#EDF1F6; --muted:#7A8496; --faint:#4A5464;
      --planner:#F2C14E; --coder:#4FA6E0; --tester:#E06C9F; --reviewer:#5FCF9B; --orch:#A98BEA;
      --ok:#5FCF9B; --warn:#F2C14E; --bad:#E0655F;
      --felt:#121822;
      --floor:#161C26; --floor-2:#131922; --grout:rgba(255,255,255,.045);
      --wall:#232C3A; --wall-edge:#0E131B; --wall-shadow:rgba(0,0,0,.6);
      --wood:#39465A; --wood-2:#2A3446; --deskglass:#2E394A;
      --chairc:#3A4658; --chairc-2:#2C3644;
      --skin:#C08E64; --legs:#2C3548; --shoe:#1B2130;
      --eye:#070A0F; --pupil:#05080D;
      --screen:#3FBE8B; --screen-b:#1E2733; --pot:#39465A; --leaf:#46606F;
    }
  }
  :root[data-theme="dark"]{
    --ink:#090C12; --panel:#11151D; --sunk:#0D1118; --raise:#171D28;
    --line:#1D2531; --line-2:#2C3644;
    --text:#C7CEDA; --bright:#EDF1F6; --muted:#7A8496; --faint:#4A5464;
    --planner:#F2C14E; --coder:#4FA6E0; --tester:#E06C9F; --reviewer:#5FCF9B; --orch:#A98BEA;
    --ok:#5FCF9B; --warn:#F2C14E; --bad:#E0655F;
    --felt:#121822;
    --floor:#161C26; --floor-2:#131922; --grout:rgba(255,255,255,.045);
    --wall:#232C3A; --wall-edge:#0E131B; --wall-shadow:rgba(0,0,0,.6);
    --wood:#39465A; --wood-2:#2A3446; --deskglass:#2E394A;
    --chairc:#3A4658; --chairc-2:#2C3644;
    --skin:#C08E64; --legs:#2C3548; --shoe:#1B2130;
    --eye:#070A0F; --pupil:#05080D;
    --screen:#3FBE8B; --screen-b:#1E2733; --pot:#39465A; --leaf:#46606F;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;
    line-height:1.5;display:flex;flex-direction:column;height:100vh;-webkit-font-smoothing:antialiased}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  /* ---- top bar ---- */
  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--bright)}
  .brand b{color:var(--coder)} .brand span{color:var(--faint)}
  .seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);font-family:var(--mono);
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 14px;cursor:pointer}
  .seg button.sel{background:var(--sunk);color:var(--bright)}
  .spacer{margin-left:auto}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--muted);
    font-family:var(--mono);font-size:11px;padding:4px 10px;cursor:pointer}
  .ghost:hover{border-color:var(--line-2);color:var(--text)}
  /* The cast, named once, so a colour in a card never has to be decoded. */
  .legend{display:flex;align-items:center;gap:13px;margin-left:8px}
  .legend span{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .legend .who{width:15px;height:auto}
  .legend .l-planner{color:var(--planner)} .legend .l-coder{color:var(--coder)}
  .legend .l-tester{color:var(--tester)} .legend .l-reviewer{color:var(--reviewer)}
  /* Which teams the hall and the office show. One control for both views, so hidden means
     hidden everywhere; the counts ride in the tabs, so finished work is out of the way
     without being out of sight. */
  .seg button .n{margin-left:7px;font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--muted)}
  .seg button.sel .n{color:var(--text)}
  .seg button:hover:not(.sel){color:var(--text)}
  @media (max-width:900px){ .legend{display:none} }
  .conn{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .conn .led{width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .conn.live .led{background:var(--ok)}

  /* ---- layout: head table left, the hall (or the office) right ---- */
  main{flex:1 1 auto;display:grid;grid-template-columns:288px 1fr;gap:1px;background:var(--line);min-height:0}
  /* The sidebar scrolls on its own: a registry with a dozen services must not push the
     Index button off the page, and must not scroll the hall with it. */
  .head-table{background:var(--panel);overflow-y:auto;overscroll-behavior:contain;
    padding:16px 16px 22px;display:flex;flex-direction:column;gap:18px;
    min-height:0;height:100%;grid-column:1;grid-row:1}
  .head-table>*{flex:0 0 auto}
  /* Both views are placed in the SAME cell on purpose. main is a two-column grid with
     three children, so an auto-placed third child wraps to row 2 column 1 - the bottom
     left corner - the instant hall and office are visible together. Stacking them here
     makes that state unrepresentable instead of merely unlikely. */
  .view{background:var(--ink);overflow:auto;min-height:0;padding:18px 20px 24px;
    grid-column:2;grid-row:1}
  /* !important because #hall sets display:grid, and an id outranks [hidden]: the hall
     stayed laid out under the office, its sprite loops running and its rail dots showing
     through the floor. */
  .view[hidden]{display:none!important}

  /* head table: the orchestrator, exactly three counts, and the repo registry. Anything
     more here competes with the hall it is supposed to summarise. */
  .orch-card{border:1px solid var(--line);border-radius:5px;background:var(--sunk);padding:12px}
  .orch-top{display:flex;align-items:center;gap:10px}
  .orch-card{position:relative;overflow:hidden}
  .orch-card::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--orch)}
  .orch-mark{flex:0 0 auto;display:flex;color:var(--orch)}
  .orch-mark .who{width:22px;height:auto}
  .orch-id{display:flex;flex-direction:column;gap:1px;min-width:0}
  .orch-id b{font-size:13px;color:var(--bright);font-weight:600}
  .orch-name{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--orch)}
  .reg-total{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .reg-link{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:10.5px;
    color:var(--coder);text-decoration:none}
  .reg-link:hover{text-decoration:underline}
  .pri{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:3px;cursor:pointer;
    border:1px solid color-mix(in srgb,var(--orch) 55%,var(--line));
    background:color-mix(in srgb,var(--orch) 14%,transparent);color:var(--orch)}
  .pri:hover{background:color-mix(in srgb,var(--orch) 24%,transparent)}
  /* the dot carries index state, so the row reads left to right: state, name, count */
  .repo .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
  .repo.fresh .dot{background:var(--ok)} .repo.drift .dot{background:var(--warn)}
  .orch-doing{margin-top:8px;color:var(--text);font-size:13px}
  .counts{display:flex;gap:8px}
  .count{flex:1;border:1px solid var(--line);border-radius:4px;padding:7px 8px;background:var(--sunk)}
  .count b{display:block;font-family:var(--mono);font-size:17px;color:var(--bright);line-height:1.2}
  .count span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .count.awaiting b{color:var(--warn)} .count.quiet b{color:var(--bad)}

  .reg-head{display:flex;align-items:baseline;gap:8px}
  .reg-head a{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--coder);text-decoration:none}
  .reg-head a:hover{text-decoration:underline}
  .reg{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .repo{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;
    padding:6px 9px;background:var(--sunk)}
  .repo-name{font-family:var(--mono);font-size:11px;color:var(--text);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .repo-nodes{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
  .ix{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:2px;padding:0 5px;color:var(--muted)}
  .ix.fresh{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
  .ix.drift{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .reg-add{display:flex;gap:6px;margin-top:8px}
  .reg-add input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:3px;
    color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 8px}
  .reg-add input::placeholder{color:var(--muted)}
  .reg-note{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:7px;line-height:1.5}

  footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:8px 20px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  footer b{color:var(--text);font-weight:600}
  /* ---- section 10.3, the cast ----
     A shared body under a hair layer: the shirt keeps the role colour through
     currentColor while the hair gives each agent a face, so a team reads two ways at
     once. Skin, legs, shoes and pupils are theme tokens; hair colours are not - they are
     the same in both themes, because they are what tells the four of them apart. */
  .who{display:block;overflow:visible}
  .who.a-planner{color:var(--planner)} .who.a-coder{color:var(--coder)}
  .who.a-tester{color:var(--tester)} .who.a-reviewer{color:var(--reviewer)}
  .who.a-orch{color:var(--orch)}
  #cast{position:absolute;width:0;height:0;overflow:hidden}

  /* ---- section 10.2, the hall: one card per workstream, and the card is a table ---- */
  #hall{display:grid;grid-template-columns:repeat(auto-fill,minmax(314px,1fr));gap:14px;align-content:start}
  .card{--st:var(--line-2);background:var(--panel);border:1px solid color-mix(in srgb,var(--st) 45%,var(--line));
    border-radius:6px;padding:11px 11px 9px;display:flex;flex-direction:column;gap:8px}
  .card.s-run{--st:var(--coder)} .card.s-gate{--st:var(--warn)}
  .card.s-done{--st:var(--ok)} .card.s-stale{--st:var(--bad)}
  /* a hidden team leaves before the grid closes over the gap it left */
  .card{transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .card.leaving{opacity:0;transform:translateY(-4px)}
  .c-head{display:flex;align-items:center;gap:8px;min-width:0}
  /* Quiet until it is wanted, but never hover-only: a control you cannot see is one you
     cannot find on a touch screen. */
  .c-hide{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:26px;min-width:26px;
    justify-content:center;margin:-5px -5px -5px 0;padding:0 5px;border:1px solid transparent;border-radius:4px;
    background:transparent;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer}
  .c-hide svg{width:15px;height:15px;flex:0 0 auto}
  .c-hide:hover{color:var(--bright);border-color:var(--line-2);background:var(--sunk)}
  .c-hide.txt{color:var(--coder);border-color:color-mix(in srgb,var(--coder) 35%,var(--line));padding:0 9px 0 7px}
  .c-hide[disabled]{opacity:.45;cursor:default}
  .c-name{font-size:14px;font-weight:600;color:var(--bright);text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-name:hover{text-decoration:underline}
  .c-open{font-family:var(--mono);font-size:10px;color:var(--coder);text-decoration:none;opacity:0;
    transition:opacity .15s linear;white-space:nowrap}
  .card:hover .c-open{opacity:1}
  .pill{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--st);border:1px solid color-mix(in srgb,var(--st) 45%,var(--line));border-radius:2px;padding:1px 6px}
  .c-repos{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  /* the felt is a fixed 288x150 so the baton's 26 px inset is a constant, not a measurement */
  .felt{position:relative;width:288px;height:150px;margin:0 auto;background:var(--felt);
    border:1px solid var(--line);border-radius:8px}
  .seat{position:absolute}
  .seat.tl{left:5px;top:3px} .seat.tr{right:5px;top:3px}
  .seat.br{right:5px;bottom:3px} .seat.bl{left:5px;bottom:3px}
  /* section 10.8-1: the fifth seat sits on the bottom edge, outside the clockwise four */
  .seat.op{left:50%;bottom:-6px;margin-left:-13px}

  .rail{position:absolute;left:8px;right:8px;top:50%;margin-top:-9px;display:flex}
  .rail::before{content:"";position:absolute;left:6px;right:6px;top:4px;height:1px;background:var(--line-2);opacity:.7}
  .tk{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint)}
  .tk .d{width:7px;height:7px;border-radius:50%;background:var(--sunk);border:1px solid var(--line-2);
    position:relative;z-index:1}
  .tk .l{font-family:var(--mono);font-size:7px;letter-spacing:.04em;color:var(--faint)}
  .tk.done .d{background:var(--line-2);border-color:var(--line-2)}
  .tk.done .l{color:var(--muted)}
  .tk.cur .d{background:currentColor;border-color:currentColor;transform:scale(1.7)}
  .tk.cur .l{color:currentColor}

  /* one token resting on the felt, inset 26 px from its seat's corner: consecutive hops
     therefore run along an edge, and the path reads as passing work round a table. */
  .baton{position:absolute;left:26px;top:26px;width:10px;height:10px;border-radius:2px;
    background:currentColor;color:var(--muted)}

  .c-foot{display:flex;gap:12px;font-family:var(--mono);font-size:10px;color:var(--muted);flex-wrap:wrap}
  .c-foot b{color:var(--text);font-weight:600}
  .c-foot .fail b{color:var(--bad)}
  .c-stale{font-family:var(--mono);font-size:10px;color:var(--bad)}
  .c-last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-last b{font-family:var(--mono);font-size:10px;font-weight:400}
  .gate{display:flex;gap:6px}
  .gate button{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:3px;color:var(--text);
    font-family:var(--mono);font-size:11px;padding:5px 0;cursor:pointer}
  .gate button[data-d="finalize"]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
  .gate button[data-d="reject"]{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
  .gate button:hover{background:var(--raise)}
  .gate button[disabled]{opacity:.5;cursor:default}

  /* section 10.8-4, revised: a finished team collapses to one line, and it lives on the
     Done tab rather than in the hall. Collapsing in place was not enough - nineteen of
     twenty-four real teams were finished, and their rows pushed the five live ones below
     the fold. The tab keeps the count of closures on screen; the rows go where you look
     for them. Hidden teams collapse the same way. */
  .card.collapsed{grid-column:1/-1;padding:7px 11px;cursor:pointer}
  .card.collapsed>*{display:none}
  .card.collapsed>.c-head{display:flex}

  /* nothing to show under this tab - say what is elsewhere and how work arrives here */
  .blank{grid-column:1/-1;max-width:440px;margin:64px auto 0;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .blank h2{margin:0;font-size:15px;font-weight:600;color:var(--bright);text-wrap:balance}
  .blank p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;text-wrap:pretty}
  .blank .cast{display:flex;gap:10px;margin-bottom:6px}
  .blank .ghost{margin-top:6px}

  /* one message at a time, bottom centre, above the footer; Undo is the reason it exists */
  .toast{position:fixed;left:50%;bottom:46px;z-index:20;display:flex;align-items:center;gap:14px;
    max-width:min(560px,calc(100vw - 32px));padding:8px 8px 8px 14px;border:1px solid var(--line-2);
    border-radius:6px;background:var(--raise);color:var(--text);font-size:13px;
    box-shadow:0 12px 32px -10px rgba(9,12,18,.45),0 2px 4px rgba(9,12,18,.12);
    opacity:0;transform:translate(-50%,8px);pointer-events:none;
    transition:opacity 180ms var(--ease-out),transform 220ms var(--ease-out)}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast.err{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
  .toast .msg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast .msg b{color:var(--bright);font-weight:600}
  .toast button{flex:0 0 auto;background:transparent;border:1px solid var(--line-2);border-radius:4px;
    color:var(--coder);font-family:var(--mono);font-size:11px;padding:4px 11px;cursor:pointer}
  .toast button:hover{background:var(--sunk);color:var(--bright)}

  /* ---- section 10.4, the motion inventory: eight entries, six rules ----------------
     Six of the eight are one agent's states plus the two that mark a change. If this
     list grows to twenty, that is the bug.
       1. stepped, never eased - a pixel character that tweens reads as a moving div
       2. exactly one agent per table types; the rest are at much lower --amp
       3. something always moves at rest - a still floor reads as a broken dashboard
       4. stillness is the alarm - a stale team freezes mid-keystroke and dims
       5. transform and opacity only: no layout, no paint, no transition:all
       6. prefers-reduced-motion stops every loop and leaves the resting pose */

  /* 1 · baton travel — handoff — transform — 280 ms ease-in-out */
  .baton{transition:transform 280ms var(--ease-in-out)}
  /* 2 · typing — the one agent that holds the work — 340 ms steps(1), loops */
  @keyframes typing{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-1.5px * var(--amp,1)))}}
  .who.st-type{animation:typing 340ms steps(1) infinite}
  /* the rail's current tick beats on the same rhythm, in the active agent's colour -
     reusing an entry is how the inventory stays at eight */
  .tk.cur{--amp:.55;animation:typing 340ms steps(1) infinite}
  /* 3 · waiting — turn not yet come — 3.4 s steps(1), loops */
  @keyframes waiting{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-1px * var(--amp,1)))}}
  .who.st-wait{--amp:.5;animation:waiting 3.4s steps(1) infinite}
  /* 4 · asleep — agent finished — 3.6 s, opacity and transform */
  @keyframes sleeping{0%,100%{opacity:.62;transform:translateY(0)}50%{opacity:.48;transform:translateY(.8px)}}
  .who.st-sleep{animation:sleeping 3.6s steps(1) infinite}
  /* 5 · walking in — the baton lands — 440 ms steps(4), once. On the seat, not the
     sprite, so the arriving agent keeps its own loop. */
  @keyframes walk-in{from{transform:translateX(-10px);opacity:.6}to{transform:translateX(0);opacity:1}}
  .seat.arrive{animation:walk-in 440ms steps(4) 1}
  /* 6 · table entrance — first paint only — 260 ms ease-out, never replays */
  @keyframes table-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .card.enter{animation:table-in 260ms var(--ease-out) 1}
  /* 7 · repo row in — you register a repo — 240 ms ease-out */
  @keyframes row-in{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:translateX(0)}}
  .repo.enter{animation:row-in 240ms var(--ease-out) 1}
  /* 8 · going quiet — stale > 3 min — freeze plus opacity — 2.6 s ease-in-out, loops */
  @keyframes going-quiet{0%,100%{opacity:1}50%{opacity:.5}}
  .card.s-stale .felt{animation:going-quiet 2.6s var(--ease-in-out) infinite}
  .card.s-stale .who,.card.s-stale .tk.cur{animation-play-state:paused}

  /* ---- section 10.5, the office floor ----
     One open floor; the building's outer wall is the only wall. A team is a desk island
     on a rug and the rug carries the state, so you read the rug before you find a single
     agent - which is what a floor plan has to earn for being slower to scan than a table. */
  #office{padding:0;position:relative;overflow:hidden;cursor:grab}
  #office.drag{cursor:grabbing}
  .floor{position:absolute;left:0;top:0;transform-origin:0 0;border:4px solid var(--wall);
    box-shadow:0 0 0 1px var(--wall-edge),inset 0 0 44px var(--wall-shadow);
    background:
      repeating-linear-gradient(0deg,var(--grout) 0 1px,transparent 1px 34px),
      repeating-linear-gradient(90deg,var(--grout) 0 1px,transparent 1px 34px),
      linear-gradient(160deg,var(--floor),var(--floor-2))}
  .pod{position:absolute;width:156px;height:118px}
  .rug{position:absolute;inset:-8px -8px -34px;border-radius:12px;
    background:var(--floor-2);border:1px solid var(--line)}
  .pod.s-run .rug{background:color-mix(in srgb,var(--coder) 9%,var(--floor-2));
    border-color:color-mix(in srgb,var(--coder) 34%,var(--line))}
  .pod.s-gate .rug{background:color-mix(in srgb,var(--warn) 16%,var(--floor-2));
    border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
  .pod.s-stale .rug{background:color-mix(in srgb,var(--bad) 16%,var(--floor-2));
    border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
  /* Finished reads as finished rather than as the default: without its own rule a done
     team was simply whatever a pod looks like with no state, which is the one thing the
     rug is supposed to say at a glance. */
  .pod.s-done .rug{background:color-mix(in srgb,var(--ok) 7%,var(--floor-2));
    border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
  .pod.s-done .rug{opacity:.4}
  /* The name is a nameplate on the seam between the two desk rows. Above the pod it sat
     inside the previous row's rug, on top of that team's bottom pair. */
  .pod-name{position:absolute;left:6px;right:6px;top:68px;z-index:1;text-align:center;font-family:var(--mono);
    font-size:9.5px;line-height:14px;color:var(--text);text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a.pod-name:hover{color:var(--bright);text-decoration:underline;text-underline-offset:2px}
  .pod.orch .pod-name{top:36px}
  /* desks back to back down the middle, bodies on the outer edges: four fit in nearly
     the space of two, and no agent is ever in front of a screen */
  .desk{position:absolute;width:62px;height:30px;border-radius:3px;background:var(--wood);
    border:1px solid var(--wood-2);box-shadow:inset 0 5px 0 var(--deskglass)}
  .scr{position:absolute;right:5px;top:3px;width:20px;height:13px;border-radius:1px;
    background:var(--screen-b);border:1px solid var(--wood-2);overflow:hidden}
  .scr i{display:block;height:4px;margin:2px 2px 4px;background:var(--screen)}
  .chair{position:absolute;width:20px;height:7px;border-radius:3px;background:var(--chairc);
    border:1px solid var(--chairc-2)}
  .plant{position:absolute;width:14px;height:20px}
  .plant b{position:absolute;bottom:0;left:2px;width:10px;height:7px;background:var(--pot);border-radius:1px}
  .plant i{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50% 50% 40% 40%;background:var(--leaf)}
  .body{position:absolute}
  /* the working desk's screen scrolls: the cheapest "something is happening here" that
     moves no body at all (section 10.5, not a ninth inventory entry) */
  @keyframes screen-scroll{from{transform:translateY(0)}to{transform:translateY(-9px)}}
  .desk.work .scr i{animation:screen-scroll 1.2s steps(4) infinite}
  /* section 10.8-2: pods outside the viewport stop animating. At twelve teams that is
     ~24 simultaneous sprite loops, and the floor - not the hall - is where it bites. */
  /* grey, and no role colour: they are the one thing in the room that means nothing */
  .walker .who{color:var(--faint)}
  .pod.off *{animation-play-state:paused!important}
  .pod.s-stale .who{animation-play-state:paused}

  .empty{color:var(--muted);font-size:13px;padding:36px 4px;font-family:var(--mono)}
  /* floor toolbar - the reader zooms, the floor never stretches itself */
  .fbar{display:flex;align-items:center;gap:7px;margin:0 2px 12px;font-family:var(--mono);font-size:10.5px;flex-wrap:wrap}
  .fbar-l{letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .fbar .ghost{padding:2px 9px;min-width:30px}
  #zoom-pct{color:var(--text);min-width:40px;text-align:center}
  .fbar-hint{margin-left:auto;color:var(--muted)}
  .pod.orch .rug{background-color:color-mix(in srgb,var(--orch) 22%,var(--floor-2))}
  .pod.orch .pod-name{color:var(--orch);border-color:color-mix(in srgb,var(--orch) 55%,var(--line))}
  /* A refused gate has to read as refused, not as a button that went quiet. */
  .gate-err{font-family:var(--mono);font-size:10px;color:var(--bad);align-self:center}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  ::selection{background:color-mix(in srgb,var(--coder) 30%,transparent);color:var(--bright)}
  :focus-visible{outline:2px solid var(--coder);outline-offset:2px}
  /* One column: the work first, the head table under it. Both are placed explicitly on
     wide screens, so they have to be re-placed here or they share a single cell. */
  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
    .view{grid-column:1;grid-row:1}
    .head-table{grid-column:1;grid-row:2;height:auto;max-height:40vh}
  }

  /* Section 10.4 rule 6: every loop stops and the resting pose stays. Declared here so
     every later rule in this file inherits it. */
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Staleness, same rule as the board (ui/index.html): pipe.py stamps updatedAt on every
   run.json write, so silence there means no agent has touched the bus. Only "running"
   counts - awaiting_approval is supposed to sit still and done/blocked are terminal. */
const STALE_MS=180000; // 3 min
function staleMs(p){
  if(!p||p.status!=="running"||!p.updatedAt) return 0;
  const age=Date.now()-new Date(p.updatedAt);
  return age>STALE_MS?age:0;
}
function agoTxt(ms){const m=Math.floor(ms/60000);return m<60?`${m}m`:`${Math.floor(m/60)}h ${m%60}m`;}

/* run / gate / done / stale - the pill, the card border and the rug all read this one
   function, so they can never disagree. */
function cardState(p){
  if(p.status==="done") return "done";
  if(p.status==="awaiting_approval") return "gate";
  if(staleMs(p)) return "stale";
  if(p.status==="blocked"||p.status==="failed") return "stale";
  return "run";
}

/* ---- section 10.3, the cast ----
   One body, one face, one hair layer. `back` is the seat's geometry (the near pair face
   away from you); `state` is what the agent is doing. */
function sprite(role,opts){
  const o=opts||{}, state=o.state||"wait", px=o.px||27;
  // TWO hair layers per character. -back fills the whole skull, because from behind
  // there is no face to leave room for; the front one caps the head instead. Never turn
  // a sleeping agent around - its shut eyes are the whole point of the pose.
  const rear=!!o.back&&state!=="sleep";
  // A seated agent is cropped at the waist: the legs are under a desk either way.
  const units=o.seated?13.4:18;
  const face=rear?"":`<use href="#who-${state==="sleep"?"face-shut":"face"}"/>`;
  return `<svg class="who a-${role} st-${state}" width="${px}" height="${(px/12*units).toFixed(1)}"
    viewBox="0 0 12 ${units}" shape-rendering="crispEdges" aria-hidden="true"
    ><use href="#who-body"/>${face}<use href="#hair-${role}${rear?"-back":""}"/></svg>`;
}

/* Section 10.8-1: the operator gets a fifth seat on the bottom edge of the felt, and it
   renders ONLY when the run actually has one - the clockwise four-corner geometry is
   what makes position mean role, and most runs have no operator. The bus carries no
   dedicated flag yet (agents/operator.md is a later task), so presence is read from what
   it does carry: an operator holding the work, or one that has spoken. */
function hasOperator(p){
  return !!(p&&(p.operator||p.activeAgent==="operator"
    ||(p.lastEvent&&p.lastEvent.agent==="operator")));
}

let HALL={root:"",pipelines:[]};
let EXTRA_REPOS=[];   // repos you registered here; the payload owns the rest
let NEW_REPO=null;    // the one row that just arrived - entry 7 animates only that one
let DEMO=false;       // ?demo=1: hides change this page only, nothing is written

/* ---- which teams are on show ----
   Every team sits on exactly one shelf. Hidden wins over done, because hiding is the one
   you chose; the server ties a hide to the run it was made in, so a new wave returns to
   Active by itself. The hall and the office both draw shown(), never the raw scan. */
const SHOWS=["active","done","hidden"];
let SHOW=SHOWS.includes(new URLSearchParams(location.search).get("show"))
  ?new URLSearchParams(location.search).get("show"):"active";
const shelf=p=>p.hidden?"hidden":p.status==="done"?"done":"active";
// What needs you first, then what may have died, then what is moving; newest first within.
const URGENCY={gate:0,stale:1,run:2,done:3};
const byUrgency=(a,b)=>URGENCY[cardState(a)]-URGENCY[cardState(b)]
  ||String(b.updatedAt||"").localeCompare(String(a.updatedAt||""));
function shown(){return HALL.pipelines.filter(p=>shelf(p)===SHOW).sort(byUrgency);}
function shelfCounts(){
  const c={active:0,done:0,hidden:0};
  for(const p of HALL.pipelines) c[shelf(p)]++;
  return c;
}

function repoRows(){
  // The service registry is what the project owns; run.repos[] is only what a workstream
  // has so far created worktrees for, and is empty for the whole of an in-place run - so
  // reading only that left this panel permanently empty.
  const seen=new Map();
  for(const s of (HALL.registry||[])) seen.set(s.name,{name:s.name,path:s.path});
  for(const p of HALL.pipelines) for(const r of (p.repos||[])) if(!seen.has(r)) seen.set(r,{name:r});
  for(const r of EXTRA_REPOS) if(!seen.has(r)) seen.set(r,{name:r});
  return [...seen.values()];
}
function paintTabs(){
  const c=shelfCounts();
  document.querySelectorAll("#show-seg button").forEach(b=>{
    b.classList.toggle("sel",b.dataset.show===SHOW);
    b.setAttribute("aria-pressed",String(b.dataset.show===SHOW));
    b.querySelector(".n").textContent=HALL.pipelines.length?c[b.dataset.show]:"";
  });
}
function renderHeadTable(){
  // A team you hid has stopped asking for attention, so it leaves the counts too.
  const ps=HALL.pipelines.filter(p=>!p.hidden);
  const running=ps.filter(p=>cardState(p)==="run").length;
  const awaiting=ps.filter(p=>cardState(p)==="gate").length;
  const quiet=ps.filter(p=>cardState(p)==="stale").length;
  document.getElementById("counts").innerHTML=
    `<div class="count"><b>${running}</b><span>running</span></div>
     <div class="count awaiting"><b>${awaiting}</b><span>awaiting you</span></div>
     <div class="count quiet"><b>${quiet}</b><span>quiet</span></div>`;

  // The orchestrator's one line, in the same voice as a team's last event.
  const evs=ps.map(p=>p.lastEvent).filter(Boolean).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const own=evs.filter(e=>e.agent==="orchestrator");
  const e=own.length?own[own.length-1]:evs[evs.length-1];
  document.getElementById("orch-doing").textContent=
    e?e.summary:(ps.length?`watching ${ps.length} team${ps.length>1?"s":""}`:"idle");

  const rows=repoRows();
  document.getElementById("reg").innerHTML=rows.length?rows.map(r=>{
    // fresh / drift (HEAD moved) / none (never indexed) - whatever the payload carries.
    // fresh / drift (HEAD moved) / none (never indexed) - whatever the payload carries.
    // Nothing reports it today, so the honest right-hand value is a dash rather than a
    // count this server cannot know: the graph service owns that and the link hands off.
    const st=r.index||"none";
    const right=r.nodes!=null?Number(r.nodes).toLocaleString("en-US")
              :st==="drift"?"HEAD moved":st==="none"?"—":"indexed";
    return `<div class="repo ${esc(st)}${r.name===NEW_REPO?" enter":""}" title="${esc(r.path||r.name)}"
      ><span class="dot"></span><span class="repo-name">${esc(r.name)}</span>
      <span class="repo-nodes">${esc(right)}</span></div>`;
  }).join(""):`<div class="reg-note">no <code>agent-orchestration.config.json</code> found above this
      server's working directory, and no workstream has recorded a repo yet</div>`;
  NEW_REPO=null;
  const known=rows.filter(r=>r.nodes!=null);
  document.getElementById("reg-total").textContent = known.length
    ? known.reduce((a,r)=>a+Number(r.nodes),0).toLocaleString("en-US")+" nodes"
    : rows.length ? rows.length+" registered" : "";
  const mk=document.getElementById("orch-mark");
  if(mk && !mk.childElementCount) mk.innerHTML=sprite("orch",{px:22});

  // The tabs carry the per-shelf counts; the footer says what is being watched.
  const all=HALL.pipelines.length;
  document.getElementById("foot").innerHTML=
    `<b>${all}</b> team${all===1?"":"s"} under ${esc(HALL.root)}`;
  paintTabs();

  // The cast named once in the chrome, so a role colour inside a card never needs decoding.
  const LEGEND=[["planner","plan"],["coder","code"],["tester","test"],["reviewer","review"]];
  const lg=document.getElementById("legend");
  if(!lg.childElementCount)
    lg.innerHTML=LEGEND.map(([role,label])=>
      `<span class="l-${role}">${sprite(role,{px:15})}${label}</span>`).join("");
}

/* Four seats at the corners of the felt in pipeline order clockwise. The near pair face
   away from you, which is what the -back hair layer exists for. */
const SEATS=[
  {role:"planner", pos:"tl", back:false},
  {role:"coder",   pos:"tr", back:false},
  {role:"tester",  pos:"br", back:true},
  {role:"reviewer",pos:"bl", back:true},
];
const RAIL=["spec","plan","implement","test","review","done"];
const STAGE={planner:1,coder:2,tester:3,reviewer:4,operator:2};
// The hall's rail has no qa tick (section 10.2), so qa reads as the end of review.
function railIdx(ph){return ph==="qa"?4:RAIL.indexOf(ph);}

/* Rule 2: exactly one agent per table types. The rest wait, or sleep once their stage is
   behind the run - "busy" stays legible by being the exception in its own row. */
function seatState(p,role){
  if(p.status==="done") return "sleep";
  if(p.activeAgent===role) return "type";
  return railIdx(p.phase)>STAGE[role]?"sleep":"wait";
}
// The baton rests 26 px in from its seat's corner of the 288x150 felt.
const BATON={planner:[0,0],coder:[226,0],tester:[226,88],reviewer:[0,88],operator:[113,88]};
const AGENT_COLOR={planner:"var(--planner)",coder:"var(--coder)",tester:"var(--tester)",
  reviewer:"var(--reviewer)",operator:"var(--orch)",orchestrator:"var(--orch)"};

function testCount(p){
  const s=p.services; if(!s) return null;
  const v=Object.values(s);
  const passed=v.reduce((a,x)=>a+(x.passed||0),0), failed=v.reduce((a,x)=>a+(x.failed||0),0);
  return passed+failed?{passed,failed,total:passed+failed}:null;
}

// Lucide's eye and eye-off (ISC), inline so the page still makes no runtime request.
const ICON_EYE=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_EYE_OFF=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.73 5.08a10.74 10.74 0 0 1 11.2 6.57 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49"/><path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"/><path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14"/><path d="m2 2 20 20"/></svg>`;

const SEEN=new Set();   // entry 6: the table entrance is first paint only, and never replays
const HOLDER={};        // who held the work last frame, per slug - entries 1 and 5

function card(p){
  const st=cardState(p), sm=staleMs(p), cur=railIdx(p.phase);
  const holder=p.activeAgent||"planner";
  const colour=AGENT_COLOR[holder]||"var(--muted)";
  const prev=HOLDER[p.slug]||holder, moved=prev!==holder;
  HOLDER[p.slug]=holder;
  const [bx,by]=BATON[prev]||BATON.planner, [tx,ty]=BATON[holder]||BATON.planner;
  const fresh=!SEEN.has(p.slug); SEEN.add(p.slug);
  const seats=SEATS.map(s=>`<div class="seat ${s.pos}${moved&&s.role===holder?" arrive":""}">${
    sprite(s.role,{back:s.back,state:seatState(p,s.role)})}</div>`).join("")
    + (hasOperator(p)?`<div class="seat op${moved&&holder==="operator"?" arrive":""}">${
        sprite("orch",{state:seatState(p,"operator")})}</div>`:"");
  const rail=RAIL.map((ph,i)=>`<span class="tk ${i<cur?"done":i===cur?"cur":""}"
      style="color:${i===cur?colour:""}"><i class="d"></i><i class="l">${ph}</i></span>`).join("");
  const t=testCount(p), loop=p.loop||{count:0,max:5};
  const ev=p.lastEvent, name=p.feature||p.slug;
  // Finished and hidden teams fold to one line; clicking the line opens it back up.
  const fold=st==="done"||p.hidden;
  const hide=p.hidden
    ?`<button class="c-hide txt" type="button" data-hide="0" aria-label="Unhide ${esc(name)}"
        title="Put it back in the hall and the office">${ICON_EYE}Unhide</button>`
    :`<button class="c-hide" type="button" data-hide="1" aria-label="Hide ${esc(name)}"
        title="Hide from the hall and the office until its next run">${ICON_EYE_OFF}</button>`;
  return `<article class="card s-${st}${fold?" collapsed":""}${fresh?" enter":""}" data-slug="${esc(p.slug)}"${fold?" data-fold":""}>
    <div class="c-head">
      <a class="c-name" href="/r/${encodeURIComponent(p.slug)}">${esc(name)}</a>
      <a class="c-open" href="/r/${encodeURIComponent(p.slug)}">open →</a>
      <span class="pill">${st}</span>${hide}</div>
    <div class="c-repos">${esc((p.repos||[]).join(" · ")||p.slug)}</div>
    <div class="felt">${seats}<div class="rail">${rail}</div>
      <div class="baton" data-to="translate(${tx}px,${ty}px)" style="color:${colour};transform:translate(${bx}px,${by}px)"></div></div>
    <div class="c-foot"><span>phase <b>${esc(p.phase||"—")}</b></span>
      <span>loop <b>${loop.count}/${loop.max}</b></span>
      ${t?`<span class="${t.failed?"fail":""}">tests <b>${t.passed}/${t.total}</b></span>`:""}</div>
    ${sm?`<div class="c-stale">◉ no activity ${agoTxt(sm)} — agent may have died</div>`:""}
    ${ev?`<div class="c-last"><b style="color:${AGENT_COLOR[ev.agent]||"var(--muted)"}">${
        esc(ev.agent)}</b> ${esc(ev.summary)}</div>`:""}
    ${st==="gate"?`<div class="gate">
      <button data-d="finalize">Finalize</button>
      <button data-d="in-place">In place</button>
      <button data-d="reject">Reject</button></div>`:""}
  </article>`;
}

/* What the card actually draws. Rebuilding every card on every frame would restart every
   sprite loop in the hall two or three times a second - rule 3 says something always
   moves, so only a card whose signature changed is replaced. */
function cardSig(p){
  return [p.status,p.phase,p.activeAgent,(p.loop||{}).count,!!staleMs(p),hasOperator(p),p.hidden,
    (p.repos||[]).join(","),p.lastEvent&&p.lastEvent.ts,JSON.stringify(p.services||null)].join("|");
}

/* An empty tab says what is on the other tabs and how work gets onto this one. */
function noneHTML(){
  if(!HALL.pipelines.length) return `<div class="empty">no pipelines under ${esc(HALL.root)}</div>`;
  const c=shelfCounts();
  if(SHOW==="active") return `<div class="blank">
    <div class="cast">${["planner","coder","tester","reviewer"].map(r=>sprite(r,{state:"sleep",px:22})).join("")}</div>
    <h2>Nobody is working right now</h2>
    <p>${c.done} finished${c.hidden?` and ${c.hidden} hidden`:""}. A run appears here the moment
      <code>/ship</code> starts one.</p>
    ${c.done?`<button class="ghost" type="button" data-show="done">See finished work</button>`:""}</div>`;
  if(SHOW==="done") return `<div class="blank"><h2>Nothing has finished yet</h2>
    <p>A team moves here once its run reaches <b>done</b>.</p></div>`;
  return `<div class="blank"><h2>Nothing is hidden</h2>
    <p>Hide a team from its card to clear it out of the hall and the office. It comes back
      on its own when its workstream starts a new run.</p></div>`;
}

const CARD_SIG={};
let NONE=null;          // the empty state on screen, so an unchanged one is not redrawn
function renderHall(){
  const el=document.getElementById("hall");
  const list=shown();
  if(!list.length){
    const html=noneHTML();
    if(NONE!==html){ el.innerHTML=html; NONE=html; }
    return;
  }
  if(NONE!==null||el.querySelector(".empty")){ el.innerHTML=""; NONE=null; }
  const nodes=new Map([...el.children].map(c=>[c.dataset.slug,c]));
  // Replace only a card whose signature changed, and move a node only when it is out of
  // order: re-inserting a card restarts every sprite loop on it.
  let prev=null;
  for(const p of list){
    let node=nodes.get(p.slug);
    if(!node||CARD_SIG[p.slug]!==cardSig(p)){
      const t=document.createElement("template"); t.innerHTML=card(p);
      const fresh=t.content.firstElementChild;
      if(node) node.replaceWith(fresh);
      node=fresh; CARD_SIG[p.slug]=cardSig(p);
    }
    const want=prev?prev.nextElementSibling:el.firstElementChild;
    if(node!==want) el.insertBefore(node,want);
    prev=node; nodes.delete(p.slug);
  }
  for(const n of nodes.values()) n.remove();
  // The baton is drawn where it was and moved on the next frame - a token that appears
  // at its destination has not travelled.
  requestAnimationFrame(()=>el.querySelectorAll(".baton[data-to]").forEach(b=>{
    b.style.transform=b.dataset.to; b.removeAttribute("data-to");}));
}
// A folded team is still a team: clicking its row opens it back up.
document.getElementById("hall").addEventListener("click",e=>{
  if(e.target.closest(".gate,.c-hide,a")) return;    // those own their own clicks
  const go=e.target.closest("[data-show]");
  if(go) return setShow(go.dataset.show);
  const c=e.target.closest(".card");
  if(c&&c.hasAttribute("data-fold")) c.classList.toggle("collapsed");
});

/* ---- hide / unhide ----
   Optimistic: the card leaves at once and the toast offers Undo. PENDING holds the choice
   over any frame the stream sends before the server has written it, so a card does not
   blink back in; a refused write puts the card back and says why. */
const PENDING={};
document.getElementById("hall").addEventListener("click",e=>{
  const b=e.target.closest(".c-hide"); if(!b) return;
  const c=b.closest(".card");
  setHidden(c.dataset.slug,b.dataset.hide==="1",c);
});
async function setHidden(slug,hidden,cardEl){
  const p=HALL.pipelines.find(x=>x.slug===slug); if(!p) return;
  const name=esc(p.feature||slug);
  PENDING[slug]=hidden;
  if(cardEl){
    cardEl.querySelectorAll("button").forEach(x=>x.disabled=true);
    cardEl.classList.add("leaving");
    await new Promise(r=>setTimeout(r,160));     // the exit, then the grid closes the gap
  }
  render();
  toast(hidden?`Hidden <b>${name}</b>`
              :`<b>${name}</b> is back in ${shelf(p)==="done"?"Done":"Active"}`,
        ()=>setHidden(slug,!hidden));
  let ok=true;
  if(!DEMO) try{
    const r=await fetch("/api/hide",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slug,hidden})});
    if(!r.ok) throw new Error("the server said "+r.status);
  }catch(err){
    ok=false;
    toast(`Could not ${hidden?"hide":"unhide"} <b>${name}</b> - ${esc(err.message)}`,null,true);
  }
  if(PENDING[slug]!==hidden) return;            // a later click (Undo) owns this team now
  delete PENDING[slug];
  const q=HALL.pipelines.find(x=>x.slug===slug);
  if(q) q.hidden=ok?hidden:!hidden;
  render();
}

let TOAST_T=0;
function toast(html,undo,bad){
  const t=document.getElementById("toast");
  t.className="toast on"+(bad?" err":"");
  t.innerHTML=`<span class="msg">${html}</span>`+(undo?`<button type="button">Undo</button>`:"");
  if(undo) t.querySelector("button").onclick=()=>{t.classList.remove("on");undo();};
  const later=()=>{clearTimeout(TOAST_T);TOAST_T=setTimeout(()=>t.classList.remove("on"),6000);};
  t.onmouseenter=()=>clearTimeout(TOAST_T);     // reading it, or reaching for Undo
  t.onmouseleave=later;
  later();
}

/* Section 6 and 14: the browser half writes the same gate.json the terminal does. The
   decision is one of three fixed strings the server re-checks, and the slug is the card's
   own - nothing here is read from the URL. */
document.getElementById("hall").addEventListener("click",async e=>{
  const b=e.target.closest(".gate button"); if(!b) return;
  const row=b.parentElement, slug=(b.closest(".card")||{}).dataset?.slug;
  if(!slug) return;
  const btns=[...row.querySelectorAll("button")], was=b.textContent;
  btns.forEach(x=>x.disabled=true);
  row.querySelectorAll(".gate-err").forEach(x=>x.remove());
  b.textContent="sending…";
  try{
    const r=await fetch("/api/gate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({slug,decision:b.dataset.d})});
    if(!r.ok) throw new Error("server said "+r.status);
    b.textContent="sent";
    await pull();                                    // reflect the new status immediately
  }catch(err){
    // A 400 or a 404 must not look like an approval. Put the row back and say why.
    b.textContent=was; btns.forEach(x=>x.disabled=false);
    const m=document.createElement("span");
    m.className="gate-err"; m.textContent="not approved — "+err.message;
    row.append(m);
  }
});
/* ---- section 10.5, the office floor -----------------------------------------------
   The same bus data, read the ambient way. Behaviour maps to state, not decoration:
   typing at a desk means it holds the work, asleep means finished, frozen mid-keystroke
   means quiet, and the team standing together means a finalize gate. */
const BUILDING_W=566, BUILDING_H=418;          // six pods fit; past that the floor grows
// A rug overhangs its island by 8 above and 34 below, so at the original 152 one row's
// rug ran into the next row's; 182 leaves the same 22 px aisle down the floor as across it.
const POD_XS=[18,212,406], POD_Y0=16, POD_DY=182;
// Seating is facing pairs: desks back to back down the middle, bodies on the outer
// edges. Four fit in nearly the space of two and no agent is ever in front of a screen.
const POD=[
  {"role":"planner", "x":26,"y":4,  "dx":12,"dy":34,"back":false},
  {"role":"coder",   "x":96,"y":4,  "dx":82,"dy":34,"back":false},
  {"role":"tester",  "x":26,"y":120,"dx":12,"dy":86,"back":true},
  {"role":"reviewer","x":96,"y":120,"dx":82,"dy":86,"back":true}
];
// Only a gate gathers them. Agents do not walk between desks on a handoff (10.8-3):
// the baton and the seat-level walk-in already carry it, and an agent in transit has no
// legible state.
const MEET=[[12,116],[42,116],[72,116],[102,116]];   // standing, they end at the rug's edge

/* The corridor graph. Desk islands occupy x 18-174 / 212-368 / 406-562 and y 16-134 /
   198-316, so the walkable space is the two vertical aisles and the horizontal ones.
   Every edge here is purely horizontal or vertical - that is what stops a walker cutting
   the corner through somebody's desk. */
const NODES={"a":[193,10],"b":[387,10],"c":[193,179],"d":[387,179],"e":[193,378],"f":[387,378]};
const EDGES=[["a","b"],["c","d"],["e","f"],["a","c"],["c","e"],["b","d"],["d","f"]];
// The bottom corridor follows the last row down as the floor grows; at two rows it is
// the 378 declared above.
function nodeAt(k,rows){const n=NODES[k];return (k==="e"||k==="f")?[n[0],POD_Y0+rows*POD_DY-2]:n;}

function podSig(p){return cardSig(p);}
const POD_SIG={};

function podHTML(p,i){
  const st=cardState(p), gate=st==="gate";
  const x=POD_XS[i%3], y=POD_Y0+Math.floor(i/3)*POD_DY;
  const people=(gate?POD.map((a,j)=>({role:a.role,x:MEET[j][0],y:MEET[j][1],back:false}))
                    :POD).map(a=>
    `<div class="chair" style="left:${a.x+2}px;top:${a.back?a.y+21:a.y-5}px"></div>
     <div class="body" style="left:${a.x}px;top:${a.y}px">${
       sprite(a.role,{back:a.back,state:seatState(p,a.role),seated:!gate,px:24})}</div>`).join("");
  const desks=POD.map(a=>`<div class="desk${!gate&&p.activeAgent===a.role?" work":""}"
    style="left:${a.dx}px;top:${a.dy}px"><div class="scr"><i></i></div></div>`).join("");
  return `<div class="pod s-${st}" data-slug="${esc(p.slug)}" style="left:${x}px;top:${y}px">
    <div class="rug"></div><a class="pod-name" href="/r/${encodeURIComponent(p.slug)}"
      title="${esc(p.feature||p.slug)}">${esc(p.feature||p.slug)}</a>
    ${desks}${people}</div>`;
}

/* The conductor sits apart, on its own rug, because it does a different job: it owns the
   things that belong to the project rather than to any one feature. A floor that shows
   four teams and hides what is directing them hides the decision-maker. */
function orchHTML(ps){
  const i=ps.length, x=POD_XS[i%3], y=POD_Y0+Math.floor(i/3)*POD_DY;
  const live=shelfCounts().active;     // the whole room's, whichever tab is showing
  return `<div class="pod orch" style="left:${x}px;top:${y}px">
    <div class="rug"></div>
    <div class="pod-name">orchestrator &middot; ${live} live</div>
    <div class="desk work" style="left:47px;top:60px"><div class="scr"><i></i></div></div>
    <div class="chair" style="left:65px;top:104px"></div>
    <div class="body" style="left:63px;top:98px">${
      sprite("orch",{back:true,state:live?"work":"idle",seated:true,px:24})}</div>
  </div>`;
}

/* Two walkers, on the graph, one axis at a time. They are the only thing in the room
   that means nothing, and they are grey for exactly that reason. */
function startWalkers(floor,rows){
  const keys=Object.keys(NODES);
  [0,1].forEach(n=>{
    const el=document.createElement("div");
    el.className="walker"; el.style.position="absolute"; el.style.left="0"; el.style.top="0";
    el.innerHTML=sprite("orch",{state:"wait",px:24});
    floor.append(el);
    let at=keys[n?5:0];
    const put=(k,ms)=>{const c=nodeAt(k,rows);
      el.style.transition=ms?`transform ${ms}ms steps(${Math.max(2,Math.round(ms/90))})`:"";
      el.style.transform=`translate(${c[0]-12}px,${c[1]-20}px)`;};
    const step=()=>{
      if(!el.isConnected) return;                       // the floor was rebuilt
      const next=EDGES.filter(e=>e.indexOf(at)>=0).map(e=>e[0]===at?e[1]:e[0]);
      const to=next[Math.floor(Math.random()*next.length)];
      const a=nodeAt(at,rows), b=nodeAt(to,rows);
      const ms=(Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]))*14;
      put(to,ms); at=to;
      setTimeout(step,ms+700+Math.random()*1800);
    };
    put(at,0);
    setTimeout(step,500+n*1100);
  });
}

// Section 10.8-2. Capping the floor would hide exactly the stalled pipelines the floor
// exists to surface, so the building grows and the cost is bounded where it actually
// is: the sprite loops of pods you are not looking at.
let IO=null;
function observePods(floor){
  const host=document.getElementById("office");
  if(!IO) IO=new IntersectionObserver(es=>es.forEach(e=>
    e.target.classList.toggle("off",!e.isIntersecting)),{root:host,rootMargin:"120px"});
  IO.disconnect();
  floor.querySelectorAll(".pod").forEach(el=>IO.observe(el));
}

/* Zoom and pan over real DOM, not a canvas rewrite: every agent keeps its tooltip, its
   CSS animation and its theme tokens. Ctrl+wheel anchors on the pointer; drag pans. */
let Z=1,PX=24,PY=24;
/* The floor stays at its own size and does NOT stretch to the viewport: a fixed building
   keeps every pod the same size run to run, which is what makes it scannable. Fit is a
   control the reader reaches for, not something that happens to them. */
function fitView(){
  const host=document.getElementById("office"), f=host.querySelector(".floor");
  if(!f || !host.clientWidth) return;
  const pad=16;
  Z=Math.max(0.5,Math.min(2.5,
    Math.min((host.clientWidth-pad*2)/f.offsetWidth,(host.clientHeight-pad*2)/f.offsetHeight)));
  PX=Math.max(pad,(host.clientWidth-f.offsetWidth*Z)/2);
  PY=pad;
  applyView(); showZoom();
}
function showZoom(){
  const el=document.getElementById("zoom-pct");
  if(el) el.textContent=Math.round(Z*100)+"%";
}
function setZoom(z){
  Z=Math.max(0.5,Math.min(2.5,Math.round(z*100)/100));
  applyView(); showZoom();
}
function applyView(){
  const f=document.querySelector("#office .floor");
  if(f) f.style.transform=`translate(${PX}px,${PY}px) scale(${Z})`;
}
(function view(){
  const host=document.getElementById("office");
  host.addEventListener("wheel",e=>{
    e.preventDefault();
    if(!e.ctrlKey){                            // plain wheel scrolls the floor, which
      PX-=e.deltaX; PY-=e.deltaY; applyView(); // grows past the viewport at 12+ teams
      return;
    }
    const r=host.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const nz=Math.min(2.5,Math.max(0.5,Z*(e.deltaY<0?1.12:1/1.12)));
    PX=mx-(mx-PX)*(nz/Z); PY=my-(my-PY)*(nz/Z); Z=nz; applyView();
  },{passive:false});
  let down=null;
  host.addEventListener("pointerdown",e=>{
    if(e.target.closest("a,button")) return;  // a captured pointer would swallow the click
    down={x:e.clientX-PX,y:e.clientY-PY};
    host.classList.add("drag");host.setPointerCapture(e.pointerId);});
  host.addEventListener("pointermove",e=>{if(!down)return;
    PX=e.clientX-down.x;PY=e.clientY-down.y;applyView();});
  host.addEventListener("pointerup",()=>{down=null;host.classList.remove("drag");});
})();

function renderOffice(){
  const host=document.getElementById("office");
  if(host.hidden) return;                      // the hall is the working view
  // The conductor occupies a cell like any team, so it has to be counted when the floor
  // is sized - otherwise it is placed in a column the building has no room for and hangs
  // off the right edge. The 566x418 of section 10.5 is the floor's *minimum*: three
  // columns of 158 starting at x=18 need more than that once the border is counted.
  const ps=shown(), cells=ps.length+1, rows=Math.max(2,Math.ceil(cells/3));
  const shell=rows+"|"+ps.map(p=>p.slug).join(",");
  let floor=host.querySelector(".floor");
  if(!floor||host.dataset.shell!==shell){
    host.dataset.shell=shell;
    const h=BUILDING_H+Math.max(0,rows-2)*POD_DY;
    const w=Math.max(BUILDING_W, POD_XS[Math.min(2,cells-1)]+158+26);
    host.innerHTML=`<div class="fbar">
        <span class="fbar-l">Floor</span>
        <button class="ghost" data-z="out">&minus;</button>
        <span id="zoom-pct">100%</span>
        <button class="ghost" data-z="in">+</button>
        <button class="ghost" data-z="fit">Fit</button>
        <span class="fbar-hint">ctrl + scroll to zoom &middot; drag to pan</span>
      </div>
      <div class="floor" style="width:${w}px;height:${h}px">
      ${ps.map(podHTML).join("")}${orchHTML(ps)}
      <div class="plant" style="left:184px;top:${h-56}px"><i></i><b></b></div>
      <div class="plant" style="left:${w-40}px;top:${h-56}px"><i></i><b></b></div></div>`;
    floor=host.querySelector(".floor");
    ps.forEach(p=>POD_SIG[p.slug]=podSig(p));
    host.querySelector(".fbar").addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.z==="fit") fitView(); else setZoom(Z*(b.dataset.z==="in"?1.15:1/1.15));
    });
    applyView(); showZoom(); startWalkers(floor,rows);
  }else{
    // Patch only the pod that changed, or the whole floor's loops restart - including
    // the walkers, who would teleport back to where they started.
    const pods=[...floor.querySelectorAll(".pod")];
    ps.forEach((p,i)=>{
      if(POD_SIG[p.slug]===podSig(p)) return;
      POD_SIG[p.slug]=podSig(p);
      const old=pods.find(el=>el.dataset.slug===p.slug); if(!old) return;
      const t=document.createElement("template"); t.innerHTML=podHTML(p,i);
      old.replaceWith(t.content.firstElementChild);
    });
  }
  observePods(floor);
}

function render(h){
  HALL=h||HALL;
  for(const p of HALL.pipelines) if(p.slug in PENDING) p.hidden=PENDING[p.slug];
  renderHeadTable();renderHall();renderOffice();
}

/* The tab is in the URL, so a link to ?show=done opens on Done and a reload keeps it. */
function setShow(s){
  if(!SHOWS.includes(s)||s===SHOW) return;
  SHOW=s;
  try{
    const u=new URL(location.href);
    if(SHOW==="active") u.searchParams.delete("show"); else u.searchParams.set("show",SHOW);
    history.replaceState(null,"",u);
  }catch(e){}
  render();
}
document.getElementById("show-seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(b) setShow(b.dataset.show);
});

/* ---- view + theme ----
   One function owns which view is showing, and it is exhaustive: every view is set on
   every call, so no path can leave two of them visible at once. The segmented control
   and the initial paint both go through it rather than each setting flags themselves. */
const VIEWS=["hall","office"];
let VIEW="hall";
function setView(v){
  VIEW=VIEWS.includes(v)?v:"hall";
  for(const k of VIEWS) document.getElementById(k).hidden=k!==VIEW;
  document.querySelectorAll("#view-seg button")
    .forEach(b=>b.classList.toggle("sel",b.dataset.view===VIEW));
  if(VIEW==="office") renderOffice();   // it skips itself while hidden
}
document.getElementById("view-seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  setView(b.dataset.view);
});
setView("hall");
paintTabs();
/* An explicit choice wins in both directions, and it has to survive a reload: the toggle
   was resetting to the OS preference on every navigation, so choosing a theme lasted
   exactly as long as the page did. Storage can throw or come back empty (a private
   window, cleared site data), and the page must render correctly either way. */
try{
  const saved=localStorage.getItem("ao-theme");
  if(saved==="dark"||saved==="light") document.documentElement.dataset.theme=saved;
}catch(e){}
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
  try{ localStorage.setItem("ao-theme",r.dataset.theme); }catch(e){}
};
document.getElementById("reg-add").addEventListener("submit",e=>{
  e.preventDefault();
  const i=document.getElementById("reg-input"),v=i.value.trim();
  if(!v) return;
  EXTRA_REPOS.push(v); NEW_REPO=v; i.value=""; renderHeadTable();
});

/* One fixture per card state, for reviewing the design with no server behind it.
   It is deliberately NOT a fallback: a hall that invents four pipelines when the bus is
   unreachable is worse than one that says it cannot reach the bus. Opt in with ?demo=1. */
const ago=s=>new Date(Date.now()-s*1000).toISOString();
const FIXTURE={root:"~/.agent-orchestration/pipelines",pipelines:[
  {slug:"multi-pipeline-engine",feature:"Multi-pipeline engine",phase:"implement",
   status:"running",activeAgent:"coder",loop:{count:1,max:5},repos:["ship-team"],
   updatedAt:ago(20),lastEvent:{ts:ago(20),agent:"coder",type:"status",summary:"Wiring the felt"}},
  {slug:"009-messaging-hub",feature:"Messaging hub",phase:"plan",status:"awaiting_approval",
   activeAgent:"planner",loop:{count:0,max:5},repos:["crm","api"],updatedAt:ago(90),
   lastEvent:{ts:ago(90),agent:"planner",type:"handoff",summary:"Plan ready: 7 tasks, 2 services"}},
  {slug:"tenant-sso-logout",feature:"Propagate tenant SSO logout",phase:"test",status:"running",
   activeAgent:"tester",loop:{count:2,max:5},repos:["oauth","MFA_Server"],updatedAt:ago(1500),
   services:{oauth:{passed:6,failed:1},MFA_Server:{passed:4,failed:0}},
   lastEvent:{ts:ago(1500),agent:"tester",type:"result",summary:"Tests 10/11 — 1 failing (iter 2)"}},
  {slug:"ipo-mandate-automation",feature:"IPO mandate automation",phase:"done",status:"done",
   activeAgent:"reviewer",loop:{count:1,max:5},repos:["crm"],updatedAt:ago(6000),
   lastEvent:{ts:ago(6000),agent:"orchestrator",type:"status",summary:"Merged and archived"}},
  {slug:"legacy-importer",feature:"Legacy CSV importer",phase:"implement",status:"running",
   activeAgent:"coder",loop:{count:0,max:5},repos:["api"],updatedAt:ago(900000),hidden:true,
   lastEvent:{ts:ago(900000),agent:"coder",type:"status",summary:"Parsing the header row"}},
]};

/* ---- live data ---------------------------------------------------------------------
   /events with no run= streams hall() itself - byte-identical in shape to what
   /api/hall returns - so the stream IS the feed, and the opening fetch only buys a
   faster first paint than waiting for the first SSE frame. */
function conn(txt,live){
  document.getElementById("conn").classList.toggle("live",!!live);
  document.getElementById("conn-txt").textContent=txt;
}
function fail(msg){
  conn(msg,false);
  // Only claim the view if there is nothing real in it - a dropped connection must not
  // wipe the hall you were already reading.
  const el=document.getElementById("hall");
  if(!el.querySelector(".card")) el.innerHTML=`<div class="empty">${esc(msg)}</div>`;
}
async function pull(){
  const r=await fetch("/api/hall",{cache:"no-store"});
  if(!r.ok) throw new Error("/api/hall returned "+r.status);
  render(await r.json());
}
function listen(){
  const es=new EventSource("/events");
  es.onopen=()=>conn("live",true);
  es.onmessage=e=>{try{render(JSON.parse(e.data));conn("live",true);}catch(err){}};
  // EventSource reconnects by itself; say so rather than leaving a stale hall labelled live.
  es.onerror=()=>conn("reconnecting…",false);
}

if(new URLSearchParams(location.search).has("demo")){
  DEMO=true;
  conn("demo — not live",false);
  render(FIXTURE);
}else{
  conn("connecting…",false);
  pull().then(listen).catch(e=>{fail("cannot reach the dashboard server — "+e.message);listen();});
}
