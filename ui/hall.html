    N=pickCols(ps.length,cells,host.clientWidth,host.clientHeight,fr.top,fr.bot),
    {rows,w,h}=floorDims(N,cells);
  const shell=N+"|"+rows+"|"+ps.map(p=>p.slug).join(",");
  let floor=host.querySelector(".floor");
  if(!floor||host.dataset.shell!==shell){
    host.dataset.shell=shell;
    host.innerHTML=`<div class="key">
        <span><b>Typing, screen scrolling:</b> holds the work now</span>
        <span><b>Hand up, amber rug:</b> waiting on you</span>
        <span><b>Shaking, red rug:</b> blocked</span>
        <span><b>Asleep on green:</b> ready to deploy</span>
      </div>
      <span class="hint">Drag to move &middot; scroll to pan &middot; ctrl + scroll to zoom</span>
      <div class="hud"><button class="ghost" data-z="out" aria-label="Zoom out">&minus;</button>
        <span id="zoom-pct">100%</span>
        <button class="ghost" data-z="in" aria-label="Zoom in">+</button>
        <button class="ghost" data-z="fit">Fit</button>
        <button class="ghost" data-z="100">100%</button></div>
      <div class="floor" style="width:${w}px;height:${h}px">
      ${ps.map((p,i)=>podHTML(p,i,N)).join("")}${orchHTML(ps,N)}
      <div class="plant" style="left:184px;top:${h-56}px"><i></i><b></b></div>
      <div class="plant" style="left:${w-40}px;top:${h-56}px"><i></i><b></b></div></div>`;
    floor=host.querySelector(".floor");
    // The key only exists now: if it moves the best column count, lay out once more, here,
    // so the first open lands on its final N instead of re-laying itself on the next update.
    const fr2=fitFrame(host);
    if(pickCols(ps.length,cells,host.clientWidth,host.clientHeight,fr2.top,fr2.bot)!==N){ renderOffice(); return; }
    ps.forEach(p=>POD_SIG[p.slug]=podSig(p));
    host.querySelector(".hud").addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.z==="fit") fitView(); else if(b.dataset.z==="100") setZoom(1); else setZoom(Z*(b.dataset.z==="in"?1.15:1/1.15));
    });
    fitView(); startWalkers(floor,floorGraph(N,rows));
  }else{
    // Patch only the pod that changed, or the whole floor's loops restart - including
    // the walkers, who would teleport back to where they started.
    const pods=[...floor.querySelectorAll(".pod")];
    ps.forEach((p,i)=>{
      if(POD_SIG[p.slug]===podSig(p)) return;
      POD_SIG[p.slug]=podSig(p);
      const old=pods.find(el=>el.dataset.slug===p.slug); if(!old) return;
      const t=document.createElement("template"); t.innerHTML=podHTML(p,i,N);
      old.replaceWith(t.content.firstElementChild);
    });
  }
  observePods(floor);
}

function render(h){
  HALL=h||HALL;
  for(const p of HALL.pipelines) if(p.slug in PENDING) p.hidden=PENDING[p.slug];
  trackSeen();
  renderHeadTable();renderHall();renderOffice();
  attention();
}
/* Staleness is a clock, not an event: with nothing writing to the bus the stream sends
   nothing, so without this a run that died stayed "run" until some other team spoke. */
setInterval(()=>{if(HALL.pipelines.length) render();},30000);

/* ---- when you are needed ----
   The tab title counts the teams waiting on you - at a gate, or gone quiet - whatever the
   bell says. A notification fires only for a change you are not looking at, and only once
   you turned alerts on from the bell: the page never raises the permission prompt itself. */
const BASE_TITLE=document.title;
const NEEDS={gate:"Waiting for your approval",block:"Blocked - it needs you",stale:"Gone quiet - its agent may have died",done:"Finished"};
const canAlert=()=>"Notification" in window;
let ALERTS=(()=>{try{return localStorage.getItem("ao-alerts");}catch(e){return null;}})();
const alertsOn=()=>canAlert()&&Notification.permission==="granted"&&ALERTS==="on";
let WAS=null;          // each team's card state in the previous frame
let LIMIT_WAS=null;    // the pause's state in the previous frame
function paintLimit(){
  const el=document.getElementById("limit"), l=HALL.limit;
  el.hidden=!l; if(!l) return;
  const at=new Date(l.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  el.innerHTML=l.state==="needs-you"
    ?`<b>Usage limit</b><span>The limit has reset, but Claude Code is waiting for you: press Enter in its terminal to continue.</span>`
    :`<b>Usage limit</b><span>Every run paused at ${esc(at)}. Claude Code continues them when the limit resets; there is nothing to do.</span>`;
}
function attention(){
  paintLimit();
  const live=HALL.pipelines.filter(p=>!p.hidden);
  // While a limit holds every team, a quiet one is waiting on the reset, not on you.
  const need=live.filter(p=>cardState(p)==="gate"||(["stale","block"].includes(cardState(p))&&!HALL.limit)).length
    +(HALL.limit&&HALL.limit.state==="needs-you"?1:0);
  document.title=need?`(${need}) need you · ${BASE_TITLE}`:BASE_TITLE;
  const now={}; for(const p of HALL.pipelines) now[p.slug]=cardState(p);
  if(WAS&&alertsOn()&&!DEMO&&!looking()) for(const p of live){
    const s=now[p.slug], was=WAS[p.slug];
    if(s===was||!NEEDS[s]||(was===undefined&&s==="done")||((s==="stale"||s==="block")&&HALL.limit)) continue;
    // set-status lands before the orchestrator's question, so at a gate the newest event
    // is often the previous phase's news - quote it only when it is the question itself.
    const ev=p.lastEvent, say=ev&&ev.summary&&(s!=="gate"||ev.type==="question");
    const n=new Notification(p.feature||p.slug,{
      body:NEEDS[s]+(say?" · "+ev.summary.slice(0,140):""),tag:"ao-"+p.slug});
    n.onclick=()=>{window.focus();location.href="/r/"+encodeURIComponent(p.slug);n.close();};
  }
  const ls=HALL.limit&&HALL.limit.state;
  if(ls==="needs-you"&&LIMIT_WAS!=="needs-you"&&LIMIT_WAS!==null&&alertsOn()&&!DEMO&&!looking())
    new Notification("Usage limit has reset",{body:"Claude Code is waiting for you - press Enter in its terminal to continue the run.",tag:"ao-limit"});
  LIMIT_WAS=ls||"";
  WAS=now;
}
// Lucide's bell and bell-off (ISC).
const ICON_BELL=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>`;
const ICON_BELL_OFF=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742"/><path d="m2 2 20 20"/><path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05"/></svg>`;
function paintBell(){
  const b=document.getElementById("alerts");
  if(!canAlert()){b.hidden=true;return;}
  const blocked=Notification.permission==="denied", on=alertsOn();
  b.setAttribute("aria-pressed",String(on));
  b.innerHTML=(on?ICON_BELL:ICON_BELL_OFF)
    +`<span>${blocked?"Alerts blocked":on?"Alerts on":"Alerts off"}</span>`;
  b.title=blocked?"This browser blocks notifications from this page - allow them in its site settings"
    :on?"Turn off notifications":"Notify me when a team waits for approval, goes quiet, or finishes";
}
document.getElementById("alerts").onclick=async()=>{
  if(!canAlert()) return;
  if(Notification.permission==="default")
    ALERTS=(await Notification.requestPermission())==="granted"?"on":"off";
  else if(Notification.permission==="granted") ALERTS=ALERTS==="on"?"off":"on";
  try{localStorage.setItem("ao-alerts",ALERTS);}catch(e){}
  paintBell();
};
paintBell();

/* The tab is in the URL, so a link to ?show=done opens on Done and a reload keeps it. */
function setShow(s){
  if(!SHOWS.includes(s)||s===SHOW) return;
  SHOW=s;
  try{
    const u=new URL(location.href);
    if(SHOW==="active") u.searchParams.delete("show"); else u.searchParams.set("show",SHOW);
    history.replaceState(null,"",u);
  }catch(e){}
  render();
}
document.getElementById("show-seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(b) setShow(b.dataset.show);
});

/* ---- view + theme ----
   One function owns which view is showing, and it is exhaustive: every view is set on
   every call, so no path can leave two of them visible at once. The segmented control
   and the initial paint both go through it rather than each setting flags themselves. */
const VIEWS=["hall","office"];
let VIEW="hall";
function setView(v){
  VIEW=VIEWS.includes(v)?v:"hall";
  for(const k of VIEWS) document.getElementById(k).hidden=k!==VIEW;
  document.querySelectorAll("#view-seg button")
    .forEach(b=>b.classList.toggle("sel",b.dataset.view===VIEW));
  if(VIEW==="office"){ renderOffice(); fitView(); }   // it skips itself while hidden
}
document.getElementById("view-seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  setView(b.dataset.view);
});
setView("hall");
paintTabs();
/* An explicit choice wins in both directions, and it has to survive a reload: the toggle
   was resetting to the OS preference on every navigation, so choosing a theme lasted
   exactly as long as the page did. Storage can throw or come back empty (a private
   window, cleared site data), and the page must render correctly either way. */
try{
  const saved=localStorage.getItem("ao-theme");
  if(saved==="dark"||saved==="light") document.documentElement.dataset.theme=saved;
}catch(e){}
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
  try{ localStorage.setItem("ao-theme",r.dataset.theme); }catch(e){}
};

  EXTRA_REPOS.push(v); NEW_REPO=v; i.value=""; renderHeadTable();
});

/* ---- live data ---------------------------------------------------------------------
   /events with no run= streams hall() itself - byte-identical in shape to what
   /api/hall returns - so the stream IS the feed, and the opening fetch only buys a
   faster first paint than waiting for the first SSE frame. */
function conn(txt,live){
  document.getElementById("conn").classList.toggle("live",!!live);
  document.getElementById("conn-txt").textContent=txt;
}
function fail(msg){
  conn(msg,false);
  // Only claim the view if there is nothing real in it - a dropped connection must not
  // wipe the hall you were already reading.
  const el=document.getElementById("hall");
  if(!el.querySelector(".card")) el.innerHTML=`<div class="empty">${esc(msg)}</div>`;
}
async function pull(){
  const r=await fetch("/api/hall",{cache:"no-store"});
  if(!r.ok) throw new Error("/api/hall returned "+r.status);
  render(await r.json());
}
function listen(){
  const es=new EventSource("/events");
  es.onopen=()=>conn("live",true);
  es.onmessage=e=>{try{render(JSON.parse(e.data));conn("live",true);}catch(err){}};
  // EventSource reconnects by itself; say so rather than leaving a stale hall labelled live.
  es.onerror=()=>conn("reconnecting…",false);
}

if(new URLSearchParams(location.search).has("demo")){
  DEMO=true;
  conn("demo — not live",false);
  render(FIXTURE);
}else{
  conn("connecting…",false);
  pull().then(listen).catch(e=>{fail("cannot reach the dashboard server — "+e.message);listen();});
}
