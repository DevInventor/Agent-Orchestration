<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent-Orchestration · the hall</title>
<style>
  /* ---- section 10.1 tokens ---------------------------------------------------------
     Two themes, resolved three ways: bare :root is light, system dark is guarded by
     :root:not([data-theme="light"]) so an explicit light toggle wins over the OS, and
     :root[data-theme="dark"] wins in both directions. The dark block is written twice
     on purpose - CSS cannot share one declaration list between a media query and a
     plain selector, and a variable-of-variables costs more than the duplication.
     The palette is cool slate and there is no brown anywhere: the first floor read as a
     school hall, the instinct was to blame the cast, and it was the room. */
  :root{
    --ink:#F5F6F9; --panel:#FFFFFF; --sunk:#ECEEF3; --raise:#FFFFFF;
    --line:#DCE0E7; --line-2:#C2C9D4;
    --text:#3A424F; --bright:#0E131B; --muted:#6B7585; --faint:#98A1AF;
    --planner:#9A6B10; --coder:#1A6CA8; --tester:#A33468; --reviewer:#1B7A52; --orch:#6B4FA8;
    --ok:#1B7A52; --warn:#9A6B10; --bad:#B03A34;
    --felt:#E7EAF0;   /* section 10.1 token, kept; the card no longer draws a felt */
      /* floor tokens - the office view only */
    --floor:#DFE4EA; --floor-2:#D3D9E1; --grout:rgba(255,255,255,.7);
    --wall:#FBFBFC; --wall-edge:#C8CFD8; --wall-shadow:rgba(28,38,52,.14);
    --wood:#B9C1CC; --wood-2:#98A3B2; --deskglass:#EEF1F5;
    --table:#C9B8A0; --table-2:#A8957B;
    --chairc:#7F8B9B; --chairc-2:#68748453;
    --skin:#D8A57C; --legs:#3C4A63; --shoe:#2B3344;
    --eye:#28313F; --pupil:#11161F;
    --screen:#2F9E73; --screen-b:#E4E8EE; --pot:#9BA5B2; --leaf:#7E97A8;
    /* Fira where it is installed, real system fallbacks everywhere else. No <link>: the
       server is dependency-free and serves localhost, so type must not need a network. */
    --mono:"Fira Code",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#090C12; --panel:#11151D; --sunk:#0D1118; --raise:#171D28;
      --line:#1D2531; --line-2:#2C3644;
      --text:#C7CEDA; --bright:#EDF1F6; --muted:#7A8496; --faint:#4A5464;
      --planner:#F2C14E; --coder:#4FA6E0; --tester:#E06C9F; --reviewer:#5FCF9B; --orch:#A98BEA;
      --ok:#5FCF9B; --warn:#F2C14E; --bad:#E0655F;
      --felt:#121822;
      --floor:#161C26; --floor-2:#131922; --grout:rgba(255,255,255,.045);
      --wall:#232C3A; --wall-edge:#0E131B; --wall-shadow:rgba(0,0,0,.6);
      --wood:#39465A; --wood-2:#2A3446; --deskglass:#2E394A;
      --table:#4A3F35; --table-2:#332B24;
      --chairc:#3A4658; --chairc-2:#2C3644;
      --skin:#C08E64; --legs:#2C3548; --shoe:#1B2130;
      --eye:#070A0F; --pupil:#05080D;
      --screen:#3FBE8B; --screen-b:#1E2733; --pot:#39465A; --leaf:#46606F;
    }
  }
  :root[data-theme="dark"]{
    --ink:#090C12; --panel:#11151D; --sunk:#0D1118; --raise:#171D28;
    --line:#1D2531; --line-2:#2C3644;
    --text:#C7CEDA; --bright:#EDF1F6; --muted:#7A8496; --faint:#4A5464;
    --planner:#F2C14E; --coder:#4FA6E0; --tester:#E06C9F; --reviewer:#5FCF9B; --orch:#A98BEA;
    --ok:#5FCF9B; --warn:#F2C14E; --bad:#E0655F;
    --felt:#121822;
    --floor:#161C26; --floor-2:#131922; --grout:rgba(255,255,255,.045);
    --wall:#232C3A; --wall-edge:#0E131B; --wall-shadow:rgba(0,0,0,.6);
    --wood:#39465A; --wood-2:#2A3446; --deskglass:#2E394A;
      --table:#4A3F35; --table-2:#332B24;
    --chairc:#3A4658; --chairc-2:#2C3644;
    --skin:#C08E64; --legs:#2C3548; --shoe:#1B2130;
    --eye:#070A0F; --pupil:#05080D;
    --screen:#3FBE8B; --screen-b:#1E2733; --pot:#39465A; --leaf:#46606F;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;
    line-height:1.5;display:flex;flex-direction:column;height:100vh;-webkit-font-smoothing:antialiased}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  /* ---- top bar ---- */
  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--bright)}
  .brand b{color:var(--coder)} .brand span{color:var(--faint)}
  .seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);font-family:var(--mono);
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 14px;cursor:pointer}
  .seg button.sel{background:var(--sunk);color:var(--bright)}
  .spacer{margin-left:auto}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--muted);
    font-family:var(--mono);font-size:11px;padding:4px 10px;cursor:pointer}
  .ghost:hover{border-color:var(--line-2);color:var(--text)}
  a.ghost{text-decoration:none}
  /* The bell says its state in words - on, off, blocked - so it never rides on colour. */
  .bell{display:inline-flex;align-items:center;gap:6px}
  .bell svg{width:13px;height:13px;flex:0 0 auto}
  .bell[aria-pressed="true"]{color:var(--coder);border-color:color-mix(in srgb,var(--coder) 40%,var(--line))}
  /* The cast, named once, so a colour in a card never has to be decoded. */
  .legend{display:flex;align-items:center;gap:13px;margin-left:8px}
  .legend span{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .legend .who{width:15px;height:auto}
  .legend .l-planner{color:var(--planner)} .legend .l-coder{color:var(--coder)}
  .legend .l-tester{color:var(--tester)} .legend .l-reviewer{color:var(--reviewer)}
  /* Which teams the hall and the office show. One control for both views, so hidden means
     hidden everywhere; the counts ride in the tabs, so finished work is out of the way
     without being out of sight. */
  .seg button .n{margin-left:7px;font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--muted)}
  .seg button.sel .n{color:var(--text)}
  .seg button:hover:not(.sel){color:var(--text)}
  @media (max-width:900px){ .legend{display:none} }
  .conn{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .conn .led{width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .conn.live .led{background:var(--ok)}

  /* ---- layout: head table left, the hall (or the office) right ---- */
  /* A usage limit pauses every team at once, so it is said once, above all of them. */
  .limit{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:13px;
    color:var(--text);border-bottom:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));
    background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
  .limit b{color:var(--warn);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .limit[hidden]{display:none}
  .c-stale.paused{color:var(--warn)}
  main{flex:1 1 auto;display:grid;grid-template-columns:288px 1fr;gap:1px;background:var(--line);min-height:0}
  /* The sidebar scrolls on its own: a registry with a dozen services must not push the
     Index button off the page, and must not scroll the hall with it. */
  .head-table{background:var(--panel);overflow-y:auto;overscroll-behavior:contain;
    padding:16px 16px 22px;display:flex;flex-direction:column;gap:18px;
    min-height:0;height:100%;grid-column:1;grid-row:1}
  .head-table>*{flex:0 0 auto}
  /* Both views are placed in the SAME cell on purpose. main is a two-column grid with
     three children, so an auto-placed third child wraps to row 2 column 1 - the bottom
     left corner - the instant hall and office are visible together. Stacking them here
     makes that state unrepresentable instead of merely unlikely. */
  .view{background:var(--ink);overflow:auto;min-height:0;padding:18px 20px 24px;
    grid-column:2;grid-row:1}
  /* !important because #hall sets display:grid, and an id outranks [hidden]: the hall
     stayed laid out under the office, its sprite loops running and its rail dots showing
     through the floor. */
  .view[hidden]{display:none!important}

  /* head table: the orchestrator, exactly three counts, and the repo registry. Anything
     more here competes with the hall it is supposed to summarise. */
  .orch-card{border:1px solid var(--line);border-radius:5px;background:var(--sunk);padding:12px}
  .orch-top{display:flex;align-items:center;gap:10px}
  .orch-card{position:relative;overflow:hidden}
  .orch-card::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--orch)}
  .orch-mark{flex:0 0 auto;display:flex;color:var(--orch)}
  .orch-mark .who{width:22px;height:auto}
  .orch-id{display:flex;flex-direction:column;gap:1px;min-width:0}
  .orch-id b{font-size:13px;color:var(--bright);font-weight:600}
  .orch-name{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--orch)}
  .reg-total{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .reg-link{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:10.5px;
    color:var(--coder);text-decoration:none}
  .reg-link:hover{text-decoration:underline}
  .pri{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:3px;cursor:pointer;
    border:1px solid color-mix(in srgb,var(--orch) 55%,var(--line));
    background:color-mix(in srgb,var(--orch) 14%,transparent);color:var(--orch)}
  .pri:hover{background:color-mix(in srgb,var(--orch) 24%,transparent)}
  /* the dot carries index state, so the row reads left to right: state, name, count */
  .repo .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
  .repo.fresh .dot{background:var(--ok)} .repo.drift .dot{background:var(--warn)}
  .orch-doing{margin-top:8px;color:var(--text);font-size:13px}
  .counts{display:flex;gap:8px}
  .count{flex:1;border:1px solid var(--line);border-radius:4px;padding:7px 8px;background:var(--sunk)}
  .count b{display:block;font-family:var(--mono);font-size:17px;color:var(--bright);line-height:1.2}
  .count span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .count.awaiting b{color:var(--warn)} .count.quiet b{color:var(--bad)}

  .reg-head{display:flex;align-items:baseline;gap:8px}
  .reg-head a{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--coder);text-decoration:none}
  .reg-head a:hover{text-decoration:underline}
  .reg{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .repo{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;
    padding:6px 9px;background:var(--sunk)}
  .repo-name{font-family:var(--mono);font-size:11px;color:var(--text);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .repo-nodes{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
  .ix{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:2px;padding:0 5px;color:var(--muted)}
  .ix.fresh{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
  .ix.drift{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .reg-add{display:flex;gap:6px;margin-top:8px}
  .reg-add input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:3px;
    color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 8px}
  .reg-add input::placeholder{color:var(--muted)}
  .reg-note{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:7px;line-height:1.5}

  footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:8px 20px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  footer b{color:var(--text);font-weight:600}
  /* ---- section 10.3, the cast ----
     A shared body under a hair layer: the shirt keeps the role colour through
     currentColor while the hair gives each agent a face, so a team reads two ways at
     once. Skin, legs, shoes and pupils are theme tokens; hair colours are not - they are
     the same in both themes, because they are what tells the four of them apart. */
  .who{display:block;overflow:visible}
  .who.a-planner{color:var(--planner)} .who.a-coder{color:var(--coder)}
  .who.a-tester{color:var(--tester)} .who.a-reviewer{color:var(--reviewer)}
  .who.a-orch{color:var(--orch)}
  .who .torso,.who .arm{fill:currentColor}
  .who .head{fill:var(--skin)} .who .eye{fill:var(--pupil)}
  .who .zz{font-family:var(--mono);font-size:7px;fill:var(--muted);opacity:0}
  /* Hair is the same in both themes: it is what tells the five of them apart. */
  .who .h-planner{fill:#CFCBC2} .who .h-coder{fill:#5B4636} .who .h-tester{fill:#8A4B2F}
  .who .h-reviewer{fill:#3A2E22} .who .h-orch{fill:#4A4258}

  /* ---- section 10.2, the hall: one card per workstream, and the card is a table ---- */
  #hall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:start;
    align-items:start}   /* a gate card grows by its plan; its row-mates keep their own height */
  .card{--st:var(--line-2);background:var(--panel);border:1px solid color-mix(in srgb,var(--st) 45%,var(--line));
    border-radius:8px;padding:12px 13px;display:flex;flex-direction:column;gap:10px;min-width:0;
    box-shadow:0 1px 2px rgba(9,12,18,.06),0 6px 16px -10px rgba(9,12,18,.18)}
  .card.s-run{--st:var(--coder)} .card.s-gate{--st:var(--warn)}
  .card.s-done{--st:var(--ok)} .card.s-stale,.card.s-block{--st:var(--bad)}
  .card.s-closed{--st:var(--line-2)}      /* completed: the human has closed it */
  @media (max-width:1340px){ #hall{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:1010px){ #hall{grid-template-columns:minmax(0,1fr)} }

  /* ---- the estimate (ADR-0006): three figures and one to-scale rail ----
     pipe.py works the numbers out on every bus write; this only adds the minutes since. */
  .c-etc{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
  .c-etc>div{min-width:0}
  .c-etc .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .c-etc .v{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--bright);font-variant-numeric:tabular-nums;line-height:1.2}
  .c-etc .v.sm{font-size:14px;padding-top:4px}
  .c-etc .s{font-family:var(--mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .c-etc .hold{color:var(--warn)}
  .card.s-block .c-etc .hold{color:var(--bad)}
  .c-rail{display:flex;flex-direction:column;gap:4px;padding-top:9px}
  .c-rail .bar{position:relative;display:flex;gap:2px;height:12px}
  .c-rail .sg{position:relative;background:var(--sunk);border-radius:2px;overflow:hidden;min-width:0}
  .c-rail .sg i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:2px}
  .c-rail .slack{border-radius:2px;border:1px dashed var(--line-2);min-width:0;
    background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--line-2) 55%,transparent) 4px 5px)}
  .c-rail .needle{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--bright);border-radius:1px}
  .c-rail .needle::before{content:"now";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bright)}
  .c-rail .lab{display:flex;gap:2px;font-family:var(--mono);font-size:7.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  .c-rail .lab span{min-width:0;overflow:hidden;white-space:nowrap}
  .c-rail .lab .cur{color:var(--bright)}
  .c-over{font-family:var(--mono);font-size:10px;color:var(--bad)}
  .c-sub{font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--muted)}
  .c-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12px;counter-reset:st}
  .c-steps li{display:flex;gap:8px;counter-increment:st;min-width:0;overflow-wrap:anywhere}
  .c-steps li::before{content:counter(st);flex:0 0 17px;height:17px;border-radius:50%;border:1px solid var(--line-2);
    font-family:var(--mono);font-size:9px;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .final{background:var(--ok);border:1px solid var(--ok);border-radius:3px;color:var(--panel);
    font-family:var(--mono);font-size:11px;font-weight:600;padding:8px 0;cursor:pointer}
  .final:hover{background:color-mix(in srgb,var(--ok) 86%,var(--bright))}
  .final[disabled]{opacity:.5;cursor:default}
  /* a hidden team leaves before the grid closes over the gap it left */
  .card{transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .card.leaving{opacity:0;transform:translateY(-4px)}
  .c-head{display:flex;align-items:center;gap:8px;min-width:0}
  /* Quiet until it is wanted, but never hover-only: a control you cannot see is one you
     cannot find on a touch screen. */
  .c-hide{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:26px;min-width:26px;
    justify-content:center;margin:-5px -5px -5px 0;padding:0 5px;border:1px solid transparent;border-radius:4px;
    background:transparent;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer}
  .c-hide svg{width:15px;height:15px;flex:0 0 auto}
  .c-hide:hover{color:var(--bright);border-color:var(--line-2);background:var(--sunk)}
  .c-hide.txt{color:var(--coder);border-color:color-mix(in srgb,var(--coder) 35%,var(--line));padding:0 9px 0 7px}
  .c-hide[disabled]{opacity:.45;cursor:default}
  .c-name{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--bright);text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .c-name:hover{text-decoration:underline}
  .pill{margin-left:auto;flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--st);background:color-mix(in srgb,var(--st) 11%,transparent);
    border:1px solid color-mix(in srgb,var(--st) 45%,var(--line));border-radius:20px;padding:3px 9px;
    display:inline-flex;align-items:center;gap:6px}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .card.s-closed .pill{color:var(--muted)}

  /* the team: four seats in a row, the one holding the work in bright ink, repos to the right */
  .c-team{display:flex;align-items:flex-end;gap:9px;background:var(--sunk);border-radius:6px;padding:8px 10px 6px}
  .c-team .seat{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:8px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .c-team .seat.on{color:var(--bright)}
  .c-team .repos{margin-left:auto;align-self:center;text-align:right;font-family:var(--mono);font-size:10px;
    color:var(--muted);min-width:0;overflow-wrap:anywhere}

  .c-stale{font-family:var(--mono);font-size:10px;color:var(--bad)}
  /* Why the card is in the state it is in, and how long ago it was said - right under the
     name, because that is the question a card is opened to answer. */
  .c-last{display:flex;align-items:baseline;gap:7px;min-width:0;font-size:12px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:8px}
  .c-last b{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .c-last .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .c-last .age{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;color:var(--faint)}
  /* Something happened here while you were away; opening or clicking the card reads it. */
  .unread{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--coder)}
  /* The plan, beside the buttons that approve it. */
  .c-plan{display:flex;flex-direction:column;gap:6px}
  .c-plan-sum{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .c-plan-sum b{color:var(--bright);font-weight:600}
  .c-plan-sum .q,.c-plan-sum .q b{color:var(--warn)}
  .c-plan-why{margin:0;font-size:12px;line-height:1.5;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .c-plan summary{font-family:var(--mono);font-size:11px;color:var(--coder);cursor:pointer;width:max-content}
  .c-plan ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;
    max-height:190px;overflow:auto}
  .c-plan li{display:flex;gap:8px;font-size:12px;line-height:1.4;color:var(--text)}
  .c-plan li .id{flex:0 0 26px;font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:1px}
  .c-plan li.svc{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px}
  .gate{display:flex;gap:6px}
  .gate button{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:3px;color:var(--text);
    font-family:var(--mono);font-size:11px;padding:5px 0;cursor:pointer}
  .gate button[data-d="finalize"]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
  .gate button[data-d="reject"]{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
  .gate button:hover{background:var(--raise)}
  .gate button[disabled]{opacity:.5;cursor:default}

  /* section 10.8-4, revised: a finished team collapses to one line, and it lives on the
     Done tab rather than in the hall. Collapsing in place was not enough - nineteen of
     twenty-four real teams were finished, and their rows pushed the five live ones below
     the fold. The tab keeps the count of closures on screen; the rows go where you look
     for them. Hidden teams collapse the same way. */
  .card.collapsed{grid-column:1/-1;padding:7px 11px;cursor:pointer}
  .card.collapsed>*{display:none}
  .card.collapsed>.c-head{display:flex}

  /* nothing to show under this tab - say what is elsewhere and how work arrives here */
  .blank{grid-column:1/-1;max-width:440px;margin:64px auto 0;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .blank h2{margin:0;font-size:15px;font-weight:600;color:var(--bright);text-wrap:balance}
  .blank p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;text-wrap:pretty}
  .blank .cast{display:flex;gap:10px;margin-bottom:6px}
  .blank .ghost{margin-top:6px}

  /* one message at a time, bottom centre, above the footer; Undo is the reason it exists */
  .toast{position:fixed;left:50%;bottom:46px;z-index:20;display:flex;align-items:center;gap:14px;
    max-width:min(560px,calc(100vw - 32px));padding:8px 8px 8px 14px;border:1px solid var(--line-2);
    border-radius:6px;background:var(--raise);color:var(--text);font-size:13px;
    box-shadow:0 12px 32px -10px rgba(9,12,18,.45),0 2px 4px rgba(9,12,18,.12);
    opacity:0;transform:translate(-50%,8px);pointer-events:none;
    transition:opacity 180ms var(--ease-out),transform 220ms var(--ease-out)}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast.err{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
  .toast .msg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast .msg b{color:var(--bright);font-weight:600}
  .toast button{flex:0 0 auto;background:transparent;border:1px solid var(--line-2);border-radius:4px;
    color:var(--coder);font-family:var(--mono);font-size:11px;padding:4px 11px;cursor:pointer}
  .toast button:hover{background:var(--sunk);color:var(--bright)}

  /* ---- section 10.4, the motion inventory: eight entries, six rules ----------------
     Six of the eight are one agent's states plus the two that mark a change. If this
     list grows to twenty, that is the bug.
       1. stepped, never eased - a pixel character that tweens reads as a moving div
       2. exactly one agent per table types; the rest are at much lower --amp
       3. something always moves at rest - a still floor reads as a broken dashboard
       4. stillness is the alarm - a stale team freezes mid-keystroke and dims
       5. transform and opacity only: no layout, no paint, no transition:all
       6. prefers-reduced-motion stops every loop and leaves the resting pose */

  /* (the baton, entry 1, went with the felt: the team row has no table to pass work across) */
  /* 2 · typing — the one agent that holds the work — 340 ms steps(1), loops */
  @keyframes typing{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-1.5px * var(--amp,1)))}}
  .who.st-type{animation:typing 340ms steps(1) infinite}
  /* 3 · waiting — turn not yet come — 3.4 s steps(1), loops */
  @keyframes waiting{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-1px * var(--amp,1)))}}
  .who.st-wait{--amp:.5;animation:waiting 3.4s steps(1) infinite}
  /* 4 · asleep — agent finished — 3.6 s, opacity and transform */
  @keyframes sleeping{0%,100%{opacity:.62;transform:translateY(0)}50%{opacity:.48;transform:translateY(.8px)}}
  .who.st-sleep{animation:sleeping 3.6s steps(1) infinite}
  /* The drawn cast's own three: hands on the keys, a blink, a sleeper's z. They ride on
     entries 2-4 rather than replacing them, and stay transform and opacity only. */
  @keyframes tap{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
  .who.st-type .arm.l{animation:tap 320ms ease-in-out infinite alternate}
  .who.st-type .arm.r{animation:tap 320ms ease-in-out -160ms infinite alternate}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .who .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  .who.st-sleep .eye{animation:none;transform:scaleY(.15)}
  /* The cast's two asking-for-help poses (T3): a hand up while it waits on you, a shake
     when it is stuck. Transform only and stepped, so they stay inside the inventory's rules. */
  @keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-176deg)}}
  .who.st-ask{--amp:.5;animation:waiting 3.4s steps(1) infinite}
  .who.st-ask .arm.r{transform-box:fill-box;transform-origin:50% 12%;transform:rotate(-160deg);
    animation:wave 520ms steps(3) infinite alternate}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
  .who.st-stuck{animation:shake 240ms steps(1) infinite}
  .who.st-stuck .eye{animation:none}
  @keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(5px,-9px)}}
  .who.st-sleep .zz{animation:zz 2.8s ease-in-out infinite}
  /* 5 · walking in — the baton lands — 440 ms steps(4), once. On the seat, not the
     sprite, so the arriving agent keeps its own loop. */
  @keyframes walk-in{from{transform:translateX(-10px);opacity:.6}to{transform:translateX(0);opacity:1}}
  .seat.arrive{animation:walk-in 440ms steps(4) 1}
  /* 6 · table entrance — first paint only — 260 ms ease-out, never replays */
  @keyframes table-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .card.enter{animation:table-in 260ms var(--ease-out) 1}
  /* 7 · repo row in — you register a repo — 240 ms ease-out */
  @keyframes row-in{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:translateX(0)}}
  .repo.enter{animation:row-in 240ms var(--ease-out) 1}
  /* 8 · going quiet — stale > 3 min — freeze plus opacity — 2.6 s ease-in-out, loops */
  @keyframes going-quiet{0%,100%{opacity:1}50%{opacity:.5}}
  .card.s-stale .c-team{animation:going-quiet 2.6s var(--ease-in-out) infinite}
  .card.s-stale .who,.card.s-stale .who *{animation-play-state:paused}

  /* ---- section 10.5, the office floor ----
     One open floor; the building's outer wall is the only wall. A team is a desk island
     on a rug and the rug carries the state, so you read the rug before you find a single
     agent - which is what a floor plan has to earn for being slower to scan than a table. */
  #office{padding:0;position:relative;overflow:hidden;cursor:grab;touch-action:none}
  #office.drag{cursor:grabbing}
  .floor{position:absolute;left:0;top:0;transform-origin:0 0;border:4px solid var(--wall);
    box-shadow:0 0 0 1px var(--wall-edge),inset 0 0 44px var(--wall-shadow);
    background:
      repeating-linear-gradient(0deg,var(--grout) 0 1px,transparent 1px 34px),
      repeating-linear-gradient(90deg,var(--grout) 0 1px,transparent 1px 34px),
      linear-gradient(160deg,var(--floor),var(--floor-2))}
  .pod{position:absolute;width:156px;height:118px}
  .rug{position:absolute;inset:-8px -8px -52px;border-radius:12px;
    background:var(--floor-2);border:1px solid var(--line)}
  .pod.s-run .rug{background:color-mix(in srgb,var(--coder) 9%,var(--floor-2));
    border-color:color-mix(in srgb,var(--coder) 34%,var(--line))}
  .pod.s-gate .rug{background:color-mix(in srgb,var(--warn) 16%,var(--floor-2));
    border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
  .pod.s-stale .rug,.pod.s-block .rug{background:color-mix(in srgb,var(--bad) 16%,var(--floor-2));
    border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
  /* Finished reads as finished rather than as the default: without its own rule a done
     team was simply whatever a pod looks like with no state, which is the one thing the
     rug is supposed to say at a glance. */
  .pod.s-done .rug{background:color-mix(in srgb,var(--ok) 7%,var(--floor-2));
    border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
  .pod.s-closed{opacity:.55}
  .pod.vacant{opacity:.5} .pod.vacant .rug{inset:-8px -8px -22px;border-style:dashed}
  /* The name is a nameplate on the seam between the two desk rows. Above the pod it sat
     inside the previous row's rug, on top of that team's bottom pair. */
  .pod-name{position:absolute;left:6px;right:6px;top:150px;z-index:1;text-align:center;font-family:var(--mono);
    font-size:10.5px;line-height:14px;color:var(--text);text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a.pod-name:hover{color:var(--bright);text-decoration:underline;text-underline-offset:2px}
  .p-bar{position:absolute;left:34px;right:34px;top:166px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .p-bar i{display:block;height:100%;background:var(--st,var(--muted));border-radius:2px}
  /* one shared wood table, four laptops on it; the one holding the work scrolls */
  .table{position:absolute;left:8px;top:38px;width:140px;height:74px;border-radius:14px;background:var(--table);
    border:1.5px solid var(--table-2);box-shadow:0 4px 0 var(--table-2)}
  .lap{position:absolute;width:26px;height:16px;border-radius:3px;background:var(--screen-b);
    border:1px solid var(--wood-2);overflow:hidden;box-sizing:border-box}
  .lap i{display:block;height:2px;margin:2px 3px;background:var(--screen);opacity:.3;border-radius:1px}
  .lap.work i{opacity:1;--sc:-8px;animation:screen-scroll .9s steps(4) infinite}
  /* desks back to back down the middle, bodies on the outer edges: four fit in nearly
     the space of two, and no agent is ever in front of a screen */
  .desk{position:absolute;width:62px;height:30px;border-radius:3px;background:var(--wood);
    border:1px solid var(--wood-2);box-shadow:inset 0 5px 0 var(--deskglass)}
  .scr{position:absolute;right:5px;top:3px;width:20px;height:13px;border-radius:1px;
    background:var(--screen-b);border:1px solid var(--wood-2);overflow:hidden}
  .scr i{display:block;height:4px;margin:2px 2px 4px;background:var(--screen)}
  .chair{position:absolute;width:20px;height:7px;border-radius:3px;background:var(--chairc);
    border:1px solid var(--chairc-2)}
  .plant{position:absolute;width:14px;height:20px}
  .plant b{position:absolute;bottom:0;left:2px;width:10px;height:7px;background:var(--pot);border-radius:1px}
  .plant i{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50% 50% 40% 40%;background:var(--leaf)}
  .body{position:absolute}
  /* the working desk's screen scrolls: the cheapest "something is happening here" that
     moves no body at all (section 10.5, not a ninth inventory entry) */
  @keyframes screen-scroll{from{transform:translateY(0)}to{transform:translateY(var(--sc,-9px))}}
  .desk.work .scr i{animation:screen-scroll 1.2s steps(4) infinite}
  /* section 10.8-2: pods outside the viewport stop animating. At twelve teams that is
     ~24 simultaneous sprite loops, and the floor - not the hall - is where it bites. */
  /* grey, and no role colour: they are the one thing in the room that means nothing */
  .walker .who{color:var(--faint)}
  .walker.amble .who{color:var(--muted)}
  .pod.off *,.room.off *{animation-play-state:paused!important}
  .pod.s-stale .who,.pod.s-stale .who *{animation-play-state:paused}
  /* The one figure you need from across the room, over each island. */
  .pod-tag{position:absolute;left:50%;top:-31px;transform:translateX(-50%);z-index:2;white-space:nowrap;
    font-family:var(--mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
    color:var(--st,var(--muted));background:var(--panel);border-radius:20px;padding:4px 12px;
    border:1.5px solid color-mix(in srgb,var(--st,var(--line-2)) 55%,var(--line));
    box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pod-tag small{font-weight:400;color:var(--muted);font-size:10px}
  .pod.s-run{--st:var(--coder)} .pod.s-gate{--st:var(--warn)} .pod.s-stale,.pod.s-block{--st:var(--bad)}
  .pod.s-done{--st:var(--ok)} .pod.s-closed{--st:var(--line-2)}

  /* ---- the building around the desks ----
     The bullpen is open floor; the east wing is two walled rooms, each with its own tile:
     the orchestrator's office, where a team sits down over a finished plan, and a break
     room that means nothing and is there so the floor reads as a place people work in.
     Every colour is mixed from the section 10.1 tokens, so both themes come for free. */
  .floor{--wall-face:color-mix(in srgb,var(--wall) 68%,var(--wall-edge));
    --glass:color-mix(in srgb,var(--coder) 26%,var(--wall));
    --check:repeating-conic-gradient(color-mix(in srgb,var(--bright) 4%,transparent) 0 25%,transparent 0 50%) 0 0/34px 34px}
  .wall-n{position:absolute;left:-4px;right:-4px;top:-26px;height:22px;background:var(--wall-face);
    border:1px solid var(--wall-edge);border-bottom:0;border-radius:3px 3px 0 0}
  .win{position:absolute;top:4px;width:56px;height:13px;border-radius:2px;background:var(--glass);
    border:1px solid var(--wall-edge);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--wall) 30%,transparent)}
  .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--wall-edge)}
  .room{position:absolute;border-left:6px solid var(--wall);
    box-shadow:-1px 0 0 var(--wall-edge),inset 1px 0 0 var(--wall-edge)}
  .room::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:var(--wall-face);
    border-bottom:1px solid var(--wall-edge)}
  .room.office{background:var(--check),color-mix(in srgb,var(--orch) 10%,var(--floor))}
  .room.cafe{background:var(--check),color-mix(in srgb,var(--screen) 10%,var(--floor))}
  .room.nw{border-left:0;box-shadow:none}
  /* a raised floor: half-size tiles, cooler */
  .room.server{background:var(--check),color-mix(in srgb,var(--coder) 13%,var(--floor));background-size:17px 17px,auto}
  .door.n{top:0;width:32px;height:15px}
  .door.n::after{left:-1px;top:14px;width:3px;height:15px}
  .plate.dim{left:10px;top:auto;bottom:5px;color:var(--muted);font-size:10px;letter-spacing:.06em}
  /* a doorway is a gap in the wall with the leaf swung in */
  .door{position:absolute;left:-7px;width:8px;height:32px;background:var(--floor)}
  .door::after{content:"";position:absolute;left:7px;top:-1px;width:15px;height:3px;border-radius:1px;
    background:var(--wood-2)}
  .plate{position:absolute;left:12px;top:32px;font-family:var(--mono);font-size:10.5px;line-height:14px;
    color:var(--orch);white-space:nowrap}
  /* The big screen. A wall display is dark in both themes, like the racks: it is lit glass,
     not a surface of the room. Idle it ticks over dimly; with a team at the table it is
     the plan, one bar per role. The server room's wallboard is the same panel. */
  .tv{position:absolute;top:0;height:27px;border-radius:2px;background:#141A26;border:1.5px solid #0B0F17;
    padding:4px 7px;box-shadow:0 2px 0 var(--wall-edge)}
  .tv i{display:block;height:3px;margin-bottom:3px;border-radius:1px;background:#4FA6E0;opacity:.4;
    transform-origin:0 50%;animation:tv-bar 3.2s steps(5) infinite alternate}
  .tv i:nth-child(2){animation-delay:-1.1s} .tv i:nth-child(3){animation-delay:-2.3s}
  @keyframes tv-bar{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
  .room.on .tv i{opacity:1;background:#F2C14E}
  .room.on .tv i:nth-child(2){background:#4FA6E0} .room.on .tv i:nth-child(3){background:#E06C9F}
  .room.server .tv i{opacity:.85;background:#3FBE8B}
  /* the cabin's decor: books, a lamp, something won, and a carpet under the big table */
  .shelf{position:absolute;width:58px;height:17px;border-radius:2px;background:var(--wood);border:1px solid var(--wood-2);
    display:flex;gap:2px;padding:2px 3px;align-items:flex-end}
  .shelf i{flex:1;height:10px;border-radius:1px;background:var(--orch);box-shadow:inset 5px 0 0 var(--planner),inset 10px 0 0 var(--reviewer)}
  .shelf i:nth-child(2){height:8px;background:var(--tester);box-shadow:inset 6px 0 0 var(--coder)}
  .lamp{position:absolute;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--warn) 70%,var(--panel));
    border:1px solid var(--wood-2);box-shadow:0 0 0 5px color-mix(in srgb,var(--warn) 14%,transparent)}
  .award{position:absolute;width:13px;height:13px;border-radius:2px;background:var(--panel);border:1px solid var(--wall-edge)}
  .award::after{content:"";position:absolute;left:3px;top:2px;width:5px;height:6px;border-radius:1px 1px 3px 3px;background:var(--planner)}
  .carpet{position:absolute;left:30px;top:122px;right:14px;bottom:8px;border-radius:10px;
    background:color-mix(in srgb,var(--orch) 13%,var(--floor-2));border:1px solid color-mix(in srgb,var(--orch) 30%,var(--line));
    box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--orch) 7%,transparent)}
  .room.gate .carpet{background:color-mix(in srgb,var(--warn) 16%,var(--floor-2));
    border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
  .desk.boss{width:74px;height:32px}
  .desk.boss .scr.two{right:30px}
  .clock{position:absolute;left:110px;top:0;width:14px;height:14px;border-radius:50%;background:var(--panel);
    border:1px solid var(--wall-edge)}
  .clock i{position:absolute;left:5.5px;bottom:6px;width:1px;background:var(--bright);transform-origin:50% 100%}
  .clock .hh{height:3px} .clock .mm{height:5px}
  .conf{position:absolute;width:184px;height:152px}
  .conf .table{width:168px;height:84px;border-radius:18px}
  .conf .rug{display:none}                     /* the carpet does the rug's job in here */
  .conf-name{position:absolute;left:14px;right:14px;top:73px;z-index:1;text-align:center;font-family:var(--mono);
    font-size:10.5px;line-height:14px;color:var(--muted);text-decoration:none;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  a.conf-name{color:var(--bright)}
  a.conf-name:hover{text-decoration:underline;text-underline-offset:2px}
  /* a meeting is people taking turns: one bubble at a time goes round the table */
  .say{position:absolute;width:13px;height:9px;border-radius:4px;background:var(--panel);
    border:1px solid var(--line-2);opacity:0;animation:say 6s steps(1) infinite}
  .say::before{content:"";position:absolute;left:2.5px;top:3px;width:1.5px;height:1.5px;border-radius:50%;
    background:var(--muted);box-shadow:3px 0 var(--muted),6px 0 var(--muted)}
  @keyframes say{0%,23%{opacity:1}24%,100%{opacity:0}}
  /* the server room: racks are dark metal in both themes, and their lights never agree */
  .rack{position:absolute;top:4px;width:28px;height:50px;border-radius:2px;background:#1B2230;border:1px solid #0B0F17;
    box-shadow:0 3px 0 #0B0F17,inset 0 0 0 2px #232C3C;padding-top:3px}
  .rack i{display:block;width:3px;height:2px;margin:5px 0 0 5px;border-radius:1px;background:#3FBE8B;
    box-shadow:5px 0 #3FBE8B,10px 0 #4FA6E0,15px 0 #3FBE8B;animation:led 1.9s steps(1) var(--d,0ms) infinite}
  .rack i:nth-child(2){animation-duration:1.1s} .rack i:nth-child(3){animation-duration:2.7s;background:#F2C14E}
  .rack i:nth-child(4){animation-duration:.7s} .rack i:nth-child(5){animation-duration:1.5s}
  @keyframes led{0%,55%{opacity:1}56%,100%{opacity:.25}}
  .cool{position:absolute;top:3px;width:30px;height:30px;border-radius:3px;background:var(--panel);border:1px solid var(--wood-2)}
  .cool i{position:absolute;inset:5px;border-radius:50%;border:1px solid var(--wood-2);
    background:conic-gradient(var(--wood-2) 0 12%,transparent 0 50%,var(--wood-2) 0 62%,transparent 0);animation:fan 900ms steps(8) infinite}
  @keyframes fan{to{transform:rotate(360deg)}}
  .cable{position:absolute;top:62px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--coder) 45%,var(--floor-2));

  .fridge{position:absolute;left:192px;top:2px;width:28px;height:36px;border-radius:3px;background:var(--panel);

  .pong{position:absolute;left:92px;top:84px;width:90px;height:48px;border-radius:3px;
    background:color-mix(in srgb,var(--reviewer) 42%,var(--floor-2));border:1.5px solid var(--table-2);
    box-shadow:0 4px 0 var(--table-2),inset 0 0 0 2px color-mix(in srgb,var(--panel) 55%,transparent)}
  .pong::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--panel)}
  .pong i{position:absolute;left:0;top:0;width:4px;height:4px;border-radius:50%;background:var(--bright);
    animation:rally 2.6s steps(16) infinite}
  @keyframes rally{0%,100%{transform:translate(8px,10px)}25%{transform:translate(76px,30px)}
    50%{transform:translate(10px,34px)}75%{transform:translate(74px,8px)}}
  .sofa{position:absolute;left:142px;bottom:12px;width:84px;height:28px;border-radius:6px;background:var(--chairc);
    border:1px solid var(--wood-2);
    box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--bright) 10%,transparent),inset 6px 0 0 color-mix(in srgb,var(--bright) 6%,transparent),
      inset -6px 0 0 color-mix(in srgb,var(--bright) 6%,transparent)}
  .sofa::before{content:"";position:absolute;left:50%;top:3px;bottom:10px;width:1px;background:var(--wood-2)}

  /* ---- people on their feet ----
     An agent away from its chair is an actor on the floor: walking a corridor, or in your
     hand. Its seat keeps its place in the DOM and is only hidden, so the pod never reflows.
     The gait is still stepped (rule 1); what tells two walkers apart is tempo and carriage. */
  .body{cursor:grab}
  .body.gone{visibility:hidden}
  .who .leg{fill:var(--legs);transform-box:fill-box}
  .actor{position:absolute;left:0;top:0;z-index:4;cursor:grab}
  .actor::after{content:"";position:absolute;left:4px;right:4px;bottom:-2px;height:5px;border-radius:50%;
    background:rgba(0,0,0,.22);z-index:-1;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out)}
  .actor .who{transform-origin:50% 100%}
  @keyframes stride{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
  .actor.walking .who{animation:waiting var(--gait,260ms) steps(1) infinite}
  .actor.walking .leg.l,.actor.walking .arm.r{animation:stride var(--gait,260ms) steps(2) infinite alternate}
  .actor.walking .leg.r,.actor.walking .arm.l{animation:stride var(--gait,260ms) steps(2) calc(var(--gait,260ms) * -1) infinite alternate}
  .actor.brisk{--gait:170ms}
  .actor.amble{--gait:430ms}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .actor.amble.walking .who{animation:sway 860ms steps(4) infinite}
  .prop{position:absolute;border:1px solid var(--wood-2);border-radius:1px}
  .prop.clip{left:-1px;top:17px;width:6px;height:8px;background:var(--deskglass)}
  .prop.mug{left:19px;top:19px;width:6px;height:5px;background:var(--panel)}
  @keyframes sip{0%,60%,100%{transform:translateY(0)}70%,90%{transform:translateY(-7px)}}
  .actor.sip .prop.mug{animation:sip 2.1s steps(1) infinite}
  /* in your hand: lifted, kicking, wide-eyed; the shadow stays on the floor and shrinks */
  @keyframes dangle{from{transform:translateY(-9px) scale(1.2) rotate(-7deg)}to{transform:translateY(-9px) scale(1.2) rotate(7deg)}}
  .actor.held{cursor:grabbing;z-index:6}
  .actor.held .who{transform-origin:50% 0;animation:dangle 300ms steps(3) infinite alternate}
  .actor.held .leg.l{animation:stride 150ms steps(2) infinite alternate}

  .empty{color:var(--muted);font-size:13px;padding:36px 4px;font-family:var(--mono)}
  /* floating chrome over the floor: state key, hint, zoom HUD */
  .hud,.hint,.key{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--line);

  ::-webkit-scrollbar{width:9px;height:9px}

  /* One column: the work first, the head table under it. Both are placed explicitly on
     wide screens, so they have to be re-placed here or they share a single cell. */
  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
    .view{grid-column:1;grid-row:1}

  }

  /* Section 10.4 rule 6: every loop stops and the resting pose stays. Declared here so

<body>
<!-- The cast, inline so the page makes no runtime request. Original drawn work: the
     no-licence pixel set was not copied from, and DiceBear's pixel-art was tried and
     rejected on looks. Chibi proportions - the head is 8 of the 18 units. -->
<header>
  <span class="brand"><b>agent</b><span>·</span>orchestration</span>
  <div class="seg" id="view-seg">
    <button data-view="hall" class="sel">Hall</button><button data-view="office">Office</button>
  </div>
  <div class="seg" id="show-seg" role="group" aria-label="Which teams to show">
    <button data-show="active">Active<span class="n"></span></button><button
      data-show="ready">Ready to deploy<span class="n"></span></button><button
      data-show="done">Completed<span class="n"></span></button><button
      data-show="hidden">Hidden<span class="n"></span></button>
  </div>
  <span class="legend" id="legend"></span>
  <span class="spacer"></span>
  <a class="ghost" href="/estimates" title="Estimate against actual work, every run">Estimates</a>
  <span class="conn" id="conn"><span class="led"></span><span id="conn-txt">offline</span></span>
  <button class="ghost bell" id="alerts" type="button" aria-pressed="false"><span>Alerts off</span></button>
  <button class="ghost" id="theme">theme</button>
</header>
<div class="limit" id="limit" role="status" hidden></div>

<main>
  <aside class="head-table">
    <div>
      <div class="eyebrow" style="margin-bottom:8px">head table</div>
      <div class="orch-card">
        <div class="orch-top">
          <span class="orch-mark" id="orch-mark"></span>
          <span class="orch-id"><b>orchestrator</b><span class="orch-name">head table</span></span>
        </div>
        <div class="orch-doing" id="orch-doing">idle</div>
      </div>
    </div>
    <div class="counts" id="counts"></div>
    <div>
      <div class="reg-head"><span class="eyebrow">repositories</span>
        <span class="reg-total" id="reg-total"></span></div>
      <div class="reg" id="reg"></div>
      <form class="reg-add" id="reg-add">
        <input id="reg-input" placeholder="~/GoTrust/codebase/MFA_Server" spellcheck="false" />
        <button class="pri" type="submit">Index</button>
      </form>
      <a class="reg-link" href="http://localhost:9749/?tab=stats" target="_blank" rel="noreferrer">Open Codebase Memory &#8599;</a>
      <!-- The registry indexes nothing. server.js is stdlib Node with no MCP client, so a
           row displays what the hall payload carries and hands off to the graph UI above;
           `none` is the honest default for a repo nothing has reported on. -->
      <div class="reg-note">indexing runs in the graph service · rows here display and hand off</div>
    </div>
  </aside>

  <section class="view" id="hall"></section>
  <section class="view" id="office" hidden></section>
</main>

<footer id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Staleness: pipe.py stamps updatedAt on every run.json write, but `event` writes only
   messages.jsonl - and a status event is exactly what the runbook tells a long-working
   agent to emit so it does not look dead. So silence is the later of the two. Only
   "running" counts - awaiting_approval is supposed to sit still and done/blocked are
   terminal. */
const STALE_MS=180000; // 3 min
function staleMs(p){
  if(!p||p.status!=="running"||!p.updatedAt) return 0;
  const said=p.lastEvent&&p.lastEvent.ts;
  const age=Date.now()-Math.max(new Date(p.updatedAt),said?new Date(said):0);
  return age>STALE_MS?age:0;
}
function agoTxt(ms){const m=Math.floor(ms/60000);return m<60?`${m}m`:`${Math.floor(m/60)}h ${m%60}m`;}

/* run / gate / done / block / stale (silent while running) - the pill, the card border and the rug all read this one
   function, so they can never disagree. */
function cardState(p){
  if(p.status==="done") return "done";
  if(p.status==="awaiting_approval") return "gate";
  if(p.status==="blocked"||p.status==="failed") return "block";
  if(staleMs(p)) return "stale";
  return "run";
}

/* ---- section 10.3, the cast ----
   One body, one face, one hair layer. `back` is the seat's geometry (the near pair face
   away from you); `state` is what the agent is doing. */
function sprite(role,opts){
  const o=opts||{}, state=o.state||"wait", px=o.px||27;
  // Never turn a sleeping agent around - its shut eyes are the whole point of the pose.
  const rear=!!o.back&&state!=="sleep";
  // A seated agent is cropped at the waist: the rest is under a desk either way.
  // On its feet and going somewhere it has legs; the standing bust everywhere else has none.
  const h=o.seated?23:o.legs?34:30;
  const legs=o.legs?`<rect class="leg l" x="7.4" y="26" width="3.8" height="7.6" rx="1.7"
    /><rect class="leg r" x="12.8" y="26" width="3.8" height="7.6" rx="1.7"/>`:"";
  // From behind there is no face to leave room for, so the hair fills the whole skull.
  const hair=rear?`<circle cx="12" cy="9" r="7.2"/>`
    :`<path d="M4.8 9.4A7.2 7.2 0 0 1 19.2 9.4C17.6 6.6 14.9 5.6 12 5.6S6.4 6.6 4.8 9.4Z"/>`;
  const face=rear?"":`<circle class="eye" cx="9.4" cy="10.4" r="1.1"/><circle class="eye" cx="14.6" cy="10.4" r="1.1"/>`;
  return `<svg class="who a-${role} st-${state}" width="${px}" height="${(px/24*h).toFixed(1)}"
    viewBox="0 0 24 ${h}" aria-hidden="true">${legs}<rect class="arm l" x="2.5" y="17" width="4.5" height="9" rx="2.2"
    /><rect class="arm r" x="17" y="17" width="4.5" height="9" rx="2.2"/><rect class="torso" x="5" y="15"
    width="14" height="14" rx="5.5"/><circle class="head" cx="12" cy="9" r="7"/><g class="h-${role}">${hair}</g>${face
    }<text class="zz" x="19" y="4">z</text></svg>`;
}

/* Section 10.8-1: the operator gets a fifth seat on the bottom edge of the felt, and it
   renders ONLY when the run actually has one - the clockwise four-corner geometry is
   what makes position mean role, and most runs have no operator. The bus carries no
   dedicated flag yet (agents/operator.md is a later task), so presence is read from what
   it does carry: an operator holding the work, or one that has spoken. */
function hasOperator(p){
  return !!(p&&(p.operator||p.activeAgent==="operator"
    ||(p.lastEvent&&p.lastEvent.agent==="operator")));
}

let HALL={root:"",pipelines:[]};
let EXTRA_REPOS=[];   // repos you registered here; the payload owns the rest
let NEW_REPO=null;    // the one row that just arrived - entry 7 animates only that one
let DEMO=false;       // ?demo=1: hides change this page only, nothing is written

/* ---- which teams are on show ----
   Every team sits on exactly one shelf. Hidden wins over done, because hiding is the one
   you chose; the server ties a hide to the run it was made in, so a new wave returns to
   Active by itself. The hall and the office both draw shown(), never the raw scan. */
const SHOWS=["active","ready","done","hidden"];
let SHOW=SHOWS.includes(new URLSearchParams(location.search).get("show"))
  ?new URLSearchParams(location.search).get("show"):"active";
// Work completed is not the end: it waits on Ready to deploy until a human marks it.
const shelf=p=>p.hidden?"hidden":p.status!=="done"?"active":p.completed?"done":"ready";
// What needs you first, then what may have died, then what is moving; newest first within.
const URGENCY={gate:0,block:1,stale:1,run:2,done:3};
const byUrgency=(a,b)=>URGENCY[cardState(a)]-URGENCY[cardState(b)]
  ||String(b.updatedAt||"").localeCompare(String(a.updatedAt||""));
function shown(){return HALL.pipelines.filter(p=>shelf(p)===SHOW).sort(byUrgency);}
function shelfCounts(){
  const c={active:0,ready:0,done:0,hidden:0};
  for(const p of HALL.pipelines) c[shelf(p)]++;
  return c;
}

function repoRows(){
  // The service registry is what the project owns; run.repos[] is only what a workstream
  // has so far created worktrees for, and is empty for the whole of an in-place run - so
  // reading only that left this panel permanently empty.
  const seen=new Map();
  for(const s of (HALL.registry||[])) seen.set(s.name,{name:s.name,path:s.path});
  for(const p of HALL.pipelines) for(const r of (p.repos||[])) if(!seen.has(r)) seen.set(r,{name:r});
  for(const r of EXTRA_REPOS) if(!seen.has(r)) seen.set(r,{name:r});
  return [...seen.values()];
}
function paintTabs(){
  const c=shelfCounts();
  document.querySelectorAll("#show-seg button").forEach(b=>{
    b.classList.toggle("sel",b.dataset.show===SHOW);
    b.setAttribute("aria-pressed",String(b.dataset.show===SHOW));
    b.querySelector(".n").textContent=HALL.pipelines.length?c[b.dataset.show]:"";
  });
}
function renderHeadTable(){
  // A team you hid has stopped asking for attention, so it leaves the counts too.
  const ps=HALL.pipelines.filter(p=>!p.hidden);
  const running=ps.filter(p=>cardState(p)==="run").length;
  const awaiting=ps.filter(p=>cardState(p)==="gate").length;
  const quiet=ps.filter(p=>["stale","block"].includes(cardState(p))).length;
  document.getElementById("counts").innerHTML=
    `<div class="count"><b>${running}</b><span>running</span></div>
     <div class="count awaiting"><b>${awaiting}</b><span>awaiting you</span></div>
     <div class="count quiet"><b>${quiet}</b><span>quiet</span></div>`;

  // The orchestrator's one line, in the same voice as a team's last event.
  const evs=ps.map(p=>p.lastEvent).filter(Boolean).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const own=evs.filter(e=>e.agent==="orchestrator");
  const e=own.length?own[own.length-1]:evs[evs.length-1];
  document.getElementById("orch-doing").textContent=
    e?e.summary:(ps.length?`watching ${ps.length} team${ps.length>1?"s":""}`:"idle");

  const rows=repoRows();
  document.getElementById("reg").innerHTML=rows.length?rows.map(r=>{
    // fresh / drift (HEAD moved) / none (never indexed) - whatever the payload carries.
    // fresh / drift (HEAD moved) / none (never indexed) - whatever the payload carries.
    // Nothing reports it today, so the honest right-hand value is a dash rather than a
    // count this server cannot know: the graph service owns that and the link hands off.
    const st=r.index||"none";
    const right=r.nodes!=null?Number(r.nodes).toLocaleString("en-US")
              :st==="drift"?"HEAD moved":st==="none"?"—":"indexed";
    return `<div class="repo ${esc(st)}${r.name===NEW_REPO?" enter":""}" title="${esc(r.path||r.name)}"
      ><span class="dot"></span><span class="repo-name">${esc(r.name)}</span>
      <span class="repo-nodes">${esc(right)}</span></div>`;
  }).join(""):`<div class="reg-note">no <code>agent-orchestration.config.json</code> found above this
      server's working directory, and no workstream has recorded a repo yet</div>`;
  NEW_REPO=null;
  const known=rows.filter(r=>r.nodes!=null);
  document.getElementById("reg-total").textContent = known.length
    ? known.reduce((a,r)=>a+Number(r.nodes),0).toLocaleString("en-US")+" nodes"
    : rows.length ? rows.length+" registered" : "";
  const mk=document.getElementById("orch-mark");
  if(mk && !mk.childElementCount) mk.innerHTML=sprite("orch",{px:22});

  // The tabs carry the per-shelf counts; the footer says what is being watched.
  const all=HALL.pipelines.length;
  document.getElementById("foot").innerHTML=
    `<b>${all}</b> team${all===1?"":"s"} under ${esc(HALL.root)}`;
  paintTabs();

  // The cast named once in the chrome, so a role colour inside a card never needs decoding.
  const lg=document.getElementById("legend");
  if(!lg.childElementCount)
    lg.innerHTML=TEAM.map(([role,label])=>
      `<span class="l-${role}">${sprite(role,{px:15})}${label}</span>`).join("");
}

/* The team in pipeline order: the role and the short label the legend uses. */
const TEAM=[["planner","plan"],["coder","code"],["tester","test"],["reviewer","review"]];
const RAIL=["spec","plan","implement","test","review","done"];
const STAGE={planner:1,coder:2,tester:3,reviewer:4,operator:2};
// The hall's rail has no qa tick (section 10.2), so qa reads as the end of review.
function railIdx(ph){return ph==="qa"?4:RAIL.indexOf(ph);}

/* Rule 2: exactly one agent per table types. The rest wait, or sleep once their stage is
   behind the run - "busy" stays legible by being the exception in its own row. */
function seatState(p,role){
  if(p.status==="done") return "sleep";
  const past=railIdx(p.phase)>STAGE[role];
  // At a gate every seat not yet past its stage has a hand up; blocked, the holder is stuck.
  if(p.status==="awaiting_approval") return past?"sleep":"ask";
  if(p.status==="blocked"||p.status==="failed") return p.activeAgent===role?"stuck":past?"sleep":"wait";
  if(p.activeAgent===role) return "type";
  return past?"sleep":"wait";
}
const AGENT_COLOR={planner:"var(--planner)",coder:"var(--coder)",tester:"var(--tester)",
  reviewer:"var(--reviewer)",operator:"var(--orch)",orchestrator:"var(--orch)"};

function testCount(p){
  const s=p.services; if(!s) return null;
  const v=Object.values(s);
  const passed=v.reduce((a,x)=>a+(x.passed||0),0), failed=v.reduce((a,x)=>a+(x.failed||0),0);
  return passed+failed?{passed,failed,total:passed+failed}:null;
}

// Lucide's eye and eye-off (ISC), inline so the page still makes no runtime request.
